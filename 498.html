<section id="entry" class="active"><div class="row between" style="margin-bottom:20px"><h2>录单工作台</h2></div><div class="grid" style="grid-template-columns:1fr"><div class="card"><div class="row between"><h3>录入内容</h3><select id="customer"></select></div><div class="row"><button onclick="replaceText()">快速替换</button><button onclick="clean()">去除空行</button><button onclick="completeText()">智能补全</button><label><input type="checkbox" id="marked">标记订单</label></div><textarea id="text" placeholder="粘贴订单内容，例如：&#10;13,20,33,37,42,48各20&#10;11,19,26,28,35,40各10&#10;香港 三中三 21-27-12/80"></textarea><div class="row between"><span id="draftState" class="muted">尚未确认</span><span id="count" class="tag">0 项</span></div><div class="entry-summary"><div class="row between"><span>总金额：<strong id="entryTotal">¥0.00</strong></span><span>总返点：<strong id="entryRebate">¥0.00</strong></span></div><div class="row between"><span>待提交 <strong id="pendingCount">0</strong> 笔</span><span>合计 <b id="pendingTotal">¥0.00</b> <button id="detailsToggle" onclick="toggleRecognition()">详情 ›</button></span></div><div id="recognition" hidden></div><div class="entry-actions"><button onclick="clearInput()">清空内容</button><button onclick="confirmDraft()">确认结果</button><button id="submitDraftButton" onclick="submitDraft()">提交 0 笔</button></div><div id="recognitionIssues" class="error" aria-live="polite"></div></div></div></div></section>

function normalizeMixedText(source){

  const amountPattern=/(?:各(?:组|肖|号)?\s*|买\s*|[\/＝=]\s*)(\d+(?:\.\d+)?|[零一二两三四五六七八九十百千万]+)(?:元|块)?|\s+([零一二两三四五六七八九十百千万]*[十百千万][零一二两三四五六七八九十百千万]*)(?:元|块)?(?=\s|$)/g;
  const cuts=[...line.matchAll(amountPattern)];
  if(!cuts.length){output.push(line);continue}

  for(const cut of cuts){
   let body=line.slice(start,cut.index).trim().replace(/^[,:\s]+|[,:\s]+$/g,'');start=cut.index+cut[0].length;
   const amount=cut[1]||cut[2],each=/^各/.test(cut[0]),kind=/各肖/.test(cut[0])?'各肖':each?'各':'';

function rate(o,g){const r=(o.rates||S.rates)[o.play]?.[0],sp=o.special||S.special,yr=o.year||S.year;if(o.play==='平尾'&&g.includes(0))return sp.zero;if(o.play==='一肖中'&&g.includes(yr))return sp.year;if(o.play.includes('肖')&&g.includes(yr)&&g.length>1)return sp[['','','two','three','four','five'][g.length]];return r}

function readDraw(){const n=($('drawNumbers').value.match(/\d+/g)||[]).map(Number);if(n.length!==7||new Set(n).size!==7||n.some(x=>x<1||x>49))return null;return{market:$('drawMarket').value,period:$('drawPeriod').value.trim(),numbers:n}}function previewDraw(){const d=readDraw();if(!d){$('drawPreview').innerHTML='<small>请填写7个不重复的有效号码</small>';return}$('drawPreview').innerHTML=d.numbers.map(ball).join('')+`<span class="tag">特码 ${d.numbers[6]}</span>`;renderSettlements(d)}function saveDraw(){let d=readDraw();if(!d||!d.period)return toast('请填写期号及7个不重复的号码');if(S.draws.some(x=>x.market===d.market&&x.period===d.period))return askInline('覆盖该期开奖记录并重新兑奖？',()=>commitDraw(d),'draw');commitDraw(d)}
function commitDraw(d){S.draws=S.draws.filter(x=>x.market!==d.market||x.period!==d.period);S.draws.push(d);save();const id=d.market==='香港'?'hkPeriod':'macauPeriod',next=nextPeriod(d.period);if(next&&$(id).value===d.period){$(id).value=next;localStorage.setItem('stats49-period-'+(d.market==='香港'?'hk':'macau'),next);$('period').value=$($('market').value==='香港'?'hkPeriod':'macauPeriod').value;parseText()}renderAll();toast('已完成兑奖，录单期号已更新')}function removeDraw(i){const d=S.draws[i];if(!d)return;askInline('删除 '+d.market+' '+d.period+' 开奖记录并回撤兑奖？',()=>{S.draws=S.draws.filter(x=>x!==d);save();renderAll();toast('已删除开奖记录并回撤兑奖')},'draw')}
function renderSettlements(preview){let d=preview||S.draws.find(d=>d.market===$('drawMarket').value&&d.period===$('drawPeriod').value);let os=S.orders.filter(o=>!o.cancel&&o.market===$('drawMarket').value&&o.period===$('drawPeriod').value);$('settlements').innerHTML=`<div class="card"><h3>客户兑奖详情${preview?' · 实时预览':''}</h3>${S.customers.map(c=>{let a=os.filter(o=>o.customer===c);if(!a.length)return '';let bet=sum(a.map(o=>o.total)),pay=sum(a.map(o=>evaluate(o,d).pay)),pending=a.some(o=>evaluate(o,d).pending);return `<details><summary>${esc(c)}　下注 ${money(bet)}　赔付 ${money(pay)}　${d?(pending?'待设置赔率':pay>bet?'应付 '+money(pay-bet):'应收 '+money(bet-pay)):'待开奖'}</summary><div class="scroll">${table(['玩法','内容','下注','中奖组','赔付'],a.map(o=>[o.play,esc(o.content),money(o.total),evaluate(o,d).wins,money(evaluate(o,d).pay)]))}</div></details>`}).join('')||'<div class="empty">暂无客户订单</div>'}</div>`}
function rebate(o){return o.total*((o.rates||S.rates)[o.play]?.[1]||0)/100}function kpis(id,items){$(id).innerHTML=items.map(([a,b])=>`<div class="card"><small>${a}</small><div class="big">${b}</div></div>`).join('')}function renderRisk(){let os=active(),bet=sum(os.map(o=>o.total)),reb=sum(os.map(rebate)),pay=sum(os.map(o=>result(o).pay));kpis('riskKpis',[['总收注',money(bet)],['总返点',money(reb)],['已中奖赔付',money(pay)],['当前正负（含返点）',money(bet-pay+reb)]]);let rows=Array.from({length:49},(_,i)=>{let n=i+1,b=0,count=0,p=0;for(const o of os.filter(o=>o.play==='特码'))o.groups.forEach((g,j)=>{if(g[0]===n){b+=o.stakes[j];p+=o.stakes[j]*rate(o,g);count++}});return{n,b,p,count}}).sort((a,b)=>b.p-a.p);$('riskTable').innerHTML=table(['风险排行','号码／波色','生肖','下注金额','理论赔付','下注注数'],rows.map((r,i)=>[i+1,ball(r.n),zodiac(r.n),money(r.b),`<span style="color:${r.p>bet&&r.p?'#d24555':'inherit'}">${money(r.p)}${i===0&&r.p?' · 最大赔付':''}</span>`,r.count]))}
function allocate(id,mode,val){const o=S.orders.find(o=>o.id===id);if(o.allocation?.received)return toast('订单已锁定，请先回撤解锁');const v=Number(val),keep=mode==='percent'?o.total*v/100:mode==='out'?o.total-v:v;if(!Number.isFinite(v)||keep<0||keep>o.total)return toast('分配金额必须在0至订单总额之间');o.allocation={keep:Math.round(keep*100)/100,received:false};save();renderRetain()}function confirmUpstream(customerIndex){const c=Number.isInteger(customerIndex)?S.customers[customerIndex]:null;let a=active().filter(o=>(!c||o.customer===c)&&o.allocation&&!o.allocation.received);if(!a.length)return toast('没有可确认的已分配订单');a.forEach(o=>o.allocation.received=true);save();renderRetain();toast('已确认上家收到，订单已锁定')}
function unlockAllocation(id){const o=S.orders.find(o=>o.id===id);if(!o?.allocation)return;o.allocation.received=false;save();renderRetain();toast('已解锁，可修改原分配')}
function unlockCustomer(index){active().filter(o=>o.customer===S.customers[index]&&o.allocation?.received).forEach(o=>o.allocation.received=false);save();renderRetain();toast('该客户订单已解锁')}
function allocationRow(o){const locked=!!o.allocation?.received;return `<details><summary>${esc(o.play)} ${esc(o.content)}　${money(o.total)}　<span class="tag">${locked?'已收 · 已锁定':o.allocation?'已分配':'待分配'}</span></summary>${locked?`<p>自留 ${money(o.allocation.keep)}　转出 ${money(o.total-o.allocation.keep)}</p><div class="row"><button onclick="transfer('${o.id}')">复制转单</button><button onclick="unlockAllocation('${o.id}')">回撤解锁</button></div>`:`<div class="row"><label>自留金额<input type="number" min="0" max="${o.total}" value="${o.allocation?.keep??''}" onchange="allocate('${o.id}','keep',this.value)" style="width:130px"></label><label>转出金额<input type="number" min="0" value="${o.allocation?+(o.total-o.allocation.keep).toFixed(2):''}" onchange="allocate('${o.id}','out',this.value)" style="width:130px"></label><label>自留比例 %<input type="number" min="0" max="100" onchange="allocate('${o.id}','percent',this.value)" style="width:90px"></label><button onclick="allocate('${o.id}','percent',100)">全留</button><button onclick="allocate('${o.id}','percent',0)">全转</button><button onclick="transfer('${o.id}')">复制转单</button><button onclick="resetAllocation('${o.id}')">撤回分配</button></div>`}</details>`}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('已复制')}catch{const p=actionPanel();p.innerHTML='<div class="total"><strong>请长按下方文字复制</strong><textarea id="manualCopy" readonly aria-label="待复制内容"></textarea><button onclick="cancelInline()">收起</button></div>';$('manualCopy').value=s;p.scrollIntoView({block:'nearest',behavior:'smooth'});toast('自动复制不可用，可长按文字复制')}}function transfer(id){let o=S.orders.find(o=>o.id===id);if(!o.allocation)return toast('请先分配');const ratio=(o.total-o.allocation.keep)/o.total;copy(`${o.market} ${o.period}\n${o.play} ${o.content}\n${o.groups.map((g,i)=>g.join('-')+'/'+(o.stakes[i]*ratio).toFixed(2)).join('\n')}\n转出合计：${money(o.total-o.allocation.keep)}`)}
function customerCopy(c){let os=active().filter(o=>o.customer===c),bet=sum(os.map(o=>o.total)),pay=sum(os.map(o=>result(o).pay));copy(`${c} ${$('market').value} ${$('period').value}\n下注：${money(bet)}\n中奖赔付：${money(pay)}\n${os.map(o=>`${o.play} ${o.content} 下注${money(o.total)}\n`+o.groups.map((g,i)=>{const one={...o,groups:[g],stakes:[o.stakes[i]]},r=result(one);return r.wins?`${g.join('-')}：${money(o.stakes[i])} × ${rate(o,g)} = ${money(r.pay)}`:''}).filter(Boolean).join('\n')).join('\n')}\n客户正负：${money(pay-bet)}${os.some(o=>!drawFor(o))?'（含未开奖订单，尚未结算）':''}`)}function renderRetain(){let os=active(),allocated=os.filter(o=>o.allocation),keep=sum(allocated.map(o=>o.allocation.keep)),out=sum(allocated.map(o=>o.total-o.allocation.keep));kpis('retainKpis',[['全盘汇总',money(sum(os.map(o=>o.total)))],['总单数／客户数',os.length+' / '+new Set(os.map(o=>o.customer)).size],['自留／转出',money(keep)+' / '+money(out)],['总返点／全盘中奖',money(sum(os.map(rebate)))+' / '+money(sum(os.map(o=>result(o).pay)))]]);$('allocations').innerHTML=S.customers.map((c,index)=>({c,index,orders:os.filter(o=>o.customer===c)})).filter(g=>g.orders.length).sort((a,b)=>Number(!a.orders.some(o=>!o.allocation))-Number(!b.orders.some(o=>!o.allocation))).map(g=>{const pending=g.orders.filter(o=>!o.allocation).length,locked=g.orders.filter(o=>o.allocation?.received).length;return `<details class="customer-allocation" ${pending?'open':''}><summary>${esc(g.c)}　${g.orders.length} 单 · 待分配 ${pending} · 已锁定 ${locked}　${money(sum(g.orders.map(o=>o.total)))}</summary><div class="row"><button class="primary" onclick="confirmUpstream(${g.index})">确认该客户上家已收</button>${locked?`<button onclick="unlockCustomer(${g.index})">回撤该客户锁定</button>`:''}</div>${g.orders.slice().sort((a,b)=>Number(!!a.allocation)-Number(!!b.allocation)||Number(!!a.allocation?.received)-Number(!!b.allocation?.received)).map(allocationRow).join('')}</details>`}).join('')||'<div class="empty">当前期号暂无订单</div>' ;$('customerSummary').innerHTML=S.customers.map(c=>{let a=os.filter(o=>o.customer===c);if(!a.length)return '';let profit=sum(a.filter(o=>o.allocation&&drawFor(o)).map(o=>(o.total-result(o).pay+rebate(o))*o.allocation.keep/o.total));return `<div class="card"><div class="row between"><h3>${esc(c)} · 汇总明细</h3><button onclick='customerCopy(${JSON.stringify(c)})'>复制客户明细</button></div><p>下注 ${money(sum(a.map(o=>o.total)))}　中奖赔付 ${money(sum(a.map(o=>result(o).pay)))}　已兑奖自留正负 ${money(profit)}</p><small>${a.every(o=>drawFor(o))?'已兑奖':'含待开奖订单'}</small></div>`}).join('')}function resetAllocation(id){const o=S.orders.find(o=>o.id===id);if(o.allocation?.received)return toast('订单已锁定，请先回撤解锁');o.allocation=null;save();renderRetain()}
function customers(){let previous=$('customer').value;$('customer').innerHTML=S.customers.map(c=>`<option>${esc(c)}</option>`).join('');if(S.customers.includes(previous))$('customer').value=previous;let f=$('filterCustomer').value;$('filterCustomer').innerHTML='<option value="">全部客户</option>'+S.customers.map(c=>`<option>${esc(c)}</option>`).join('');$('filterCustomer').value=f;$('customers').innerHTML=S.customers.map((c,i)=>`<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>${esc(c)}</span><button class="danger" onclick="deleteCustomer(${i})">删除</button></div>`).join('')}function addCustomer(){const c=$('newCustomer').value.trim();if(!c||S.customers.includes(c))return toast('名称为空或已存在');S.customers.push(c);$('newCustomer').value='';save();customers()}let pendingCustomerDelete=null;
function deleteCustomer(i){const c=S.customers[i];if(c===undefined)return;pendingCustomerDelete=c;let panel=$('customerDeletePanel');if(!panel){panel=document.createElement('div');panel.id='customerDeletePanel';$('customers').before(panel)}panel.innerHTML=`<div class="total"><strong>删除客户 ${esc(c)}？</strong><p>将同时清除该客户的全部历史订单。${S.customers.length===1?'删除后将恢复默认客户🐟。':''}</p><div class="row"><button class="danger" onclick="confirmDeleteCustomer()">确认删除</button><button onclick="cancelDeleteCustomer()">取消</button></div></div>`;panel.scrollIntoView({block:'nearest',behavior:'smooth'})}
function cancelDeleteCustomer(){pendingCustomerDelete=null;const panel=$('customerDeletePanel');if(panel)panel.innerHTML=''}
function confirmDeleteCustomer(){const c=pendingCustomerDelete;if(c===null||!S.customers.includes(c))return;S.customers=S.customers.filter(x=>x!==c);S.orders=S.orders.filter(o=>o.customer!==c);if(!S.customers.length)S.customers=['🐟'];cancelDeleteCustomer();save();renderAll();parseText();toast('已删除客户及其历史订单')}
function renderSettings(){$('rates').innerHTML=table(['玩法','赔率（含本金）','返点 %'],Object.entries(S.rates).map(([p,v])=>[p,`<input data-rate="${p}" type="number" min="0" step="0.01" value="${v[0]??''}" placeholder="待设置">`,`<input data-rebate="${p}" type="number" min="0" max="100" step="0.01" value="${v[1]}">`]))+table(['特殊赔率','倍数'],Object.entries({zero:'0尾',year:'年肖',two:'二连肖带年肖',three:'三连肖带年肖',four:'四连肖带年肖',five:'五连肖带年肖'}).map(([k,v])=>[v,`<input data-special="${k}" type="number" min="0" step="0.01" value="${S.special[k]}">`]));$('yearAnimal').innerHTML=animals.map(a=>`<option ${a===S.year?'selected':''}>${a}</option>`).join('');$('maps').innerHTML=['zodiac','elements','colors'].map(k=>`<h3 style="margin-top:20px">${({zodiac:'生肖',elements:'五行',colors:'波色'})[k]}</h3>`+Object.entries(S[k]).map(([a,ns])=>`<label style="display:flex;margin:8px 0">${a}<input style="flex:1" data-map="${k}" data-key="${a}" value="${ns.map(n=>String(n).padStart(2,'0')).join(' ')}"></label>`).join('')).join('');$('combinations').innerHTML=table(['数量','二组','三组','四组','五组'],Array.from({length:11},(_,i)=>{let n=i+2;return[n,...[2,3,4,5].map(k=>combos(Array.from({length:n},(_,j)=>j),k).length||'—')]}));let keys=[...new Set(S.orders.filter(o=>!o.cancel&&drawFor(o)).map(o=>o.market+'|'+o.period))];$('ledger').innerHTML=table(['盘口／期号','自留返点','自留净额（不含返点）','合计'],keys.map(k=>{let a=S.orders.filter(o=>!o.cancel&&o.market+'|'+o.period===k&&o.allocation),reb=sum(a.map(o=>rebate(o)*o.allocation.keep/o.total)),p=sum(a.map(o=>(o.total-result(o).pay)*o.allocation.keep/o.total));return[esc(k),money(reb),money(p),money(p+reb)]}))}
function saveRates(){let rates=structuredClone(S.rates),special={...S.special};for(const e of document.querySelectorAll('[data-rate]')){if(e.value!==''&&!(+e.value>0))return toast('赔率必须大于0');rates[e.dataset.rate][0]=e.value===''?null:+e.value}for(const e of document.querySelectorAll('[data-rebate]')){if(+e.value<0||+e.value>100)return toast('返点应在0至100之间');rates[e.dataset.rebate][1]=+e.value}for(const e of document.querySelectorAll('[data-special]')){if(!( +e.value>0))return toast('特殊赔率必须大于0');special[e.dataset.special]=+e.value}S.rates=rates;S.special=special;for(const o of S.orders)if(o.rates?.五连尾?.[0]===null&&rates.五连尾[0])o.rates.五连尾[0]=rates.五连尾[0];save();toast('已保存；已录订单保留录入时赔率')}function saveMaps(){let maps={zodiac:{},elements:{},colors:{}};for(const e of document.querySelectorAll('[data-map]')){let ns=(e.value.match(/\d+/g)||[]).map(Number);if(!ns.length||new Set(ns).size!==ns.length||ns.some(n=>n<1||n>49))return toast('号码须为1至49且同一项不能重复');maps[e.dataset.map][e.dataset.key]=ns}for(const k of Object.keys(maps)){let ns=Object.values(maps[k]).flat();if(ns.length!==49||new Set(ns).size!==49)return toast('每类映射须完整覆盖1至49且不得重复')}Object.assign(S,maps);S.year=$('yearAnimal').value;save();parseText();toast('号码映射已保存')}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='49统计备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function importData(input){try{let d=JSON.parse(await input.files[0].text());if(!Array.isArray(d.orders)||!Array.isArray(d.customers)||!d.customers.length||!d.rates||!d.zodiac||!d.special||!Array.isArray(d.draws))throw Error();askInline('恢复备份将替换全部当前数据，继续？',()=>{S=d;save();renderAll();parseText();toast('备份已恢复')},'settings')}catch{toast('备份格式无效')}input.value=''}
function summaryData(){const os=active();return {os,bet:sum(os.map(o=>o.total)),reb:sum(os.map(rebate)),pay:sum(os.map(o=>result(o).pay))}}
function copyAllSummary(){const {os,bet,reb,pay}=summaryData();copy(`${$('market').value} ${$('period').value} 全盘汇总\n总单数：${os.length}\n客户数：${new Set(os.map(o=>o.customer)).size}\n下注：${money(bet)}\n返点：${money(reb)}\n中奖赔付：${money(pay)}\n庄家当前正负（含返点）：${money(bet-pay+reb)}\n`+S.customers.map(c=>{const a=os.filter(o=>o.customer===c);if(!a.length)return '';const b=sum(a.map(o=>o.total)),p=sum(a.map(o=>result(o).pay));return `${c}：下注 ${money(b)}，赔付 ${money(p)}，客户正负 ${money(p-b)}（${a.every(o=>drawFor(o))?'已兑奖':'含待开奖'}）`}).filter(Boolean).join('\n'))}
function renderSummary(){const {os,bet,reb,pay}=summaryData();kpis('summaryKpis',[['全盘下注',money(bet)],['总单数／客户数',os.length+' / '+new Set(os.map(o=>o.customer)).size],['总返点',money(reb)],['全盘中奖赔付',money(pay)]]);$('summaryTable').innerHTML=table(['客户','下注总金额','中奖赔付','应收／应付','结果状态','操作'],S.customers.map((c,i)=>{const a=os.filter(o=>o.customer===c);if(!a.length)return null;const b=sum(a.map(o=>o.total)),p=sum(a.map(o=>result(o).pay)),done=a.every(o=>drawFor(o)&&!result(o).pending);return [esc(c),money(b),money(p),done?(p>b?'应付 '+money(p-b):'应收 '+money(b-p)):'待结算',done?'已兑奖':'待开奖／待核对',`<button onclick="customerCopy(S.customers[${i}])">复制明细</button>`]}).filter(Boolean));$('summaryCustomers').innerHTML=S.customers.map((c,i)=>{const a=os.filter(o=>o.customer===c);if(!a.length)return '';return `<details class="card"><summary>${esc(c)} · ${a.length} 单 · 下注 ${money(sum(a.map(o=>o.total)))}</summary><div class="scroll">${table(['玩法','内容','组数','下注','中奖组','赔付','状态'],a.map(o=>[esc(o.play),esc(o.content),o.groups.length,money(o.total),result(o).wins,money(result(o).pay),status(o)]))}</div><button onclick="customerCopy(S.customers[${i}])">复制客户明细</button></details>`}).join('')}
function renderAll(){renderSummary();customers();renderOrders();renderRisk();renderRetain();renderSettings();renderSettlements();$('history').innerHTML=table(['盘口／期号','号码','操作'],S.draws.map((d,i)=>[esc(d.market)+' / '+esc(d.period),d.numbers.map(ball).join(''),`<button class="danger" onclick="removeDraw(${i})">删除并回撤兑奖</button>`]))}
function validPeriod(p){return /^\d{4}-\d{3,}$/.test(p||'')?p:''}
function nextPeriod(p){const m=p.match(/^(\d{4})-(\d+)$/);return m?m[1]+'-'+String(+m[2]+1).padStart(m[2].length,'0'):null}
function syncPeriod(){const key=$('market').value==='香港'?'hkPeriod':'macauPeriod';$('macauPeriodLabel').style.display=key==='macauPeriod'?'inline-flex':'none';$('hkPeriodLabel').style.display=key==='hkPeriod'?'inline-flex':'none';$('period').value=$(key).value;$('drawMarket').value=$('market').value;$('drawPeriod').value=$('period').value;parseText();renderAll()}
$('macauPeriod').value=validPeriod(localStorage.getItem('stats49-period-macau'))||'2026-303';$('hkPeriod').value=validPeriod(localStorage.getItem('stats49-period-hk'))||'2026-116';
$('text').value=localStorage.getItem('stats49-draft')||'';$('text').addEventListener('input',parseText);$('customer').addEventListener('change',parseText);for(const [id,key] of [['macauPeriod','macau'],['hkPeriod','hk']])$(id).addEventListener('input',()=>{localStorage.setItem('stats49-period-'+key,$(id).value);syncPeriod()});$('market').addEventListener('change',syncPeriod);
$('drawNumbers').addEventListener('input',previewDraw);$('drawMarket').addEventListener('change',()=>{renderSettlements();previewDraw()});$('drawPeriod').addEventListener('input',()=>{renderSettlements();previewDraw()});syncPeriod();
</script></html>
