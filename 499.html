let pendingEditKind='';function showEditPreview(kind,title,result){pendingEditKind=kind;const panel=$('editPreview');panel.style.display='block';$('editPreviewTitle').textContent=title;$('replaceEditor').style.display=kind==='replace'?'flex':'none';$('editPreviewText').value=result;(document.getElementById('editPreviewHint')||{textContent:''}).textContent='';panel.scrollIntoView({block:'nearest',behavior:'smooth'})}

function previewReplacement(){
 const source=$('entryText').value,from=$('replaceFrom').value,to=$('replaceTo').value,hint=$('editPreviewHint');
 replacementPreviewSignature=replacementSignature();
 if(!from){$('editPreviewText').value=source;hint.textContent='请先填写要查找的文字或符号';return false}

 return true;
}

const PLAY_WHEEL_NAMES=['特码','特碰','二中二','三中三','一肖中','二肖中','三肖中','四肖中','五肖中','复式二连肖','复式三连肖','复式四连肖','复式五连肖','平尾','二连尾','三连尾','四连尾','五连尾','复式二连尾','复式三连尾','复式四连尾','复式五连尾','平特一肖','平特尾','五不中','六不中','七不中','八不中','九不中','十不中'];
let playWheelCursor=0,playWheelIndex=0,playWheelTimer=null;
function openPlayWheel(){
 const input=document.getElementById('entryText');if(!input)return;
 playWheelCursor=Number.isInteger(input.selectionStart)?input.selectionStart:input.value.length;
 const old=document.getElementById('playWheelMask');if(old)old.remove();
 const mask=document.createElement('div');mask.id='playWheelMask';mask.className='play-wheel-mask';
 mask.innerHTML='<div class="play-wheel-sheet" role="dialog" aria-label="选择补全玩法"><div class="play-wheel-head"><button type="button" id="playWheelCancel">取消</button><strong>选择玩法名称</strong><button type="button" id="playWheelDone">完成</button></div><div class="play-wheel-viewport"><div class="play-wheel-highlight"></div><div class="play-wheel-list" id="playWheelList"><div style="height:88px;flex:none"></div>'+PLAY_WHEEL_NAMES.map((n,i)=>'<div class="play-wheel-option" data-index="'+i+'">'+n+'</div>').join('')+'<div style="height:88px;flex:none"></div></div></div></div>';
 document.body.appendChild(mask);
 const list=document.getElementById('playWheelList');
 playWheelIndex=0;
 const sync=()=>{playWheelIndex=Math.max(0,Math.min(PLAY_WHEEL_NAMES.length-1,Math.round(list.scrollTop/44)));list.querySelectorAll('.play-wheel-option').forEach((el,i)=>el.classList.toggle('selected',i===playWheelIndex));};
 list.addEventListener('scroll',()=>{sync();clearTimeout(playWheelTimer);playWheelTimer=setTimeout(()=>list.scrollTo({top:playWheelIndex*44,behavior:'smooth'}),130)},{passive:true});
 list.querySelectorAll('.play-wheel-option').forEach((el,i)=>el.addEventListener('click',()=>{list.scrollTo({top:i*44,behavior:'smooth'});playWheelIndex=i;sync()}));
 document.getElementById('playWheelCancel').onclick=()=>mask.remove();
 mask.addEventListener('click',e=>{if(e.target===mask)mask.remove()});
 document.getElementById('playWheelDone').onclick=()=>{
   sync();const original=input.value,insert=PLAY_WHEEL_NAMES[playWheelIndex];
   const result=original.slice(0,playWheelCursor)+insert+original.slice(playWheelCursor);
   mask.remove();showEditPreview('complete','玩法名称 · 修改预览',result);
 };

}

function completeText(){
 let t=$('entryText').value;
 // 只补全玩法前缀，保留原有号码、生肖、金额和分组分隔符。
 t=t.replace(/(^|[\s\n，,。;；])([二三四五])肖(?!中|连肖)(?=[\s，,。:：、.\-/]|[鼠牛虎兔龙蛇马羊猴鸡狗猪])/g,(m,pre,n)=>pre+n+'肖中');
 t=t.replace(/(^|[\s\n，,。;；])([2345])肖(?!中|连肖)(?=[\s，,。:：、.\-/]|[鼠牛虎兔龙蛇马羊猴鸡狗猪])/g,(m,pre,n)=>pre+({'2':'二','3':'三','4':'四','5':'五'}[n])+'肖中');
 t=t.replace(/(^|[\s\n，,。;；])连尾[\s，,。:：、]*/g,(m,pre,offset,full)=>{
   const rest=full.slice(offset+m.length).split(/[\n;；]/)[0];
   const groups=rest.match(/[0-9](?:[\s，,。、.\-/]+[0-9])+/g)||[];
   const first=groups[0];if(!first)return m;
   const count=(first.match(/[0-9]/g)||[]).length;
   return pre+({2:'两',3:'三',4:'四',5:'五'}[count]||'')+'连尾 ';
 });
 showEditPreview('complete','补全玩法前缀 · 修改预览',t)
}

function clearEntry(){draftText='';confirmed=[];parsed=[];S.lastInput='';$('entryText').value='';closeEditPreview();save();parseNow();const status=document.getElementById('entryStatus');if(status)status.textContent='已清空录入内容'};function confirmEntry(){if(parsed.some(x=>x.error)||!parsed.length)return alert('请先处理识别异常');confirmed=structuredClone(parsed);$('entryStatus').textContent=`已确认 ${confirmed.length} 项，合计 ¥${money(sum(confirmed,x=>x.stake))}`};function submitEntry(){if(!confirmed.length)return alert('请先点击确认结果');S.orders.push(...confirmed);eatApplySavedRules(new Set(confirmed.map(o=>o.market+'|'+o.period)));confirmed=[];draftText='';S.lastInput='';save();render();alert('订单提交成功')}
function ordersPage(){let market=filterMarket,period=periodChoices(market).includes(viewPeriod)?viewPeriod:S.periods[market],rows=scopedOrders(market,period);return `<section class="panel"><h2>订单管理</h2>${scopePicker('order',market,period)}<div class="row"><select id="orderCustomer"><option value="">全部客户</option>${S.customers.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="orderSearch" placeholder="投注内容/玩法"><select id="orderStatus"><option value="">全部状态</option><option>待开奖</option><option>已兑奖</option><option>已撤单</option></select><button onclick="filterOrders()">筛选</button><button class="danger" onclick="clearScopedOrders()">清除所选盘口本期订单</button><button class="danger" onclick="clearOrders(true)">清除所有订单</button><button onclick="undoClearOrders()">撤回上次清除</button></div><div id="orderClearNotice" class="muted"></div><div id="ordersTable">${orderTable(rows)}</div></section>`};

function orderTable(rows){return `<div class="scroll"><table><thead><tr><th>时间</th><th>盘口/期号</th><th>客户</th><th>玩法</th><th>内容</th><th>组数</th><th>下注</th><th>中奖组</th><th>赔付</th><th>状态</th><th>撤单</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.time)}</td><td>${o.market}/${esc(o.period)}</td><td>${esc(o.customer)}</td><td>${o.type}</td><td title="${esc(o.raw)}">${esc(o.raw).slice(0,35)}</td><td>${o.groups.length}</td><td>${money(o.stake)}</td><td>${o.won}</td><td>${money(o.payout)}</td><td>${o.status}</td><td><button class="compact ${o.status==='已撤单'?'':'danger'}" onclick="cancelOrder('${o.id}')">${o.status==='已撤单'?'恢复订单':'撤单'}</button></td></tr>`).join('')}</tbody></table></div>`};function filterOrders(){let c=$('orderCustomer').value,q=$('orderSearch').value.trim(),st=$('orderStatus').value;$('ordersTable').innerHTML=orderTable(S.orders.filter(o=>o.market===filterMarket&&o.period===(periodChoices(filterMarket).includes(viewPeriod)?viewPeriod:S.periods[filterMarket])&&(!c||o.customer===c)&&(!q||o.raw.includes(q)||o.type.includes(q))&&(!st||o.status===st)))}function cancelOrder(id){const o=S.orders.find(x=>String(x.id)===String(id));if(!o)return;if(transferOrderLocked(o)){alert('该订单已复制或上家已收，不能直接撤单，请先与上家核对');return} if(o.status==='已撤单'){const draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);if(draw){Object.assign(o,calculate(o,draw.numbers),{status:'已兑奖'});}else{Object.assign(o,{status:'待开奖',won:0,payout:0,unpriced:0});}}else{Object.assign(o,{status:'已撤单',won:0,payout:0,unpriced:0});}eatApplySavedRules(new Set([o.market+'|'+o.period]));save();render();const msg=document.getElementById('orderClearNotice');if(msg)msg.textContent=o.status==='已撤单'?'订单已撤单，可点击「恢复订单」重新启用':'订单已恢复，统计已更新';}let lastClearedOrders=null;function clearOrders(all){ledgerAutoSnapshot();const targetMarket=filterMarket;if(!all&&targetMarket!=='澳门'&&targetMarket!=='香港'){const notice=$('orderClearNotice');if(notice)notice.textContent='请先选择新澳门或香港盘口，再清除当期订单';return;}const targetPeriod=S.periods[targetMarket];const targets=S.orders.filter(o=>all||(o.market===targetMarket&&o.period===targetPeriod));if(targets.some(transferOrderPending)){$('orderClearNotice').textContent='有已复制待确认的转单，请先确认本批已收，或确认未发送后撤回本批';return}if(!targets.length){$('orderClearNotice').textContent='当前范围没有可清除的订单';return}lastClearedOrders=structuredClone(targets);const ids=new Set(targets.map(o=>o.id));S.orders=S.orders.filter(o=>!ids.has(o.id));eatApplySavedRules();save();render();const msg=$('orderClearNotice');if(msg)msg.textContent=`已清除${targets.length}笔${all?'全部':'当前'+(targetMarket==='澳门'?'新澳门':'香港')+'/'+targetPeriod}订单，可点击「撤回上次清除」恢复。`}
function undoClearOrders(){if(!lastClearedOrders?.length){$('orderClearNotice').textContent='没有可撤回的清除记录（刷新页面后无法撤回）';return}const ids=new Set(S.orders.map(o=>o.id));const restore=lastClearedOrders.filter(o=>!ids.has(o.id));S.orders.push(...restore);lastClearedOrders=null;eatApplySavedRules();save();render();$('orderClearNotice').textContent=`已恢复${restore.length}笔订单`}

function drawPage(){return `<div class="grid">${['澳门','香港'].map(m=>`<section class="panel"><h2>${m==='澳门'?'新澳门':'香港'}</h2><div class="row"><label>期号 <input id="p_${m}" value="${esc(S.periods[m])}"></label></div><input class="w100" id="d_${m}"><div class="row"><button class="primary" onclick="settle('${m}')">开奖兑奖并保存</button></div><div id="dmsg_${m}" class="muted"></div></section>`).join('')}</div><section class="panel"><details class="draw-history-fold"><summary>开奖记录</summary><div class="draw-history-list">${drawHistoryCards()}</div></details></section><section class="panel"><h2>客户兑奖详情</h2>${scopePicker('report',reportMarket,reportPeriod)}${settlementOverview()}${settlementTable()}</section>`}
function getOdds(o,g){let t=o.type;if(t==='特')return S.odds.特;if(t==='特碰')return S.odds.特碰;if(t==='平尾')return S.odds[+g[0]===0?'平尾0':'平尾其他'];if(t==='一肖中')return S.odds[g.includes(S.yearZ)?'年肖':'一肖中'];if(/^[二三四五]肖中$/.test(t))return S.odds[t.replace('肖中','肖年') in S.odds&&g.includes(S.yearZ)?t.replace('肖中','肖年'):t];return S.odds[t]}
function checkWin(o,g,draw){let a=draw.slice(0,6),all=draw,sp=draw[6],t=o.type;let vals=g.map(x=>+x);if(t==='特')return vals.includes(sp);if(t==='特碰')return vals.includes(sp)&&vals.some(x=>x!==sp&&a.includes(x));if(t==='二中二'||t==='三中三')return vals.every(x=>a.includes(x));if(t==='平尾'||t.includes('连尾'))return g.every(x=>all.some(n=>n%10===+x));if(t.includes('肖中'))return g.every(x=>all.some(n=>zOf(n)===x));if(t.includes('不中'))return vals.every(x=>!all.includes(x));return false}
function calculate(o,draw){let won=0,payout=0,unpriced=0;o.groups.forEach((g,i)=>{if(checkWin(o,g,draw)){won++;let rate=getOdds(o,g);if(rate===null||rate===undefined||rate==='')unpriced++;else payout+=(+o.stakes[i]||0)*(+rate)}});return {won,payout:+payout.toFixed(2),unpriced}}
function settle(m){let period=$('p_'+m).value.trim(),ns=nums($('d_'+m).value);if(!period)return alert('请输入期号');if(ns.length!==7||new Set(ns).size!==7)return alert('请输入7个不重复的01-49号码');if(S.draws.some(d=>d.market===m&&d.period===period))return alert('本期已保存，请先撤回旧开奖记录');let d={id:uid(),market:m,period,numbers:ns,time:new Date().toLocaleString('zh-CN')};S.draws.push(d);S.orders.filter(o=>o.market===m&&o.period===period&&o.status!=='已撤单').forEach(o=>{Object.assign(o,calculate(o,ns),{status:'已兑奖'})});let match=period.match(/^(.*?)(\d+)$/);if(match)S.periods[m]=match[1]+String(+match[2]+1).padStart(match[2].length,'0');reportMarket=m;reportPeriod=period;save();render();alert('开奖记录保存成功，相关订单已兑奖')}
function undoDraw(id){let d=S.draws.find(x=>x.id===id);if(!d||!confirm('撤回本期开奖？对应订单恢复待开奖。'))return;S.draws=S.draws.filter(x=>x.id!==id);S.orders.filter(o=>o.market===d.market&&o.period===d.period&&o.status==='已兑奖').forEach(o=>Object.assign(o,{status:'待开奖',won:0,payout:0,unpriced:0}));S.periods[d.market]=d.period;save();render()}
// 每个页面独立选择盘口/期号；默认只看当前期，历史数据不修改。
const periodChoices=m=>[...new Set([S.periods[m],...S.orders.filter(o=>o.market===m).map(o=>o.period),...S.draws.filter(d=>d.market===m).map(d=>d.period),...S.ledger.filter(r=>r.market===m).map(r=>r.period),...Object.values(S.ledgerTrash||{}).filter(r=>r.market===m).map(r=>r.period)])].filter(Boolean).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
function scopePicker(prefix,m,p){let periods=periodChoices(m),period=periods.includes(p)?p:S.periods[m];return `<div class="row"><label>盘口 <select onchange="setScope('${prefix}',this.value,null)">${['澳门','香港'].map(x=>`<option value="${x}" ${m===x?'selected':''}>${x==='澳门'?'新澳门':'香港'}</option>`).join('')}</select></label><label>期号 <select onchange="setScope('${prefix}',null,this.value)">${periods.map(x=>`<option ${x===period?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div>`}
function setScope(prefix,m,p){if(prefix==='order'){filterMarket=m||filterMarket;viewPeriod=p||S.periods[filterMarket]}else{reportMarket=m||reportMarket;reportPeriod=p||S.periods[reportMarket]}save();render()}

function allocationParts(o){if(Array.isArray(o.groupSelf)&&o.groupSelf.length===o.groups.length)return o.groupSelf;return o.groups.map((g,i)=>o.self===null?null:+((+o.stakes[i]||0)*o.self/(o.stake||1)).toFixed(2))}
function allocationSelf(o){return sum(allocationParts(o),x=>x||0)}
function groupSelfValue(o,i){let a=allocationParts(o);return a[i]===null?0:(+a[i]||0)}
function selfProfit(o){if(o.self===null)return 0;let pay=0,draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);if(draw){o.groups.forEach((g,i)=>{if(checkWin(o,g,draw.numbers)){let rate=getOdds(o,g);if(rate!==null&&rate!==undefined&&rate!=='')pay+=groupSelfValue(o,i)*(+rate)}})}else if(!Array.isArray(o.groupSelf)){pay=o.payout*o.self/(o.stake||1)}return o.self-pay}
function eatCategory(o){return o.type==='特'?'特码':(/肖中|连肖|平肖|一肖/.test(o.type)?'平肖／连肖':(/平尾|连尾|特尾/.test(o.type)?'尾数／连尾':'其他玩法'))}
function updateAllocation(o,values){if(transferOrderLocked(o)){if(JSON.stringify(values)!==JSON.stringify(allocationParts(o))){eatFeedback('该订单已复制或上家已收，分配已锁定');return false}return true}if(!Array.isArray(values)||values.length!==o.groups.length)return false;let cents=values.map(v=>v===null?null:Math.round(Number(v)*100));if(cents.some((v,i)=>v!==null&&(!Number.isFinite(v)||v<0||v>Math.round((+o.stakes[i]||0)*100))))return false;o.groupSelf=cents.map(v=>v===null?null:v/100);if(cents.every(v=>v===null)){o.self=null;o.transferred=0}else{o.self=+(cents.reduce((a,v)=>a+(v||0),0)/100).toFixed(2);o.transferred=+(cents.reduce((a,v,i)=>a+(v===null?0:Math.round((+o.stakes[i]||0)*100)-v),0)/100).toFixed(2)}o.received=false;return true}

 const totals=Object.create(null);

  (o.groups||[]).forEach((g,i)=>{
   if(!Array.isArray(g)||g.length!==1)return;

   const key=fmt(n),amount=Number((o.stakes||[])[i]);
   if(Number.isFinite(amount)&&amount>0)totals[key]=(totals[key]||0)+amount;
  });
 });

function eatAutoSelect(){
 const cap=eatCap(),orders=active().filter(o=>o.type==='特'),state=eatUsed();
 if(!eatSelected.size){eatFeedback('请先选择生肖或号码');return}
 if(cap.perNumber===null||cap.period===null){eatFeedback('请先填写并保存每号上限和本期上限');return}
 let left=Math.max(0,Math.round((cap.period-state.total)*100)),changed=0;
 for(const o of orders){let parts=allocationParts(o).slice(),dirty=false;
  o.groups.forEach((g,i)=>{if(g.length!==1)return;let n=fmt(g[0]);if(!eatSelected.has(n)||left<=0)return;
   let stake=Math.round((+o.stakes[i]||0)*100),current=Math.round((parts[i]||0)*100),room=Math.max(0,Math.round((cap.perNumber-(state.used[n]||0))*100));
   let add=Math.max(0,Math.min(stake-current,room,left));if(add>0){parts[i]=(current+add)/100;state.used[n]=(state.used[n]||0)+add/100;left-=add;dirty=true}
  });
  if(dirty){updateAllocation(o,parts);changed++}
 }
 save();eatNotice='已按限额分配 '+changed+' 笔特码订单；未选号码保持原分配';render()
}

.map(([customer,orders])=>`<details class="eat-customer" data-eat-key="customer:${cat}:${esc(customer)}"><summary>${esc(customer)} · ${orders.length}单 · ¥${money(sum(orders,o=>o.stake))}</summary>${orders.map(o=>{let parts=allocationParts(o),locked=transferOrderLocked(o);return `<details class="eat-order" data-eat-key="order:${o.id}"><summary>${esc(o.market)}/${esc(o.period)} · ${esc(o.type)} · ${esc(o.raw).slice(0,55)} · 下注¥${money(o.stake)} · 自留¥${money(o.self)} ${eatPending(o)?'（部分待分配）':''}</summary><div class="row"><button class="compact" ${locked?'disabled':''} onclick="setOrderAllocation('${o.id}','self')">本单全自留</button><button class="compact" ${locked?'disabled':''} onclick="setOrderAllocation('${o.id}','transfer')">本单全转出</button><button class="compact" ${locked?'disabled':''} onclick="setAllocation('${o.id}')">保存分配</button><button class="compact" ${locked?'disabled':''} onclick="resetAllocation('${o.id}')">撤回调整</button><span class="muted">上家：${o.received?'已收（已锁定）':transferOrderLocked(o)?'本批待确认（已锁定）':'未确认'}</span></div><div class="scroll"><table><thead><tr><th>组号</th><th>号码／组合</th><th>下注</th><th>自留（可填）</th><th>转出（自动）</th></tr></thead><tbody>${o.groups.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.join(' · '))}</td><td>¥${money(o.stakes[i])}</td><td><input class="num" type="number" min="0" max="${o.stakes[i]}" step="0.01" ${locked?'disabled':''} id="gs_${o.id}_${i}" value="${parts[i]===null?'':parts[i]}" placeholder="待分配" oninput="previewGroupTransfer('${o.id}',${i})"></td><td><input class="num" type="number" min="0" max="${o.stakes[i]}" step="0.01" ${locked?'disabled':''} id="tx_${o.id}_${i}" value="${parts[i]===null?'':money((+o.stakes[i]||0)-parts[i])}" placeholder="待分配" oninput="previewGroupSelf('${o.id}',${i})"></td></tr>`).join('')}</tbody></table></div></details>`}).join('')}</details>`).join(''):'<p class="muted">暂无该类订单</p>'}</details>`}).join('')}</section>`}

 if(!orders.length){alert('当前盘口和期号没有待分配订单');return}

function eatFeedback(message){eatNotice=message;const el=$('eatNotice');if(el)el.textContent=message}
function transferPendingCategory(cat){
 const orders=active().filter(o=>eatCategory(o)===cat && !transferOrderLocked(o) && eatPending(o));
 if(!orders.length){eatFeedback('【'+cat+'】暂无待分配订单');return}
 const snapshot=orders.map(eatAllocationSnapshot);
 const first=orders[0];
 S.eatUndoHistory.push({id:uid(),cat,market:first.market,period:first.period,items:snapshot,time:new Date().toISOString()});
 orders.forEach(o=>{transferUnallocated(o);o.eatManual=true});snapshot.forEach(x=>{x.afterSignature=transferOrderSignature(orders.find(o=>o.id===x.id))});
 save();eatNotice='【'+cat+'】已转出'+orders.length+'单，¥'+money(sum(orders,o=>o.stake))+'；可点击本分类一键回撤';render();
}
function eatAllocationSnapshot(o){return {id:o.id,groupSelf:Array.isArray(o.groupSelf)?[...o.groupSelf]:null,self:o.self,transferred:o.transferred||0,received:!!o.received,hasEatManual:Object.prototype.hasOwnProperty.call(o,'eatManual'),eatManual:!!o.eatManual}}
function allocateCategory(cat,mode){
 if(!['特码','平肖／连肖','尾数／连尾','其他玩法'].includes(cat)||!['self','transfer'].includes(mode))return;
 const all=active().filter(o=>eatCategory(o)===cat),orders=all.filter(o=>!transferOrderLocked(o)),skipped=all.length-orders.length;
 if(!orders.length){eatFeedback('【'+cat+'】'+(all.length?'订单均已锁定，未修改':'暂无订单'));return}
 const items=orders.map(eatAllocationSnapshot),first=orders[0];
 for(const o of orders){updateAllocation(o,o.stakes.map(n=>mode==='self'?n:0));o.eatManual=true}
 items.forEach(x=>{x.afterSignature=transferOrderSignature(orders.find(o=>o.id===x.id))});
 S.eatUndoHistory.push({id:uid(),cat,market:first.market,period:first.period,items,time:new Date().toISOString(),mode});
 save();eatNotice='【'+cat+'】'+orders.length+'单已全部'+(mode==='self'?'自留':'转出')+(skipped?'；跳过'+skipped+'笔已锁定订单':'')+'，可一键回撤';render();
}
function undoCategoryTransfer(cat){
 const scope=eatScopeKey(),index=S.eatUndoHistory.findLastIndex(h=>h.cat===cat&&h.market+'|'+h.period===scope);
 if(index<0){eatFeedback('【'+cat+'】没有可回撤的批量分配记录');return}
 const h=S.eatUndoHistory[index],items=h.items.map(x=>({snapshot:x,order:S.orders.find(o=>o.id===x.id)}));
 if(items.some(x=>!x.order||transferOrderLocked(x.order))){eatFeedback('回撤未执行：部分订单已复制、上家已收或已不存在');return}
 if(items.some(({snapshot:x,order:o})=>x.afterSignature?transferOrderSignature(o)!==x.afterSignature:allocationParts(o).some((v,i)=>v!==(x.groupSelf&&x.groupSelf[i]!==null?x.groupSelf[i]:0)))){
  eatFeedback('回撤未执行：这批订单已有后续分配修改，请先核对，避免覆盖新调整');return
 }
 for(const {snapshot:x,order:o} of items){o.groupSelf=x.groupSelf===null?null:[...x.groupSelf];o.self=x.self;o.transferred=x.transferred;o.received=x.received;if('hasEatManual' in x){if(x.hasEatManual)o.eatManual=x.eatManual;else delete o.eatManual}}
 S.eatUndoHistory.splice(index,1);save();eatNotice='【'+cat+'】已回撤'+items.length+'单，恢复批量操作前的分配';render();
}

function transferLine(o){
 let parts=allocationParts(o),rows=[];
 o.groups.forEach((g,i)=>{let amount=parts[i]===null?0:Math.round(((+o.stakes[i]||0)-parts[i])*100)/100;if(amount>0)rows.push({g,amount})});
 if(!rows.length)return [];
 // 同额的号码保持原单的“特：号码各金额”格式；不同金额拆行，不合并不同客户。

function checkWin(o,g,draw){const regular=draw.slice(0,6),special=draw[6],t=o.type,vals=g.map(Number);if(t==='特')return vals.includes(special);if(t==='特碰')return vals.includes(special)&&vals.some(n=>n!==special&&regular.includes(n));if(t==='二中二'||t==='三中三')return vals.every(n=>regular.includes(n));if(t==='平尾'||t.includes('连尾'))return g.every(x=>draw.some(n=>n%10===+x));if(t.includes('肖中')){const rec=S.draws.find(d=>d.market===o.market&&d.period===o.period&&d.numbers.join(',')===draw.join(',')),mapping=rec?.zSnapshot||S.z;return g.every(x=>draw.some(n=>nums(mapping[x]||'').includes(n)))}if(t.includes('不中'))return vals.every(n=>!draw.includes(n));return false}

function ownershipData(m,p,customer=''){
 const orders=scopedActive(m,p).filter(o=>!customer||o.customer===customer),draw=S.draws.find(d=>d.market===m&&d.period===p),rows={self:[],transfer:[]};let pendingC=0;
 const totals={self:{stakeC:0,payC:0,won:0,unpriced:0},transfer:{stakeC:0,payC:0,won:0,unpriced:0}};
 for(const o of orders){let cumulative=0,paid=0;const fullMap=o.groups.map((g,i)=>{const rate=getOdds(o,g);if(!draw||!checkWin(o,g,draw.numbers)||rate===null||rate===undefined||rate===''||!Number.isFinite(+rate)||+rate<0)return 0;cumulative+=(+o.stakes[i]||0)*(+rate);const next=Math.round(cumulative*100),part=next-paid;paid=next;return part});o.groups.forEach((g,i)=>{
  const parts=ownershipParts(o,i);pendingC+=parts.pending;const win=!!draw&&checkWin(o,g,draw.numbers),rate=getOdds(o,g),priced=rate!==null&&rate!==undefined&&rate!==''&&Number.isFinite(+rate)&&+rate>=0;
  const fullPay=fullMap[i],selfPay=!win||!priced||!parts.self?0:parts.self===parts.stake?fullPay:Math.min(fullPay,Math.round(parts.self*(+rate)));
  for(const side of ['self','transfer']){const stakeC=parts[side];if(!stakeC)continue;const missing=win&&!priced,payC=side==='self'?selfPay:(parts.pending?0:fullPay-selfPay),t=totals[side];t.stakeC+=stakeC;t.payC+=payC;if(win)t.won++;if(missing)t.unpriced++;

 });}

 for(const side of ['self','transfer']){const t=totals[side];t.stake=t.stakeC/100;t.payout=!draw||t.unpriced?null:t.payC/100;t.profit=!draw||t.unpriced?null:(t.stakeC-t.payC)/100}

let ledgerAutoBusy=false;
function ledgerReceiptDate(draw){const d=draw?.createdAt?new Date(draw.createdAt):new Date();return Number.isNaN(d.getTime())?new Date().toLocaleDateString('en-CA'):d.toLocaleDateString('en-CA')}
function ledgerMakeItem(o){const lines=o.groups.map((g,i)=>{const p=ownershipParts(o,i);return [g.slice(),p.stake,p.pending?null:p.self,getOdds(o,g)??null]});return {id:String(o.id),void:o.status==='已撤单',stake:+o.stake||0,rebateRaw:ownershipOrderRebate(o),basis:ownershipBasis(),lines,play:o.type,market:o.market,period:o.period,rate:o.type==='特'?(S.odds.特??null):0}}
function ledgerItemProfit(item,draw){if(!draw)return null;const lines=item.lines||[];if(lines.some(l=>l[2]===null))return null;let fullRunning=0,fullPaid=0,selfStake=0,selfPaid=0;for(const line of lines){const [n,stake,self]=line,rate=item.play?line[3]:item.rate;selfStake+=self;const win=item.play?checkWin({type:item.play,market:item.market,period:item.period},n,draw.numbers):+n===draw.numbers[6];if(!win)continue;if(rate===null||rate===undefined||!Number.isFinite(+rate)){if(self>0)return null;continue}fullRunning+=stake*(+rate);const next=Math.round(fullRunning),fullPay=next-fullPaid;fullPaid=next;selfPaid+=!self?0:self===stake?fullPay:Math.min(fullPay,Math.round(self*(+rate)))}return (selfStake-selfPaid)/100}
function ledgerRebuildReceipt(rec){if(!rec.items)return;const draw=S.draws.find(d=>d.market===rec.market&&d.period===rec.period),items=Object.values(rec.items).filter(x=>!x.void),profits=items.map(x=>ledgerItemProfit(x,draw));rec.stake=+sum(items,x=>x.stake).toFixed(2);rec.rebate=+sum(items,x=>x.rebateRaw).toFixed(2);rec.pending=+sum(items,x=>sum((x.lines||[]).filter(l=>l[2]===null),l=>l[1])/100).toFixed(2);rec.self=!draw||profits.some(p=>p===null)?null:+sum(profits,x=>x).toFixed(2);rec.status=!draw?'待开奖':rec.pending?'待分配':rec.self===null?'赔率待设置':'已结算';rec.orderCount=items.length;const bases=[...new Set(items.map(x=>x.basis||'all'))];rec.rebateBasis=bases.length===1?bases[0]:bases.length?'mixed':ownershipBasis();rec.autoSaved=true}
function ledgerAutoSnapshot(){if(ledgerAutoBusy)return false;ledgerAutoBusy=true;try{
 S.ledger=Array.isArray(S.ledger)?S.ledger:[];S.ledgerTrash=S.ledgerTrash&&typeof S.ledgerTrash==='object'&&!Array.isArray(S.ledgerTrash)?S.ledgerTrash:{};
 const before=JSON.stringify(S.ledger),scopes=groupBySafe(S.orders,o=>ledgerKey(o.market,o.period));
 for(const [key,orders] of Object.entries(scopes)){
  if(S.ledgerTrash[key])continue;let rec=S.ledger.find(r=>ledgerKey(r.market,r.period)===key);const m=orders[0].market,p=orders[0].period,draw=S.draws.find(d=>d.market===m&&d.period===p);
  if(!rec){rec={market:m,period:p,date:ledgerReceiptDate(draw),items:Object.create(null)};S.ledger.push(rec)}
  const incoming=Object.fromEntries(orders.map(o=>[String(o.id),ledgerMakeItem(o)]));
  if(!rec.items){
   // Attach legacy saved totals only when the complete live period still matches.
   const candidate={market:m,period:p,items:incoming};ledgerRebuildReceipt(candidate);
   const same=Math.abs((+rec.stake||0)-candidate.stake)<0.005&&Math.abs((+rec.rebate||0)-candidate.rebate)<0.005&&rec.self!==null&&candidate.self!==null&&Math.abs((+rec.self||0)-candidate.self)<0.005;
   if(!same)continue;rec.items=Object.create(null);
  }
  Object.assign(rec.items,incoming);
 }
 for(const rec of S.ledger)ledgerRebuildReceipt(rec);
 return before!==JSON.stringify(S.ledger);
 }finally{ledgerAutoBusy=false}}
function saveLedgerPeriod(){ledgerAutoSnapshot();save();render()}
function deleteLedgerPeriod(){ledgerAutoSnapshot();const p=reportPeriod||S.periods[reportMarket],key=ledgerKey(reportMarket,p),rec=S.ledger.find(r=>ledgerKey(r.market,r.period)===key);if(!rec)return;S.ledgerTrash[key]=structuredClone(rec);S.ledger=S.ledger.filter(r=>ledgerKey(r.market,r.period)!==key);save();render()}
function ledgerRestorePeriod(){const p=reportPeriod||S.periods[reportMarket],key=ledgerKey(reportMarket,p),rec=S.ledgerTrash?.[key];if(!rec)return;if(!S.ledger.some(r=>ledgerKey(r.market,r.period)===key))S.ledger.push(rec);delete S.ledgerTrash[key];save();render()}

ledgerSection=function(){

 const completed=monthly.filter(x=>x.self!==null&&Number.isFinite(+x.self)),pending=monthly.length-completed.length,monthlyRebate=sum(monthly,x=>x.rebate),monthlySelf=sum(completed,x=>x.self),monthlyTotal=sum(completed,ledgerReceiptTotal),total=ledgerReceiptTotal(rec),arg=v=>encodeURIComponent(v).replace(/'/g,'%27');
 return `<section class="panel ledger-panel"><details class="ledger-fold"><summary><span>记账本</span><span class="ledger-summary-total"><small>本期合计</small><b class="${total===null?'muted':total>0?'red':total<0?'green':'muted'}">${!rec?'—':total===null?'待结算':'¥'+money(total)}</b></span></summary><div class="row">${metric('本期返点',rec?.rebate||0)}${ledgerStoredMetric('本期自留正负',rec?rec.self:null)}${ledgerStoredMetric('本期合计',total)}</div><div class="row"><span>${esc(m==='澳门'?'新澳门':m)} / ${esc(p)}</span><span class="pill">${removed?'记录已删除':rec?(rec.status||'已结算')+' · 已自动保存':'暂无记录'}</span>${rec?'<button class="danger compact" onclick="deleteLedgerPeriod()">删除本期记录</button>':''}${removed?'<button onclick="ledgerRestorePeriod()">撤回删除</button>':''}</div><div class="row"><label>统计月份 <input type="month" value="${esc(month)}" onchange="window.ledgerMonth=this.value;render()"></label>${pending?`<span class="pill">待结算 ${pending}期</span>`:''}</div><div class="row">${metric('当月累计返点',monthlyRebate)}${ledgerStoredMetric('当月自留正负'+(pending?'（已结算）':''),monthlySelf)}${ledgerStoredMetric('当月合计'+(pending?'（已结算）':''),monthlyTotal)}</div><div class="scroll"><table><thead><tr><th>日期</th><th>盘口 / 期号</th><th>下注</th><th>返点</th><th>自留正负</th><th>合计</th><th>状态</th><th></th></tr></thead><tbody>${monthly.map(x=>{const t=ledgerReceiptTotal(x),cl=v=>v>0?'red':v<0?'green':'muted';return `<tr><td>${esc(x.date)}</td><td>${esc(x.market==='澳门'?'新澳门':x.market)} / ${esc(x.period)}</td><td>¥${money(x.stake)}</td><td>¥${money(x.rebate)}</td><td class="${cl(x.self)}">${x.self===null?'待结算':'¥'+money(x.self)}</td><td class="${cl(t)}">${t===null?'待结算':'¥'+money(t)}</td><td>${esc(x.status||'已结算')}</td><td><button class="compact" onclick="ledgerViewPeriod('${arg(x.market)}','${arg(x.period)}')">查看</button></td></tr>`}).join('')||'<tr><td colspan="8">本月暂无记录</td></tr>'}</tbody></table></div></details></section>`;

if(ledgerAutoSnapshot())save();


// Batches freeze the copied content; confirmation never consumes later orders.
let transferCopyBusy=false;
function transferBatchList(){return Array.isArray(S.transferBatches)?S.transferBatches:[]}
function transferPendingBatch(m=S.selectedMarket,p=S.periods[m],cat='特码'){return transferBatchList().find(b=>b.market===m&&b.period===p&&(b.category||'特码')===cat&&b.status==='pending')}
function transferCategoryBatch(cat='特码'){return transferPendingBatch(S.selectedMarket,S.periods[S.selectedMarket],cat)}
function transferOrderPending(o){return transferBatchList().some(b=>b.status==='pending'&&b.items.some(i=>i.id===String(o.id)))}
function transferOrderLocked(o){return !!o.received||transferOrderPending(o)}
function transferOrderSignature(o){return JSON.stringify([o.market,o.period,o.customer,o.type,o.raw,o.groups,o.stakes,allocationParts(o),o.status==='已撤单'])}
function transferCandidates(cat='特码'){return active().filter(o=>eatCategory(o)===cat).filter(o=>!o.received&&!transferOrderPending(o)&&!eatPending(o)&&transferLine(o).length)}
function transferUnknownLegacy(cat='特码'){return active().filter(o=>eatCategory(o)===cat).filter(o=>o.transferLegacy&&!o.received&&transferLine(o).length)}
function transferText(orders){const lines=[];for(const o of orders){const items=transferLine(o);if(items.length)lines.push('【'+o.customer+'】 '+o.market+'/'+o.period,...items)}return lines.join('\n')}
function transferBatchSnapshot(orders,cat='特码'){const m=S.selectedMarket,p=S.periods[m],seq=transferBatchList().filter(b=>b.market===m&&b.period===p&&(b.category||'特码')===cat).reduce((n,b)=>Math.max(n,+b.seq||0),0)+1;
 return {id:uid(),market:m,period:p,category:cat,seq,status:'pending',createdAt:new Date().toISOString(),text:transferText(orders),amount:+sum(orders,o=>o.transferred).toFixed(2),items:orders.map(o=>({id:String(o.id),signature:transferOrderSignature(o),parts:allocationParts(o).slice(),customer:o.customer,amount:+o.transferred||0}))};
}
function transferBatchValid(b){return b.items.length>0&&b.items.every(i=>{const o=S.orders.find(o=>String(o.id)===i.id);return o&&!o.received&&o.status!=='已撤单'&&transferOrderSignature(o)===i.signature})}
async function transferClipboard(text){try{await navigator.clipboard.writeText(text);return true}catch{const v=prompt('自动复制失败，请手动复制以下内容；复制完成后点确定，未复制请取消',text);return v!==null}}
async function copyPendingTransfers(cat='特码'){
 if(!['特码','平肖／连肖','尾数／连尾','其他玩法'].includes(cat))return false;
 if(transferCopyBusy)return false;
 const existing=transferCategoryBatch(cat);
 if(existing){eatFeedback('第'+existing.seq+'批已复制待确认；请先确认上家已收，尚未发送可撤回本批。新订单会留到下一批');return false}
 if(transferUnknownLegacy(cat).length){eatFeedback('请先在「旧版转单核对」中标记旧单是否已发送，避免重复');return false}
 const orders=transferCandidates(cat);if(!orders.length){eatFeedback('【'+cat+'】暂无待转订单；已收订单不会重复复制，部分待分配订单需先保存完整分配');return false}
 const b=transferBatchSnapshot(orders,cat);b.amount=+sum(b.items,i=>i.amount).toFixed(2);
 // Save a lock before awaiting the clipboard so new UI actions cannot mutate this batch.
 S.transferBatches=[...transferBatchList(),b];transferCopyBusy=true;if(!save()){S.transferBatches=S.transferBatches.filter(x=>x.id!==b.id);transferCopyBusy=false;eatFeedback('本批保存失败，未复制，请先导出备份并检查浏览器存储');return false}render();
 let ok=false;try{ok=await transferClipboard(b.text)}finally{transferCopyBusy=false;if(!ok){b.status='cancelled';b.cancelledAt=new Date().toISOString()}save();eatNotice=ok?'【'+cat+'】第'+b.seq+'批已复制：'+b.items.length+'单，¥'+money(b.amount)+'。发给上家后点击「确认本批已收」':'本批未复制，订单仍可重新复制';render()}
 return ok;
}
function confirmTransferBatch(cat='特码'){const b=transferCategoryBatch(cat);if(!b){eatFeedback('没有已复制待确认的批次，请先复制待转单');return false}
 if(transferCopyBusy){eatFeedback('正在复制，请稍后确认');return false}
 if(!transferBatchValid(b)){eatFeedback('本批订单与复制时不一致，未确认任何订单，请核对本批记录');return false}
 const before=b.items.map(i=>{const o=S.orders.find(o=>String(o.id)===i.id);return {o,received:o.received,receivedBatchId:o.receivedBatchId,transferLegacy:o.transferLegacy}});
 for(const i of b.items){const o=S.orders.find(o=>String(o.id)===i.id);o.received=true;o.receivedBatchId=b.id;delete o.transferLegacy}
 b.status='confirmed';b.confirmedAt=new Date().toISOString();if(!save()){for(const x of before){x.o.received=x.received;x.o.receivedBatchId=x.receivedBatchId;x.o.transferLegacy=x.transferLegacy}b.status='pending';delete b.confirmedAt;eatNotice='确认未保存，请检查存储后重新确认本批，勿重复发送';render();return false}eatNotice='【'+cat+'】第'+b.seq+'批已确认上家收到：'+b.items.length+'单，¥'+money(b.amount)+'；后续新订单仍待转出';render();return true;
}
function withdrawTransferBatch(cat='特码'){const b=transferCategoryBatch(cat);if(!b||transferCopyBusy)return;
 if(!confirm('仅限尚未发给上家的批次。若已经发送，请取消并确认本批已收，避免重复转单。确定本批尚未发送？'))return;
 b.status='cancelled';b.cancelledAt=new Date().toISOString();save();eatNotice='本批已撤回，原订单可重新分配及复制';render();
}
function resolveLegacyTransfer(id,sent){const o=active().find(o=>String(o.id)===id);if(!o||!o.transferLegacy||transferOrderLocked(o))return;
 if(sent&&eatPending(o)){eatFeedback('旧单仍有待分配金额，请先核对完整分配');return}
 delete o.transferLegacy;if(sent){o.received=true;o.receivedBatchId='legacy'}save();eatNotice=sent?'旧单已标记上家收到，不会再次复制':'旧单已标记尚未发送，会进入待转单';render();
}
async function recopyPendingBatch(cat='特码'){const b=transferCategoryBatch(cat);if(!b||transferCopyBusy)return;transferCopyBusy=true;try{if(await transferClipboard(b.text))eatFeedback('已重复制第'+b.seq+'批原文，不是新增订单；已发送请勿重复发送')}finally{transferCopyBusy=false}}
async function copyAllTransfers(){const orders=active().filter(o=>!eatPending(o)&&transferLine(o).length);if(!orders.length){eatFeedback('暂无完整分配的转单');return}await transferClipboard('【全部转单核对，非新增转单，请勿重复下注】\n'+transferText(orders));eatFeedback('已复制全部核对明细；发送新增订单请使用「复制待转单」')}
function transferBatchPanel(cat='特码'){const b=transferCategoryBatch(cat),unknown=transferUnknownLegacy(cat),history=transferBatchList().filter(b=>b.market===S.selectedMarket&&b.period===S.periods[S.selectedMarket]&&(b.category||'特码')===cat),arg=id=>encodeURIComponent(String(id)).replace(/'/g,'%27');
 return `${unknown.length?`<details class="transfer-legacy"><summary>旧版转单核对 · ${unknown.length}单</summary><p class="muted">旧版无法判断这些订单是否已发给上家，请核对后标记。</p>${unknown.map(o=>`<div class="row"><span>${esc(o.customer)} · ${esc(o.raw)} · 转出¥${money(o.transferred)}</span><button onclick="resolveLegacyTransfer(decodeURIComponent('${arg(o.id)}'),true)">已发上家</button><button onclick="resolveLegacyTransfer(decodeURIComponent('${arg(o.id)}'),false)">尚未发送</button></div>`).join('')}</details>`:''}${b?`<section class="panel transfer-batch"><b>第${b.seq}批 · 已复制待确认</b><p>${b.items.length}单 · ¥${money(b.amount)} · 本批只包含复制时的订单</p><div class="row"><button onclick="recopyPendingBatch('${cat}')">重复制本批</button><button onclick="withdrawTransferBatch('${cat}')">撤回本批（未发送）</button></div></section>`:''}${history.length?`<details class="transfer-history"><summary>转单批次记录 · ${history.length}批</summary>${history.slice().reverse().map(x=>`<details><summary>第${x.seq}批 · ${x.items.length}单 · ¥${money(x.amount)} · ${x.status==='confirmed'?'上家已收':x.status==='cancelled'?'已撤回':'待确认'}</summary><small>${esc(x.createdAt)}</small><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.text)}</pre></details>`).join('')}</details>`:''}`;
}


let lastWordDeletion=null;
function replacementLibrary(){return `<details id="wordLibrary"><summary id="wordLibraryTitle">公共词库</summary><div id="wordLibraryBody">${replacementLibraryContent()}</div></details>`}
function replacementLibraryContent(message=''){
 const show=v=>esc(v).replace(/ /g,'␠').replace(/\t/g,'⇥').replace(/\n/g,'↵');
 return `<div class="row"><input type="hidden" id="wordIndex" value="-1"><label>查找内容 <input id="wordFrom" placeholder="要替换或删除的文字、符号"></label><label>替换为 <input id="wordTo" placeholder="留空表示删除匹配内容"></label><button class="primary" onclick="saveLibraryWord()">保存词条</button><button onclick="resetLibraryWord()">取消编辑</button></div><p id="wordLibraryMessage" role="status" class="muted">${esc(message)}</p><div class="scroll"><table><thead><tr><th>序号</th><th>已保存的查找内容</th><th>替换为</th><th>操作</th></tr></thead><tbody>${S.replacements.map(([from,to],i)=>`<tr><td>${i+1}</td><td><code style="white-space:pre-wrap">${from?show(from):'（空内容，不生效）'}</code></td><td>${to?`<code style="white-space:pre-wrap">${show(to)}</code>`:'<span class="muted">删除匹配内容</span>'}</td><td><button class="compact" onclick="editLibraryWord(${i})">编辑</button> <button class="compact danger" onclick="deleteLibraryWord(${i})">删除词条</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">暂无已保存词条</td></tr>'}</tbody></table></div>${lastWordDeletion?'<div class="row"><button onclick="undoDeleteLibraryWord()">撤回删除词条</button></div>':''}<p class="muted">保存后识别时自动使用；上表按应用顺序排列。替换内容留空是删字，“删除词条”是取消这条规则。</p>`;
}
function wordLibraryMessage(message){const el=$('wordLibraryMessage');if(el)el.textContent=message}
function refreshWordLibrary(message){const body=$('wordLibraryBody'),title=$('wordLibraryTitle');if(body)body.innerHTML=replacementLibraryContent(message);if(title)title.textContent='公共词库'}
function persistLibraryWords(next,message){const before=S.replacements;S.replacements=next;if(!save()){S.replacements=before;wordLibraryMessage('保存失败，原词库已保留，请重试');return false}confirmed=[];auditConfirmedSignature='';refreshWordLibrary(message);return true}
function resetLibraryWord(){if($('wordIndex'))$('wordIndex').value='-1';if($('wordFrom'))$('wordFrom').value='';if($('wordTo'))$('wordTo').value='';wordLibraryMessage('')}
function editLibraryWord(index){const r=S.replacements[index];if(!r)return;$('wordIndex').value=String(index);$('wordFrom').value=r[0];$('wordTo').value=r[1];wordLibraryMessage('正在编辑第'+(index+1)+'条，修改后点击保存词条');$('wordFrom').focus?.()}
function saveLibraryWord(){const from=$('wordFrom').value,to=$('wordTo').value,index=Number($('wordIndex').value);if(!from){wordLibraryMessage('请填写要查找的内容');return false}if(!Number.isInteger(index)||index< -1||index>=S.replacements.length&&index!==-1){wordLibraryMessage('词条已变化，请重新选择编辑');return false}if(S.replacements.some((r,i)=>i!==index&&r[0]===from)){wordLibraryMessage('已有相同查找内容，请编辑原词条');return false}const next=S.replacements.map(r=>[...r]);if(index===-1)next.push([from,to]);else next[index]=[from,to];return persistLibraryWords(next,index===-1?'词条已保存，已加入下方列表':'词条已更新')}
function deleteLibraryWord(index){const r=S.replacements[index];if(!r)return false;const previousDelete=lastWordDeletion;lastWordDeletion={index,entry:[...r]};if(!persistLibraryWords(S.replacements.filter((_,i)=>i!==index),'词条已删除，不再自动替换；可撤回本次删除')){lastWordDeletion=previousDelete;return false}return true}
function undoDeleteLibraryWord(){const deleted=lastWordDeletion;if(!deleted)return false;if(S.replacements.some(r=>r[0]===deleted.entry[0])){wordLibraryMessage('已有相同查找内容，请先核对，未覆盖现有词条');return false}const next=S.replacements.map(r=>[...r]);next.splice(Math.min(deleted.index,next.length),0,[...deleted.entry]);lastWordDeletion=null;if(!persistLibraryWords(next,'已恢复删除的词条')){lastWordDeletion=deleted;return false}return true}


function drawHistoryDate(d){const m=String(d.time||'').match(/(\d{4})[年/.-](\d{1,2})[月/.-](\d{1,2})/);if(m)return `${m[1]}年${+m[2]}月${+m[3]}日`;const date=d.createdAt?new Date(d.createdAt):null;return date&&!Number.isNaN(date.getTime())?`${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`:'日期未记录'}
function drawHistoryNumber(n,d){const z=d.zSnapshot||S.z,w=d.wSnapshot||S.w,c=d.cSnapshot||S.c,zodiac=Object.keys(z).find(k=>nums(z[k]).includes(+n))||'—',element=Object.keys(w).find(k=>nums(w[k]).includes(+n))||'—',wave=Object.keys(c).find(k=>nums(c[k]).includes(+n))||colorOf(n),waveClass={红:'red',蓝:'blue',绿:'green'}[wave]||'blue',elementClass={火:'fire',水:'water',金:'metal',木:'wood',土:'earth'}[element]||'';
 return `<div class="draw-history-number"><span class="draw-lotto-ball wave-${waveClass}"><span class="draw-lotto-core">${fmt(n)}</span></span><div class="draw-number-meta">${esc(zodiac)}/<span class="draw-element-${elementClass}">${esc(element)}</span></div></div>`;
}
function drawHistoryCards(){const draws=S.draws.filter(d=>d.market===reportMarket).slice().reverse(),arg=v=>encodeURIComponent(String(v)).replace(/'/g,'%27');return draws.map(d=>`<article class="draw-history-card"><div class="draw-history-head"><div class="draw-history-period"><span class="draw-history-market">${d.market==='澳门'?'新澳门':'香港'}</span>第 <strong>${esc(String(d.period).replace(/-/g,''))}</strong> 期</div><time class="draw-history-date">${esc(drawHistoryDate(d))}</time></div><div class="draw-history-grid">${d.numbers.map((n,i)=>(i===6?'<div class="draw-history-plus" aria-label="加特码">＋</div>':'')+drawHistoryNumber(n,d)).join('')}</div><div class="draw-history-footer"><button class="compact danger" onclick="undoDraw(decodeURIComponent('${arg(d.id)}'))">撤回本期开奖</button></div></article>`).join('')||'<p class="muted">暂无开奖记录</p>'}


function lottoBall(n){const wave={红:'redball',蓝:'blueball',绿:'greenball'}[colorOf(n)]||'blueball';return `<span class="ball ${wave} lotto-number"><span class="lotto-number-core">${fmt(n)}</span></span>`}
