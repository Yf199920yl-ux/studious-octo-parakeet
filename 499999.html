function completeText(){
 let t=$('entryText').value;
 // 只补全玩法前缀，保留原有号码、生肖、金额和分组分隔符。

 t=t.replace(/(^|[\s\n，,。;；])([2345])肖(?!中|连肖)(?=[\s，,。:：、.\-/]|[鼠牛虎兔龙蛇马羊猴鸡狗猪])/g,(m,pre,n)=>pre+({'2':'二','3':'三','4':'四','5':'五'}[n])+'肖中');
 t=t.replace(/(^|[\s\n，,。;；])连尾[\s，,。:：、]*/g,(m,pre,offset,full)=>{
   const rest=full.slice(offset+m.length).split(/[\n;；]/)[0];
   const groups=rest.match(/[0-9](?:[\s，,。、.\-/]+[0-9])+/g)||[];
   const first=groups[0];if(!first)return m;
   const count=(first.match(/[0-9]/g)||[]).length;
   return pre+({2:'两',3:'三',4:'四',5:'五'}[count]||'')+'连尾 ';
 });
 showEditPreview('complete','补全玩法前缀 · 修改预览',t)
}

function orderTable(rows){return `<div class="scroll"><table><thead><tr><th>时间</th><th>盘口/期号</th><th>客户</th><th>玩法</th><th>内容</th><th>组数</th><th>下注</th><th>中奖组</th><th>赔付</th><th>状态</th><th>撤单</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.time)}</td><td>${o.market}/${esc(o.period)}</td><td>${esc(o.customer)}</td><td>${o.type}</td><td title="${esc(o.raw)}">${esc(o.raw).slice(0,35)}</td><td>${o.groups.length}</td><td>${money(o.stake)}</td><td>${o.won}</td><td>${money(o.payout)}</td><td>${o.status}</td><td><button class="compact ${o.status==='已撤单'?'':'danger'}" onclick="cancelOrder('${o.id}')">${o.status==='已撤单'?'恢复订单':'撤单'}</button></td></tr>`).join('')}</tbody></table></div>`};function filterOrders(){let c=$('orderCustomer').value,q=$('orderSearch').value.trim(),st=$('orderStatus').value;$('ordersTable').innerHTML=orderTable(S.orders.filter(o=>o.market===filterMarket&&o.period===(periodChoices(filterMarket).includes(viewPeriod)?viewPeriod:S.periods[filterMarket])&&(!c||o.customer===c)&&(!q||o.raw.includes(q)||o.type.includes(q))&&(!st||o.status===st)))}function cancelOrder(id){const o=S.orders.find(x=>String(x.id)===String(id));if(!o)return; if(o.status==='已撤单'){const draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);if(draw){Object.assign(o,calculate(o,draw.numbers),{status:'已兑奖'});}else{Object.assign(o,{status:'待开奖',won:0,payout:0,unpriced:0});}}else{Object.assign(o,{status:'已撤单',won:0,payout:0,unpriced:0});}eatApplySavedRules(new Set([o.market+'|'+o.period]));save();render();const msg=document.getElementById('orderClearNotice');if(msg)msg.textContent=o.status==='已撤单'?'订单已撤单，可点击「恢复订单」重新启用':'订单已恢复，统计已更新';}let lastClearedOrders=null;function clearOrders(all){ledgerAutoSnapshot();const targetMarket=filterMarket;if(!all&&targetMarket!=='澳门'&&targetMarket!=='香港'){const notice=$('orderClearNotice');if(notice)notice.textContent='请先选择新澳门或香港盘口，再清除当期订单';return;}const targetPeriod=S.periods[targetMarket];const targets=S.orders.filter(o=>all||(o.market===targetMarket&&o.period===targetPeriod));if(!targets.length){$('orderClearNotice').textContent='当前范围没有可清除的订单';return}lastClearedOrders=structuredClone(targets);const ids=new Set(targets.map(o=>o.id));S.orders=S.orders.filter(o=>!ids.has(o.id));eatApplySavedRules();save();render();const msg=$('orderClearNotice');if(msg)msg.textContent=`已清除${targets.length}笔${all?'全部':'当前'+(targetMarket==='澳门'?'新澳门':'香港')+'/'+targetPeriod}订单，可点击「撤回上次清除」恢复。`}

function getOdds(o,g){let t=o.type;if(t==='特')return S.odds.特;if(t==='特碰')return S.odds.特碰;if(t==='平尾')return S.odds[+g[0]===0?'平尾0':'平尾其他'];if(t==='一肖中')return S.odds[g.includes(S.yearZ)?'年肖':'一肖中'];if(/^[二三四五]肖中$/.test(t))return S.odds[t.replace('肖中','肖年') in S.odds&&g.includes(S.yearZ)?t.replace('肖中','肖年'):t];return S.odds[t]}
function checkWin(o,g,draw){let a=draw.slice(0,6),all=draw,sp=draw[6],t=o.type;let vals=g.map(x=>+x);if(t==='特')return vals.includes(sp);if(t==='特碰')return vals.includes(sp)&&vals.some(x=>x!==sp&&a.includes(x));if(t==='二中二'||t==='三中三')return vals.every(x=>a.includes(x));if(t==='平尾'||t.includes('连尾'))return g.every(x=>all.some(n=>n%10===+x));if(t.includes('肖中'))return g.every(x=>all.some(n=>zOf(n)===x));if(t.includes('不中'))return vals.every(x=>!all.includes(x));return false}
function calculate(o,draw){let won=0,payout=0,unpriced=0;o.groups.forEach((g,i)=>{if(checkWin(o,g,draw)){won++;let rate=getOdds(o,g);if(rate===null||rate===undefined||rate==='')unpriced++;else payout+=(+o.stakes[i]||0)*(+rate)}});return {won,payout:+payout.toFixed(2),unpriced}}
function settle(m){let period=$('p_'+m).value.trim(),ns=nums($('d_'+m).value);if(!period)return alert('请输入期号');if(ns.length!==7||new Set(ns).size!==7)return alert('请输入7个不重复的01-49号码');if(S.draws.some(d=>d.market===m&&d.period===period))return alert('本期已保存，请先撤回旧开奖记录');let d={id:uid(),market:m,period,numbers:ns,time:new Date().toLocaleString('zh-CN')};S.draws.push(d);S.orders.filter(o=>o.market===m&&o.period===period&&o.status!=='已撤单').forEach(o=>{Object.assign(o,calculate(o,ns),{status:'已兑奖'})});let match=period.match(/^(.*?)(\d+)$/);if(match)S.periods[m]=match[1]+String(+match[2]+1).padStart(match[2].length,'0');reportMarket=m;reportPeriod=period;save();render();alert('开奖记录保存成功，相关订单已兑奖')}

function selfProfit(o){if(o.self===null)return 0;let pay=0,draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);if(draw){o.groups.forEach((g,i)=>{if(checkWin(o,g,draw.numbers)){let rate=getOdds(o,g);if(rate!==null&&rate!==undefined&&rate!=='')pay+=groupSelfValue(o,i)*(+rate)}})}else if(!Array.isArray(o.groupSelf)){pay=o.payout*o.self/(o.stake||1)}return o.self-pay}
function eatCategory(o){return o.type==='特'?'特码':(/肖中|连肖|平肖|一肖/.test(o.type)?'平肖／连肖':(/平尾|连尾|特尾/.test(o.type)?'尾数／连尾':'其他玩法'))}
function updateAllocation(o,values){if(!Array.isArray(values)||values.length!==o.groups.length)return false;let cents=values.map(v=>v===null?null:Math.round(Number(v)*100));if(cents.some((v,i)=>v!==null&&(!Number.isFinite(v)||v<0||v>Math.round((+o.stakes[i]||0)*100))))return false;o.groupSelf=cents.map(v=>v===null?null:v/100);if(cents.every(v=>v===null)){o.self=null;o.transferred=0}else{o.self=+(cents.reduce((a,v)=>a+(v||0),0)/100).toFixed(2);o.transferred=+(cents.reduce((a,v,i)=>a+(v===null?0:Math.round((+o.stakes[i]||0)*100)-v),0)/100).toFixed(2)}o.received=false;return true}

function eatSaveCaps(){let perRaw=$('eatPerNumber').value.trim(),periodRaw=$('eatPeriodCap').value.trim();let per=perRaw===''?null:Number(perRaw),period=periodRaw===''?null:Number(periodRaw);if((per!==null&&!Number.isFinite(per))||(period!==null&&!Number.isFinite(period))||(per!==null&&per<0)||(period!==null&&period<0)){eatFeedback('限额不能为负数');return}S.eatCaps[eatScopeKey()]={perNumber:per,period};save();eatFeedback('本期限额已保存')}
function eatUsed(){let used={},total=0;active().filter(o=>o.type==='特').forEach(o=>{let parts=allocationParts(o);o.groups.forEach((g,i)=>{let v=parts[i]||0;if(v>0&&g.length===1){let n=fmt(g[0]);used[n]=(used[n]||0)+v;total+=v}})});return {used,total}}
// 实时特码收注：只统计当前盘口、当前期的有效订单，独立于自留分配。
function eatNumberStakes(){
 const totals=Object.create(null);
 scopedActive(S.selectedMarket,S.periods[S.selectedMarket]).filter(o=>o.type==='特').forEach(o=>{
  (o.groups||[]).forEach((g,i)=>{
   if(!Array.isArray(g)||g.length!==1)return;
   const n=Number(g[0]);if(!Number.isInteger(n)||n<1||n>49)return;
   const key=fmt(n),amount=Number((o.stakes||[])[i]);
   if(Number.isFinite(amount)&&amount>0)totals[key]=(totals[key]||0)+amount;
  });
 });
 return totals;
}
function eatAutoSelect(){
 const cap=eatCap(),orders=active().filter(o=>o.type==='特'),state=eatUsed();
 if(!eatSelected.size){eatFeedback('请先选择生肖或号码');return}
 if(cap.perNumber===null||cap.period===null){eatFeedback('请先填写并保存每号上限和本期上限');return}
 let left=Math.max(0,Math.round((cap.period-state.total)*100)),changed=0;
 for(const o of orders){let parts=allocationParts(o).slice(),dirty=false;
  o.groups.forEach((g,i)=>{if(g.length!==1)return;let n=fmt(g[0]);if(!eatSelected.has(n)||left<=0)return;
   let stake=Math.round((+o.stakes[i]||0)*100),current=Math.round((parts[i]||0)*100),room=Math.max(0,Math.round((cap.perNumber-(state.used[n]||0))*100));
   let add=Math.max(0,Math.min(stake-current,room,left));if(add>0){parts[i]=(current+add)/100;state.used[n]=(state.used[n]||0)+add/100;left-=add;dirty=true}
  });
  if(dirty){updateAllocation(o,parts);changed++}
 }
 save();eatNotice='已按限额分配 '+changed+' 笔特码订单；未选号码保持原分配';render()
}

 <label>每号上限 <input id="eatPerNumber" class="num" type="number" min="0" step=".01" value="${cap.perNumber??''}" placeholder="未设置"></label>
 <label>本期上限 <input id="eatPeriodCap" class="num" type="number" min="0" step=".01" value="${cap.period??''}" placeholder="未设置"></label>

 <div class="row">${Z.map(z=>`<button class="compact ${zNums(z).length&&zNums(z).every(n=>eatSelected.has(fmt(n)))?'eat-z-picked':''}" onclick="eatSelectZ('${z}')">${z}</button>`).join('')}</div>
 <div class="eat-number-grid">${Array.from({length:49},(_,i)=>{let n=fmt(i+1);return `<button class="compact ${eatSelected.has(n)?'eat-picked':''}" onclick="eatSelectedToggle('${n}')">${n}<small>¥${money(numberStakes[n]||0)}</small></button>`}).join('')}</div>

function eatPage(){let a=active(),selfTotal=sum(eatSpecialOrders(),allocationSelf),trans=sum(eatSpecialOrders(),o=>sum(allocationParts(o).map((x,i)=>x===null?0:Math.max(0,(+o.stakes[i]||0)-x)),x=>x));const cats=['特码','平肖／连肖','尾数／连尾','其他玩法'];return `<section class="panel eat-clean-panel"><h2>吃码管理</h2>${currentScopePicker()}<div class="row"><label>特码自留比例 <input id="eatRatio" type="number" min="0" max="100" value="0" class="num"> %</label><button onclick="allocateRatio()">按比例分配</button></div>${eatPicker()}<div class="row">${metric('总收注',sum(a,o=>o.stake))}${metric('特码自留',selfTotal)}${metric('特码转出',trans)}</div><div class="row eat-main-actions"><button class="primary" onclick="copyTransfers()">复制转单</button><button onclick="transferPendingAll()">待分配转出</button><details class="eat-more"><summary>更多操作</summary><div class="row"><button onclick="allocateAll('self')">全部自留</button><button onclick="allocateAll('transfer')">全部转出</button><button onclick="confirmReceived()">确认上家已收</button></div></details></div><p id="eatNotice" class="muted" role="status">${esc(eatNotice)}</p>${cats.map(cat=>{let os=a.filter(o=>eatCategory(o)===cat),pending=os.filter(o=>eatPending(o)).length;if(cat!=='特码')return `<details class="eat-category" data-eat-key="cat:${cat}"><summary>${cat} · ${os.length}单 · ¥${money(sum(os,o=>o.stake))}</summary>${Object.entries(groupBySafe(os,o=>o.type)).map(([type,rows])=>`<div class="row"><span>${esc(type)}</span><b>¥${money(sum(rows,o=>o.stake))}</b></div>`).join('')}</details>`;return `<details class="eat-category" data-eat-key="cat:${cat}"><summary>${cat} · ${os.length}单 · ¥${money(sum(os,o=>o.stake))}${pending?' · 待分配'+pending+'单':''}</summary><div class="row" style="padding:10px 12px;gap:8px"><button class="compact" onclick="transferPendingCategory('${cat}')" ${pending?'':'disabled'}>转出待分配</button><button class="compact" onclick="undoCategoryTransfer('${cat}')">一键回撤</button></div>${os.length?Object.entries(groupBySafe([...os].sort((x,y)=>(x.self!==null)-(y.self!==null)),o=>o.customer)).map(([customer,orders])=>`<details class="eat-customer" data-eat-key="customer:${cat}:${esc(customer)}"><summary>${esc(customer)} · ${orders.length}单 · ¥${money(sum(orders,o=>o.stake))}</summary>${orders.map(o=>{let parts=allocationParts(o);return `<details class="eat-order" data-eat-key="order:${o.id}"><summary>${esc(o.market)}/${esc(o.period)} · ${esc(o.type)} · ${esc(o.raw).slice(0,55)} · 下注¥${money(o.stake)} · 自留¥${money(o.self)} ${eatPending(o)?'（部分待分配）':''}</summary><div class="row"><button class="compact" onclick="setOrderAllocation('${o.id}','self')">本单全自留</button><button class="compact" onclick="setOrderAllocation('${o.id}','transfer')">本单全转出</button><button class="compact" onclick="setAllocation('${o.id}')">保存分配</button><button class="compact" onclick="resetAllocation('${o.id}')">撤回调整</button><span class="muted">上家：${o.received?'已收':'未确认'}</span></div><div class="scroll"><table><thead><tr><th>组号</th><th>号码／组合</th><th>下注</th><th>自留（可填）</th><th>转出（自动）</th></tr></thead><tbody>${o.groups.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.join(' · '))}</td><td>¥${money(o.stakes[i])}</td><td><input class="num" type="number" min="0" max="${o.stakes[i]}" step="0.01" id="gs_${o.id}_${i}" value="${parts[i]===null?'':parts[i]}" placeholder="待分配" oninput="previewGroupTransfer('${o.id}',${i})"></td><td><input class="num" type="number" min="0" max="${o.stakes[i]}" step="0.01" id="tx_${o.id}_${i}" value="${parts[i]===null?'':money((+o.stakes[i]||0)-parts[i])}" placeholder="待分配" oninput="previewGroupSelf('${o.id}',${i})"></td></tr>`).join('')}</tbody></table></div></details>`}).join('')}</details>`).join(''):'<p class="muted">暂无该类订单</p>'}</details>`}).join('')}</section>`}
function previewGroupTransfer(id,i){let o=S.orders.find(x=>x.id===id),v=$('gs_'+id+'_'+i).value;$('gt_'+id+'_'+i).textContent=v===''?'待分配':'¥'+money((+o.stakes[i]||0)-(+v||0))}
function setAllocation(id){let o=S.orders.find(x=>x.id===id);if(!o)return;let values=o.groups.map((g,i)=>{let v=$('gs_'+id+'_'+i).value.trim();return v===''?null:+v});if(!updateAllocation(o,values))return alert('自留金额必须介于0和该组下注金额之间');save();render()}
function setOrderAllocation(id,mode){let o=S.orders.find(x=>x.id===id);if(!o)return;updateAllocation(o,o.groups.map((g,i)=>mode==='self'?+o.stakes[i]:0));save();render()}
function resetAllocation(id){let o=S.orders.find(x=>x.id===id);if(!o)return;updateAllocation(o,o.groups.map(()=>null));save();render()}

function transferPendingAll(){
 const orders=eatSpecialOrders().filter(eatPending);
 if(!orders.length){alert('当前盘口和期号没有待分配订单');return}
 const total=sum(orders,o=>o.stake);
 
 orders.forEach(transferUnallocated);

}
function eatFeedback(message){eatNotice=message;const el=$('eatNotice');if(el)el.textContent=message}
function transferPendingCategory(cat){
 const orders=eatSpecialOrders().filter(o=>eatCategory(o)===cat && eatPending(o));
 if(!orders.length){eatFeedback('【'+cat+'】暂无待分配订单');return}
 const snapshot=orders.map(o=>({id:o.id,groupSelf:Array.isArray(o.groupSelf)?[...o.groupSelf]:null,self:o.self,transferred:o.transferred||0,received:!!o.received}));
 const first=orders[0];
 S.eatUndoHistory.push({id:uid(),cat,market:first.market,period:first.period,items:snapshot,time:new Date().toISOString()});
 orders.forEach(transferUnallocated);
 save();eatNotice='【'+cat+'】已转出'+orders.length+'单，¥'+money(sum(orders,o=>o.stake))+'；可点击本分类一键回撤';render();
}
function undoCategoryTransfer(cat){
 const scope=eatScopeKey();
 const index=S.eatUndoHistory.findLastIndex(h=>h.cat===cat && h.market+'|'+h.period===scope);
 if(index<0){eatFeedback('【'+cat+'】没有可回撤的批量转出记录');return}
 const h=S.eatUndoHistory[index];
 const items=h.items.map(x=>({snapshot:x,order:S.orders.find(o=>o.id===x.id)}));
 if(items.some(x=>!x.order||x.order.received)){eatFeedback('回撤未执行：部分订单已确认上家收到或已不存在，请先核对');return}
 if(items.some(({snapshot:x,order:o})=>allocationParts(o).some((v,i)=>v!==(x.groupSelf&&x.groupSelf[i]!==null?x.groupSelf[i]:0)))){
  eatFeedback('回撤未执行：这批订单已有后续分配修改，请先核对，避免覆盖新调整');return
 }
 for(const {snapshot:x,order:o} of items){o.groupSelf=x.groupSelf===null?null:[...x.groupSelf];o.self=x.self;o.transferred=x.transferred;o.received=x.received}
 S.eatUndoHistory.splice(index,1);save();eatNotice='【'+cat+'】已回撤'+items.length+'单，恢复批量转出前的分配状态';render();
}

function transferLine(o){
 let parts=allocationParts(o),rows=[];
 o.groups.forEach((g,i)=>{let amount=parts[i]===null?0:Math.round(((+o.stakes[i]||0)-parts[i])*100)/100;if(amount>0)rows.push({g,amount})});
 if(!rows.length)return [];
 // 同额的号码保持原单的“特：号码各金额”格式；不同金额拆行，不合并不同客户。
 let buckets=new Map();
 rows.forEach(x=>{let key=x.amount.toFixed(2);if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(x.g)});
 return [...buckets].map(([amount,groups])=>{
  let body=groups.map(g=>g.join('-')).join(' ');
  let prefix=o.type==='特'?'特：':o.type+'：';
  return prefix+body+'各'+(+amount)+'元'
 });
}
function copyTransfers(){

 copyText(lines.join('\n')||'暂无特码转出订单')
}
const rebateGroups={"特码类":['特','特码','特碰','三中三','二中二','五不中','六不中','七不中','八不中','九不中','十不中'],"平肖类":['一肖中','二肖中','三肖中','四肖中','五肖中'],"平尾类":['平尾','二连尾','三连尾','四连尾','五连尾']};
function rebateBreakdown(a){const total=sum(a,rebate);let used=new Set(Object.values(rebateGroups).flat());let categories=Object.entries(rebateGroups).map(([name,types])=>[name,a.filter(o=>types.includes(o.type))]);let others=a.filter(o=>!used.has(o.type));if(others.length)categories.push(['其他玩法',others]);return `<div class="metric rebate-metric"><details><summary class="rebate-summary"><small>总返点</small><b>¥${money(total)}</b></summary><div class="rebate-details">${categories.map(([name,orders])=>`<details style="margin:6px 0;padding:8px;border:1px solid #d7e4f7;border-radius:8px"><summary>${name}　¥${money(sum(orders,rebate))}</summary>${[...new Set(orders.map(o=>o.type))].map(type=>`<div style="padding:5px 8px">${esc(type)}：下注 ¥${money(sum(orders.filter(o=>o.type===type),o=>o.stake))} · 返点 ¥${money(sum(orders.filter(o=>o.type===type),rebate))}</div>`).join('')||'<span class="muted">暂无下注</span>'}</details>`).join('')}</div></details></div>`}

function summaryPage(){let a=scopedActive(reportMarket,reportPeriod),groups=Object.entries(groupBySafe(a,o=>o.customer));return `<section class="panel"><h2>全盘汇总</h2>${pendingRates(a)}${scopePicker('report',reportMarket,reportPeriod)}<div class="row"><div class="metric"><small>总单数 / 客户数</small><b>${a.length} / ${new Set(a.map(o=>o.customer)).size}</b></div>${metric('总收注',sum(a,o=>o.stake))}${ownershipRebateMetric(a)}${metric('全盘中奖',sum(a,o=>o.payout))}${ownershipGlobalMetric(a)}</div></section>${ownershipPanel(reportMarket,reportPeriod)}<section class="panel"><h2>客户订单汇总明细</h2>${groups.map(([c,os])=>`<details><summary>${esc(c)} · ${os.length}单 · 下注¥${money(sum(os,o=>o.stake))} · 赔付¥${money(sum(os,o=>o.payout))}</summary><div class="row"><span>客户正负：<b class="${sum(os,o=>o.payout-o.stake)>0?'red':sum(os,o=>o.payout-o.stake)<0?'green':''}">${sum(os,o=>o.payout-o.stake)>0?'+':''}¥${money(sum(os,o=>o.payout-o.stake))}</b></span><button onclick="copyCustomer('${encodeURIComponent(c).replace(/'/g,'%27')}')">复制客户明细</button></div>${orderTable(os)}</details>`).join('')||'<p class="muted">暂无订单</p>'}</section>${ledgerSection(a)}${pendingRates(a)}`};function copyCustomer(c){
 let customer=decodeURIComponent(c),os=scopedActive(reportMarket,reportPeriod).filter(o=>o.customer===customer);
 let stake=sum(os,o=>o.stake),pay=sum(os,o=>o.payout),net=+(pay-stake).toFixed(2);
 let lines=[`客户：${customer}`,`总下注：¥${money(stake)}`];
 let winners=[];let winCount=0;
 for(const o of os){
   const draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);
   if(!draw)continue;
   for(let i=0;i<o.groups.length;i++){
     let g=o.groups[i];if(!checkWin(o,g,draw.numbers))continue;
     winCount++;
     let rate=getOdds(o,g),missing=rate===null||rate===undefined||rate==='';
     let paid=missing?'待设置赔率':`¥${money((+o.stakes[i]||0)*(+rate))}`;
     winners.push(`${o.market}/${o.period} ${o.type} ${g.join('·')}｜下注¥${money(o.stakes[i])} × ${missing?'赔率待设置':rate} = ${paid}`);
   }
 }
 lines.push(`中奖组数：${winCount}组`,'中奖玩法明细：',...(winners.length?winners:['无中奖组合']),`中奖赔付：¥${money(pay)}`);
 if(net>0)lines.push(`本期应付客户：¥${money(net)}`);
