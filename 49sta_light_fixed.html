function completeText(){
 let t=$('entryText').value;
 // 只补全玩法前缀，保留原有号码、生肖、金额和分组分隔符。
 t=t.replace(/(^|[\s\n，,。;；])([二三四五])肖(?!中|连肖)(?=[\s，,。:：、.\-/]|[鼠牛虎兔龙蛇马羊猴鸡狗猪])/g,(m,pre,n)=>pre+n+'肖中');
 t=t.replace(/(^|[\s\n，,。;；])([2345])肖(?!中|连肖)(?=[\s，,。:：、.\-/]|[鼠牛虎兔龙蛇马羊猴鸡狗猪])/g,(m,pre,n)=>pre+({'2':'二','3':'三','4':'四','5':'五'}[n])+'肖中');
 t=t.replace(/(^|[\s\n，,。;；])连尾[\s，,。:：、]*/g,(m,pre,offset,full)=>{
   const rest=full.slice(offset+m.length).split(/[\n;；]/)[0];
   const groups=rest.match(/[0-9](?:[\s，,。、.\-/]+[0-9])+/g)||[];
   const first=groups[0];if(!first)return m;
   const count=(first.match(/[0-9]/g)||[]).length;
   return pre+({2:'两',3:'三',4:'四',5:'五'}[count]||'')+'连尾 ';
 });
 showEditPreview('complete','补全玩法前缀 · 修改预览',t)
}

function ordersPage(){let market=filterMarket,period=periodChoices(market).includes(viewPeriod)?viewPeriod:S.periods[market],rows=scopedOrders(market,period);return `<section class="panel"><h2>订单管理</h2>${scopePicker('order',market,period)}<div class="row"><select id="orderCustomer"><option value="">全部客户</option>${S.customers.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="orderSearch" placeholder="投注内容/玩法"><select id="orderStatus"><option value="">全部状态</option><option>待开奖</option><option>已兑奖</option><option>已撤单</option></select><button onclick="filterOrders()">筛选</button><button class="danger" onclick="clearScopedOrders()">清除所选盘口本期订单</button><button class="danger" onclick="clearOrders(true)">清除所有订单</button><button onclick="undoClearOrders()">撤回上次清除</button></div><div id="orderClearNotice" class="muted"></div><div id="ordersTable">${orderTable(rows)}</div></section>`};

function orderTable(rows){return `<div class="scroll"><table><thead><tr><th>时间</th><th>盘口/期号</th><th>客户</th><th>玩法</th><th>内容</th><th>组数</th><th>下注</th><th>中奖组</th><th>赔付</th><th>状态</th><th>撤单</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.time)}</td><td>${o.market}/${esc(o.period)}</td><td>${esc(o.customer)}</td><td>${o.type}</td><td title="${esc(o.raw)}">${esc(o.raw).slice(0,35)}</td><td>${o.groups.length}</td><td>${money(o.stake)}</td><td>${o.won}</td><td>${money(o.payout)}</td><td>${o.status}</td><td><button class="compact ${o.status==='已撤单'?'':'danger'}" onclick="cancelOrder('${o.id}')">${o.status==='已撤单'?'恢复订单':'撤单'}</button></td></tr>`).join('')}</tbody></table></div>`};function filterOrders(){let c=$('orderCustomer').value,q=$('orderSearch').value.trim(),st=$('orderStatus').value;$('ordersTable').innerHTML=orderTable(S.orders.filter(o=>o.market===filterMarket&&o.period===(periodChoices(filterMarket).includes(viewPeriod)?viewPeriod:S.periods[filterMarket])&&(!c||o.customer===c)&&(!q||o.raw.includes(q)||o.type.includes(q))&&(!st||o.status===st)))}function cancelOrder(id){const o=S.orders.find(x=>String(x.id)===String(id));if(!o)return; if(o.status==='已撤单'){const draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);if(draw){Object.assign(o,calculate(o,draw.numbers),{status:'已兑奖'});}else{Object.assign(o,{status:'待开奖',won:0,payout:0,unpriced:0});}}else{Object.assign(o,{status:'已撤单',won:0,payout:0,unpriced:0});}save();render();const msg=document.getElementById('orderClearNotice');if(msg)msg.textContent=o.status==='已撤单'?'订单已撤单，可点击「恢复订单」重新启用':'订单已恢复，统计已更新';}let lastClearedOrders=null;function clearOrders(all){const targetMarket=filterMarket;if(!all&&targetMarket!=='澳门'&&targetMarket!=='香港'){const notice=$('orderClearNotice');if(notice)notice.textContent='请先选择新澳门或香港盘口，再清除当期订单';return;}const targetPeriod=S.periods[targetMarket];const targets=S.orders.filter(o=>all||(o.market===targetMarket&&o.period===targetPeriod));if(!targets.length){$('orderClearNotice').textContent='当前范围没有可清除的订单';return}lastClearedOrders=structuredClone(targets);const ids=new Set(targets.map(o=>o.id));S.orders=S.orders.filter(o=>!ids.has(o.id));save();render();const msg=$('orderClearNotice');if(msg)msg.textContent=`已清除${targets.length}笔${all?'全部':'当前'+(targetMarket==='澳门'?'新澳门':'香港')+'/'+targetPeriod}订单，可点击「撤回上次清除」恢复。`}
function undoClearOrders(){if(!lastClearedOrders?.length){$('orderClearNotice').textContent='没有可撤回的清除记录（刷新页面后无法撤回）';return}const ids=new Set(S.orders.map(o=>o.id));const restore=lastClearedOrders.filter(o=>!ids.has(o.id));S.orders.push(...restore);lastClearedOrders=null;save();render();$('orderClearNotice').textContent=`已恢复${restore.length}笔订单`}

function drawPage(){return `<div class="grid">${['澳门','香港'].map(m=>`<section class="panel"><h2>${m==='澳门'?'新澳门':'香港'}兑奖</h2><div class="row"><label>期号 <input id="p_${m}" value="${esc(S.periods[m])}"></label></div><p class="muted">前六个正码 + 第七个特码</p><input class="w100" id="d_${m}" placeholder="例：01 02 03 04 05 06 + 07"><div class="row"><button class="primary" onclick="settle('${m}')">开奖兑奖并保存</button></div><div id="dmsg_${m}" class="muted"></div></section>`).join('')}</div><section class="panel"><h2>开奖记录</h2>${S.draws.filter(d=>d.market===reportMarket&&d.period===(reportPeriod||S.periods[reportMarket])).slice().reverse().map(d=>`<details><summary>${d.market} / ${esc(d.period)}　${d.numbers.map(fmt).join(' · ')}　${esc(d.time)}</summary><div class="row">${d.numbers.map(ball).join('')}</div><button class="danger" onclick="undoDraw('${d.id}')">撤回本期开奖</button></details>`).join('')||'<p class="muted">暂无开奖记录</p>'}</section><section class="panel"><h2>客户兑奖详情</h2>${scopePicker('report',reportMarket,reportPeriod)}${settlementTable()}</section>`}
function getOdds(o,g){let t=o.type;if(t==='特')return S.odds.特;if(t==='特碰')return S.odds.特碰;if(t==='平尾')return S.odds[+g[0]===0?'平尾0':'平尾其他'];if(t==='一肖中')return S.odds[g.includes(S.yearZ)?'年肖':'一肖中'];if(/^[二三四五]肖中$/.test(t))return S.odds[t.replace('肖中','肖年') in S.odds&&g.includes(S.yearZ)?t.replace('肖中','肖年'):t];return S.odds[t]}
function checkWin(o,g,draw){let a=draw.slice(0,6),all=draw,sp=draw[6],t=o.type;let vals=g.map(x=>+x);if(t==='特')return vals.includes(sp);if(t==='特碰')return vals.includes(sp)&&vals.some(x=>x!==sp&&a.includes(x));if(t==='二中二'||t==='三中三')return vals.every(x=>a.includes(x));if(t==='平尾'||t.includes('连尾'))return g.every(x=>all.some(n=>n%10===+x));if(t.includes('肖中'))return g.every(x=>all.some(n=>zOf(n)===x));if(t.includes('不中'))return vals.every(x=>!all.includes(x));return false}
function calculate(o,draw){let won=0,payout=0,unpriced=0;o.groups.forEach((g,i)=>{if(checkWin(o,g,draw)){won++;let rate=getOdds(o,g);if(rate===null||rate===undefined||rate==='')unpriced++;else payout+=(+o.stakes[i]||0)*(+rate)}});return {won,payout:+payout.toFixed(2),unpriced}}
function settle(m){let period=$('p_'+m).value.trim(),ns=nums($('d_'+m).value);if(!period)return alert('请输入期号');if(ns.length!==7||new Set(ns).size!==7)return alert('请输入7个不重复的01-49号码');if(S.draws.some(d=>d.market===m&&d.period===period))return alert('本期已保存，请先撤回旧开奖记录');let d={id:uid(),market:m,period,numbers:ns,time:new Date().toLocaleString('zh-CN')};S.draws.push(d);S.orders.filter(o=>o.market===m&&o.period===period&&o.status!=='已撤单').forEach(o=>{Object.assign(o,calculate(o,ns),{status:'已兑奖'})});let match=period.match(/^(.*?)(\d+)$/);if(match)S.periods[m]=match[1]+String(+match[2]+1).padStart(match[2].length,'0');reportMarket=m;reportPeriod=period;save();render();alert('开奖记录保存成功，相关订单已兑奖')}
function undoDraw(id){let d=S.draws.find(x=>x.id===id);if(!d||!confirm('撤回本期开奖？对应订单恢复待开奖。'))return;S.draws=S.draws.filter(x=>x.id!==id);S.orders.filter(o=>o.market===d.market&&o.period===d.period&&o.status==='已兑奖').forEach(o=>Object.assign(o,{status:'待开奖',won:0,payout:0,unpriced:0}));S.periods[d.market]=d.period;save();render()}

function scopePicker(prefix,m,p){let periods=periodChoices(m),period=periods.includes(p)?p:S.periods[m];return `<div class="row"><label>盘口 <select onchange="setScope('${prefix}',this.value,null)">${['澳门','香港'].map(x=>`<option value="${x}" ${m===x?'selected':''}>${x==='澳门'?'新澳门':'香港'}</option>`).join('')}</select></label><label>期号 <select onchange="setScope('${prefix}',null,this.value)">${periods.map(x=>`<option ${x===period?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div>`}

const active=()=>S.orders.filter(o=>o.status!=='已撤单');
const scopedActive=(m,p)=>scopedOrders(m,p).filter(o=>o.status!=='已撤单');const rebate=o=>o.stake*(+S.rebates[o.type]||0)/100;const settlementTable=()=>{let rows=Object.entries(Object.groupBy(scopedActive(reportMarket,reportPeriod).filter(o=>o.status==='已兑奖'),o=>o.market+' / '+o.period+' / '+o.customer));return rows.length?`<div class="settlement-list">${rows.map(([k,a])=>{let stake=sum(a,x=>x.stake),pay=sum(a,x=>x.payout),balance=stake-pay;return `<details class="customer-settlement"><summary><span class="settlement-name">${esc(k)}</span><span>${a.length}笔订单</span><span>下注 ¥${money(stake)}</span><span>赔付 ¥${money(pay)}</span><strong class="${balance>=0?'green':'red'}">${balance>=0?'应收':'应付'} ¥${money(Math.abs(balance))}</strong></summary><div class="scroll"><table><thead><tr><th>时间</th><th>玩法</th><th>投注内容</th><th>组数</th><th>下注</th><th>中奖组</th><th>赔付</th><th>状态</th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.time||'—')}</td><td>${esc(o.type)}</td><td class="wrap-cell">${esc(o.raw)}</td><td>${o.groups.length}</td><td>¥${money(o.stake)}</td><td>${o.won||0}</td><td>¥${money(o.payout)}</td><td>${esc(o.status)}</td></tr><tr><td colspan="8"><details class="order-settlement"><summary>查看本笔 ${o.groups.length} 组投注与中奖情况</summary><div class="scroll"><table><thead><tr><th>组号</th><th>具体组合</th><th>每组下注</th><th>是否中奖</th><th>赔率</th><th>赔付</th></tr></thead><tbody>${o.groups.map((g,i)=>{let draw=S.draws.find(d=>d.market===o.market&&d.period===o.period),win=draw?checkWin(o,g,draw.numbers):false,rate=getOdds(o,g),unpriced=win&&(rate===null||rate===undefined||rate===''),paid=win&&!unpriced?(+o.stakes[i]||0)*(+rate):0;return `<tr><td>${i+1}</td><td>${esc(g.join(' · '))}</td><td>¥${money(o.stakes[i]||0)}</td><td class="${win?'green':''}">${win?'中奖':'未中'}</td><td>${rate===null||rate===undefined||rate===''?'待设置':esc(String(rate))}</td><td>${unpriced?'待计算':'¥'+money(paid)}</td></tr>`}).join('')}</tbody></table></div></details></td></tr>`).join('')}</tbody></table></div></details>`}).join('')}</div>`:'<p class="muted">暂无已兑奖客户订单</p>'}

function riskPage(){let orders=active().filter(o=>o.type==='特'),data=Array.from({length:49},(_,i)=>{let n=i+1,stake=0,loss=0,count=0;for(const o of orders){o.groups.forEach((g,j)=>{if(+g[0]===n){stake+=o.stakes[j];loss+=o.stakes[j]*(+S.odds.特||0);count++}})}return {n,stake,loss,count}}).sort((a,b)=>b.loss-a.loss);let top=data[0];return `<section class="panel"><h2>庄家功能</h2><div class="row">${metric('总收注',sum(active(),o=>o.stake))}${metric('总返点',sum(active(),rebate))}${metric('已中奖',sum(active(),o=>o.payout))}${metric('当前正负',sum(active(),o=>o.stake-o.payout))}</div></section><section class="panel"><h2>49号码风险提示（仅特码）</h2><div class="row"><div class="metric">最大赔付号 <b class="red">${top?fmt(top.n):'—'}</b></div><div class="metric">理论最大赔付 <b class="red">¥${money(top?.loss)}</b></div><div class="metric">危险号码 <b class="red">${data.filter(x=>x.loss>0).slice(0,5).map(x=>fmt(x.n)).join('、')||'—'}</b></div></div><div class="scroll"><table><tr><th>排名</th><th>号码/波色</th><th>生肖</th><th>下注金额</th><th>理论赔付</th><th>下注注数</th></tr>${data.map((x,i)=>`<tr><td>${i+1}</td><td>${ball(x.n)}</td><td>${zOf(x.n)}</td><td>${money(x.stake)}</td><td class="${i<5?'red':''}">${money(x.loss)}</td><td>${x.count}</td></tr>`).join('')}</table></div></section>`}
const metric=(label,n)=>`<div class="metric"><small>${label}</small><b>¥${money(n)}</b></div>`;
// 吃码：逐组金额为唯一分配来源，兼容旧版整单自留数据。
function allocationParts(o){if(Array.isArray(o.groupSelf)&&o.groupSelf.length===o.groups.length)return o.groupSelf;return o.groups.map((g,i)=>o.self===null?null:+((+o.stakes[i]||0)*o.self/(o.stake||1)).toFixed(2))}
function allocationSelf(o){return o.self===null?0:o.self}
function groupSelfValue(o,i){let a=allocationParts(o);return a[i]===null?0:(+a[i]||0)}
function selfProfit(o){if(o.self===null)return 0;let pay=0,draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);if(draw){o.groups.forEach((g,i)=>{if(checkWin(o,g,draw.numbers)){let rate=getOdds(o,g);if(rate!==null&&rate!==undefined&&rate!=='')pay+=groupSelfValue(o,i)*(+rate)}})}else if(!Array.isArray(o.groupSelf)){pay=o.payout*o.self/(o.stake||1)}return o.self-pay}
function eatCategory(o){return o.type==='特'?'特码':o.type.includes('肖中')?'平肖／连肖':o.type==='平尾'||o.type.includes('连尾')?'尾数／连尾':'其他玩法'}
function updateAllocation(o,values){let cents=values.map(v=>v===null?null:Math.round(Number(v)*100));if(cents.some((v,i)=>v!==null&&(!Number.isFinite(v)||v<0||v>Math.round((+o.stakes[i]||0)*100))))return false;o.groupSelf=cents.map(v=>v===null?null:v/100);if(cents.every(v=>v===null)){o.self=null;o.transferred=0}else{o.self=+(cents.reduce((a,v)=>a+(v||0),0)/100).toFixed(2);o.transferred=+(o.stake-o.self).toFixed(2)}o.received=false;return true}

function eatSaveCaps(){let per=Number($('eatPerNumber').value),period=Number($('eatPeriodCap').value);if(!Number.isFinite(per)||!Number.isFinite(period)||per<0||period<0){eatFeedback('限额不能为负数');return}S.eatCaps[eatScopeKey()]={perNumber:per,period};save();eatFeedback('本期限额已保存')}
function eatUsed(){let used={},total=0;active().filter(o=>o.type==='特').forEach(o=>{let parts=allocationParts(o);o.groups.forEach((g,i)=>{let v=parts[i]||0;if(v>0&&g.length===1){let n=fmt(g[0]);used[n]=(used[n]||0)+v;total+=v}})});return {used,total}}
function eatAutoSelect(){
 const cap=eatCap(),orders=active().filter(o=>o.type==='特'),state=eatUsed();
 if(!eatSelected.size){eatFeedback('请先选择生肖或号码');return}
 let left=Math.max(0,Math.round((cap.period-state.total)*100)),changed=0;
 for(const o of orders){let parts=allocationParts(o).slice(),dirty=false;
  o.groups.forEach((g,i)=>{if(g.length!==1)return;let n=fmt(g[0]);if(!eatSelected.has(n)||left<=0)return;
   let stake=Math.round((+o.stakes[i]||0)*100),current=Math.round((parts[i]||0)*100),room=Math.max(0,Math.round((cap.perNumber-(state.used[n]||0))*100));
   let add=Math.min(stake-current,room,left);if(add>0){parts[i]=(current+add)/100;state.used[n]=(state.used[n]||0)+add/100;left-=add;dirty=true}
  });
  if(dirty){updateAllocation(o,parts);changed++}
 }
 save();eatNotice='已按限额分配 '+changed+' 笔特码订单；未选号码保持原分配';render()
}

 <div class="row"><label>盘口 <select onchange="S.selectedMarket=this.value;save();eatSelected.clear();render()"><option value="澳门" ${S.selectedMarket==='澳门'?'selected':''}>新澳门</option><option value="香港" ${S.selectedMarket==='香港'?'selected':''}>香港</option></select></label><span>期号 ${esc(S.periods[S.selectedMarket])}</span>
 <label>每号上限 <input id="eatPerNumber" class="num" type="number" min="0" step=".01" value="${cap.perNumber}"></label>
 <label>本期上限 <input id="eatPeriodCap" class="num" type="number" min="0" step=".01" value="${cap.period}"></label>

 <div class="eat-number-grid">${Array.from({length:49},(_,i)=>{let n=fmt(i+1);return `<button class="compact ${eatSelected.has(n)?'eat-picked':''}" onclick="eatSelectedToggle('${n}')">${n}<small>¥${money(usage.used[n]||0)}</small></button>`}).join('')}</div>

function eatPage(){let a=active(),selfTotal=sum(a,allocationSelf),trans=sum(a,o=>o.transferred||0);const cats=['特码','平肖／连肖','尾数／连尾','其他玩法'];return `<section class="panel eat-clean-panel"><h2>吃码管理</h2>${eatPicker()}<div class="row">${metric('总收注',sum(a,o=>o.stake))}${metric('自留',selfTotal)}${metric('转出',trans)}</div><div class="row eat-main-actions"><button class="primary" onclick="copyTransfers()">复制转单</button><button onclick="transferPendingAll()">待分配转出</button><details class="eat-more"><summary>更多操作</summary><div class="row"><button onclick="allocateAll('self')">全部自留</button><button onclick="allocateAll('transfer')">全部转出</button><button onclick="confirmReceived()">确认上家已收</button></div></details></div><p id="eatNotice" class="muted" role="status">${esc(eatNotice)}</p>${cats.map(cat=>{let os=a.filter(o=>eatCategory(o)===cat),pending=os.filter(o=>o.self===null).length;return `<details class="eat-category"><summary>${cat} · ${os.length}单 · ¥${money(sum(os,o=>o.stake))}${pending?' · 待分配'+pending+'单':''}</summary><div class="row" style="padding:10px 12px;gap:8px"><button class="compact" onclick="transferPendingCategory('${cat}')" ${pending?'':'disabled'}>转出待分配</button><button class="compact" onclick="undoCategoryTransfer('${cat}')">一键回撤</button></div>${os.length?Object.entries(Object.groupBy([...os].sort((x,y)=>(x.self!==null)-(y.self!==null)),o=>o.customer)).map(([customer,orders])=>`<details class="eat-customer"><summary>${esc(customer)} · ${orders.length}单 · ¥${money(sum(orders,o=>o.stake))}</summary>${orders.map(o=>{let parts=allocationParts(o);return `<details class="eat-order"><summary>${esc(o.market)}/${esc(o.period)} · ${esc(o.type)} · ${esc(o.raw).slice(0,55)} · 下注¥${money(o.stake)} · 自留¥${money(o.self)} ${o.self===null?'（待分配）':''}</summary><div class="row"><button class="compact" onclick="setOrderAllocation('${o.id}','self')">本单全自留</button><button class="compact" onclick="setOrderAllocation('${o.id}','transfer')">本单全转出</button><button class="compact" onclick="setAllocation('${o.id}')">保存分配</button><button class="compact" onclick="resetAllocation('${o.id}')">撤回调整</button><span class="muted">上家：${o.received?'已收':'未确认'}</span></div><div class="scroll"><table><thead><tr><th>组号</th><th>号码／组合</th><th>下注</th><th>自留（可填）</th><th>转出（自动）</th></tr></thead><tbody>${o.groups.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.join(' · '))}</td><td>¥${money(o.stakes[i])}</td><td><input class="num" type="number" min="0" max="${o.stakes[i]}" step="0.01" id="gs_${o.id}_${i}" value="${parts[i]===null?'':parts[i]}" placeholder="待分配" oninput="previewGroupTransfer('${o.id}',${i})"></td><td id="gt_${o.id}_${i}">${parts[i]===null?'待分配':'¥'+money((+o.stakes[i]||0)-parts[i])}</td></tr>`).join('')}</tbody></table></div></details>`}).join('')}</details>`).join(''):'<p class="muted">暂无该类订单</p>'}</details>`}).join('')}</section>`}
function previewGroupTransfer(id,i){let o=S.orders.find(x=>x.id===id),v=$('gs_'+id+'_'+i).value;$('gt_'+id+'_'+i).textContent=v===''?'待分配':'¥'+money((+o.stakes[i]||0)-(+v||0))}
function setAllocation(id){let o=S.orders.find(x=>x.id===id);if(!o)return;let values=o.groups.map((g,i)=>{let v=$('gs_'+id+'_'+i).value.trim();return v===''?null:+v});if(!updateAllocation(o,values))return alert('自留金额必须介于0和该组下注金额之间');save();render()}
function setOrderAllocation(id,mode){let o=S.orders.find(x=>x.id===id);if(!o)return;updateAllocation(o,o.groups.map((g,i)=>mode==='self'?+o.stakes[i]:0));save();render()}
function resetAllocation(id){let o=S.orders.find(x=>x.id===id);if(!o)return;updateAllocation(o,o.groups.map(()=>null));save();render()}
function allocateAll(mode){if(!confirm('确认批量分配全部有效订单？'))return;active().forEach(o=>updateAllocation(o,o.groups.map((g,i)=>mode==='self'?+o.stakes[i]:0)));save();render()}
function transferPendingAll(){
 const orders=active().filter(o=>o.self===null);
 if(!orders.length){alert('当前盘口和期号没有待分配订单');return}
 const total=sum(orders,o=>o.stake);
 
 orders.forEach(o=>updateAllocation(o,o.groups.map(()=>0)));
 save();render();
}
function eatFeedback(message){eatNotice=message;const el=$('eatNotice');if(el)el.textContent=message}
function transferPendingCategory(cat){
 const orders=active().filter(o=>eatCategory(o)===cat && o.self===null);
 if(!orders.length){eatFeedback('【'+cat+'】暂无待分配订单');return}
 const snapshot=orders.map(o=>({id:o.id,groupSelf:Array.isArray(o.groupSelf)?[...o.groupSelf]:null,self:o.self,transferred:o.transferred||0,received:!!o.received}));
 const first=orders[0];
 S.eatUndoHistory.push({id:uid(),cat,market:first.market,period:first.period,items:snapshot,time:new Date().toISOString()});
 orders.forEach(o=>updateAllocation(o,o.groups.map(()=>0)));
 save();eatNotice='【'+cat+'】已转出'+orders.length+'单，¥'+money(sum(orders,o=>o.stake))+'；可点击本分类一键回撤';render();
}
function undoCategoryTransfer(cat){
 const a=active();const scopes=new Set(a.filter(o=>eatCategory(o)===cat).map(o=>o.market+'|'+o.period));
 const index=S.eatUndoHistory.findLastIndex(h=>h.cat===cat && scopes.has(h.market+'|'+h.period));
 if(index<0){eatFeedback('【'+cat+'】没有可回撤的批量转出记录');return}
 const h=S.eatUndoHistory[index];
 const items=h.items.map(x=>({snapshot:x,order:S.orders.find(o=>o.id===x.id)}));
 if(items.some(x=>!x.order||x.order.received)){eatFeedback('回撤未执行：部分订单已确认上家收到或已不存在，请先核对');return}
 if(items.some(({order})=>order.self!==0||Math.abs((order.transferred||0)-order.stake)>0.011)){
  eatFeedback('回撤未执行：这批订单已有后续分配修改，请先核对，避免覆盖新调整');return
 }
 for(const {snapshot:x,order:o} of items){o.groupSelf=x.groupSelf===null?null:[...x.groupSelf];o.self=x.self;o.transferred=x.transferred;o.received=x.received}
 S.eatUndoHistory.splice(index,1);save();eatNotice='【'+cat+'】已回撤'+items.length+'单，恢复批量转出前的分配状态';render();
}
function confirmReceived(){active().filter(o=>o.transferred>0).forEach(o=>o.received=true);save();render()}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('已复制')}catch{prompt('长按复制以下内容',t)}}

function transferLine(o){
 let parts=allocationParts(o),rows=[];
 o.groups.forEach((g,i)=>{let amount=Math.round(((+o.stakes[i]||0)-(parts[i]||0))*100)/100;if(amount>0)rows.push({g,amount})});
 if(!rows.length)return [];
 // 同额的号码保持原单的“特：号码各金额”格式；不同金额拆行，不合并不同客户。
 let buckets=new Map();
 rows.forEach(x=>{let key=x.amount.toFixed(2);if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(x.g)});
 return [...buckets].map(([amount,groups])=>{
  let body=groups.map(g=>g.join('-')).join(' ');
  let prefix=o.type==='特'?'特：':o.type+'：';
  return prefix+body+'各'+(+amount)+'元'
 });
}
function copyTransfers(){
 let lines=[];active().forEach(o=>{if(o.self===null)return;let items=transferLine(o);if(items.length){lines.push('【'+o.customer+'】 '+o.market+'/'+o.period);lines.push(...items)}});
 copyText(lines.join('\n')||'暂无转出订单')
}
const rebateGroups={"特码类":['特','特码','特碰','三中三','二中二','五不中','六不中','七不中','八不中','九不中','十不中'],"平肖类":['一肖中','二肖中','三肖中','四肖中','五肖中'],"平尾类":['平尾','二连尾','三连尾','四连尾','五连尾']};
function rebateBreakdown(a){const total=sum(a,rebate);let used=new Set(Object.values(rebateGroups).flat());let categories=Object.entries(rebateGroups).map(([name,types])=>[name,a.filter(o=>types.includes(o.type))]);let others=a.filter(o=>!used.has(o.type));if(others.length)categories.push(['其他玩法',others]);return `<div class="metric rebate-metric"><details><summary class="rebate-summary"><small>总返点</small><b>¥${money(total)}</b></summary><div class="rebate-details">${categories.map(([name,orders])=>`<details style="margin:6px 0;padding:8px;border:1px solid #d7e4f7;border-radius:8px"><summary>${name}　¥${money(sum(orders,rebate))}</summary>${[...new Set(orders.map(o=>o.type))].map(type=>`<div style="padding:5px 8px">${esc(type)}：下注 ¥${money(sum(orders.filter(o=>o.type===type),o=>o.stake))} · 返点 ¥${money(sum(orders.filter(o=>o.type===type),rebate))}</div>`).join('')||'<span class="muted">暂无下注</span>'}</details>`).join('')}</div></details></div>`}
function ledgerKey(m,p){return m+'|'+p}
function ledgerRecord(a){return {market:reportMarket,period:reportPeriod,date:new Date().toISOString().slice(0,10),stake:sum(a,o=>o.stake),rebate:sum(a,rebate),self:sum(a,selfProfit)}}
function saveLedgerPeriod(){let rec=ledgerRecord(scopedActive(reportMarket,reportPeriod)),i=S.ledger.findIndex(x=>ledgerKey(x.market,x.period)===ledgerKey(rec.market,rec.period));if(i>=0)S.ledger[i]=rec;else S.ledger.push(rec);save();render()}
function deleteLedgerPeriod(){S.ledger=S.ledger.filter(x=>ledgerKey(x.market,x.period)!==ledgerKey(reportMarket,reportPeriod));save();render()}
function ledgerSection(a){let live=ledgerRecord(a),saved=S.ledger.find(x=>ledgerKey(x.market,x.period)===ledgerKey(reportMarket,reportPeriod)),current=saved||live;let month=(window.ledgerMonth||new Date().toISOString().slice(0,7));let monthly=S.ledger.filter(x=>x.market===reportMarket&&String(x.date||'').slice(0,7)===month).sort((x,y)=>String(x.period).localeCompare(String(y.period)));return `<section class="panel ledger-panel"><details class="ledger-fold"><summary><span>记账本</span><span class="ledger-summary-total"><small>本期合计</small><b>¥${money(current.rebate+current.self)}</b></span></summary><div class="row">${metric('本期返点',current.rebate)}${metric('本期自留正负',current.self)}${metric('本期合计',current.rebate+current.self)}</div><div class="row"><span>${esc(reportMarket)} / ${esc(reportPeriod)}　${saved?'已保存（删除订单不影响记录）':'实时预览（尚未保存）'}</span><button class="primary" onclick="saveLedgerPeriod()">${saved?'更新本期记录':'保存本期记录'}</button>${saved?'<button onclick="deleteLedgerPeriod()">删除本期记录</button>':''}</div><div class="row"><label>统计月份 <input type="month" value="${esc(month)}" onchange="window.ledgerMonth=this.value;render()"></label></div><div class="row">${metric('当月累计返点',sum(monthly,x=>x.rebate))}${metric('当月自留正负',sum(monthly,x=>x.self))}${metric('当月合计',sum(monthly,x=>x.rebate+x.self))}</div><div class="scroll"><table><thead><tr><th>日期</th><th>盘口/期号</th><th>下注</th><th>返点</th><th>自留正负</th><th>合计</th></tr></thead><tbody>${monthly.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.market)} / ${esc(x.period)}</td><td>¥${money(x.stake)}</td><td>¥${money(x.rebate)}</td><td>¥${money(x.self)}</td><td>¥${money(x.rebate+x.self)}</td></tr>`).join('')||'<tr><td colspan="6">本月暂无已保存记录</td></tr>'}</tbody></table></div></details></section>`}
function summaryPage(){let a=scopedActive(reportMarket,reportPeriod),groups=Object.entries(Object.groupBy(a,o=>o.customer));return `<section class="panel"><h2>全盘汇总</h2>${scopePicker('report',reportMarket,reportPeriod)}<div class="row"><div class="metric"><small>总单数 / 客户数</small><b>${a.length} / ${new Set(a.map(o=>o.customer)).size}</b></div>${metric('总收注',sum(a,o=>o.stake))}${rebateBreakdown(a)}${metric('全盘中奖',sum(a,o=>o.payout))}${metric('庄家正负',sum(a,o=>o.stake-o.payout))}</div></section><section class="panel"><h2>客户订单汇总明细</h2>${groups.map(([c,os])=>`<details><summary>${esc(c)} · ${os.length}单 · 下注¥${money(sum(os,o=>o.stake))} · 赔付¥${money(sum(os,o=>o.payout))}</summary><div class="row"><span>客户正负：<b class="${sum(os,o=>o.payout-o.stake)>0?'red':sum(os,o=>o.payout-o.stake)<0?'green':''}">${sum(os,o=>o.payout-o.stake)>0?'+':''}¥${money(sum(os,o=>o.payout-o.stake))}</b></span><button onclick="copyCustomer('${encodeURIComponent(c)}')">复制客户明细</button></div>${orderTable(os)}</details>`).join('')||'<p class="muted">暂无订单</p>'}</section>${ledgerSection(a)}`};function copyCustomer(c){
 let customer=decodeURIComponent(c),os=scopedActive(reportMarket,reportPeriod).filter(o=>o.customer===customer);
 let stake=sum(os,o=>o.stake),pay=sum(os,o=>o.payout),net=+(pay-stake).toFixed(2);
 let lines=[`客户：${customer}`,`总下注：¥${money(stake)}`];
 let winners=[];let winCount=0;
 for(const o of os){
   const draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);
   if(!draw)continue;
   for(let i=0;i<o.groups.length;i++){
     let g=o.groups[i];if(!checkWin(o,g,draw.numbers))continue;
     winCount++;
     let rate=getOdds(o,g),missing=rate===null||rate===undefined||rate==='';
     let paid=missing?'待设置赔率':`¥${money((+o.stakes[i]||0)*(+rate))}`;
     winners.push(`${o.market}/${o.period} ${o.type} ${g.join('·')}｜下注¥${money(o.stakes[i])} × ${missing?'赔率待设置':rate} = ${paid}`);
   }
 }
 lines.push(`中奖组数：${winCount}组`,'中奖玩法明细：',...(winners.length?winners:['无中奖组合']),`中奖赔付：¥${money(pay)}`);
 if(net>0)lines.push(`本期应付客户：¥${money(net)}`);
 else if(net<0)lines.push(`本期应收客户：¥${money(-net)}`);
 else lines.push('本期结算：¥0.00');
 if(os.some(o=>o.unpriced>0))lines.push('注意：存在中奖但未设置赔率的组合，赔付与结算金额待核实。');
 copyText(lines.join('\n'));
}
function settingsPage(){return `<section class="panel"><h2>设置</h2><details><summary>客户管理（${S.customers.length}）</summary><div class="row"><input id="newCustomer" placeholder="新增客户名称"><button onclick="addCustomer()">新增客户</button></div>${S.customers.map(c=>`<div class="row"><span class="tag">${esc(c)}</span><button class="danger compact" onclick="deleteCustomer('${encodeURIComponent(c)}')">删除</button></div>`).join('')}</details><details><summary>盘口期号</summary>${['澳门','香港'].map(m=>`<div class="row"><label>${m} <input id="period_${m}" value="${esc(S.periods[m])}"></label></div>`).join('')}<button onclick="savePeriods()">保存期号</button></details><details><summary>玩法赔率及返点（可修改）</summary><div class="scroll"><table><tr><th>玩法</th><th>赔率</th><th>返点%</th></tr>${Object.keys(S.odds).map(k=>`<tr><td>${k}</td><td><input class="num" type="number" step="0.01" min="0" id="odd_${k}" value="${S.odds[k]??''}" placeholder="待补充"></td><td>${k in S.rebates?`<input class="num" type="number" min="0" max="100" step="0.1" id="reb_${k}" value="${S.rebates[k]}">`:'—'}</td></tr>`).join('')}</table></div><button class="primary" onclick="saveRates()">保存赔率返点</button></details><details><summary>复式拆组表（内置）</summary><div class="scroll"><table><tr><th>数量</th><th>二组</th><th>三组</th><th>四组</th><th>五组</th></tr>${Array.from({length:11},(_,i)=>i+2).map(n=>`<tr><td>${n}</td>${[2,3,4,5].map(k=>`<td>${n>=k?C(n,k):'—'}</td>`).join('')}</tr>`).join('')}</table></div></details><details><summary>生肖 / 五行 / 波色号码管理</summary><h3>生肖号码</h3><div class="row"><label>年肖 <select id="yearZ">${Z.map(z=>`<option ${S.yearZ===z?'selected':''}>${z}</option>`).join('')}</select></label></div>${Z.map(z=>`<div class="row"><label>${z} <input id="z_${z}" value="${esc(S.z[z])}" style="width:290px"></label></div>`).join('')}<h3>五行</h3>${Object.keys(S.w).map(k=>`<div class="row"><label>${k} <input id="w_${k}" value="${esc(S.w[k])}" style="width:360px"></label></div>`).join('')}<h3>波色</h3>${Object.keys(S.c).map(k=>`<div class="row"><label>${k} <input id="c_${k}" value="${esc(S.c[k])}" style="width:420px"></label></div>`).join('')}<button class="primary" onclick="saveMappings()">保存生效</button></details><details><summary>快速替换词库</summary><p class="muted">每行一条：原文=替换后</p><textarea id="replaceRules" style="min-height:100px">${esc(S.replacements.map(x=>x.join('=')).join('\n'))}</textarea><button onclick="saveReplaceRules()">保存词库</button></details><details><summary>数据备份 / 导入</summary><div class="row"><button onclick="exportData()">导出JSON备份</button><input type="file" id="importFile" accept="application/json,.json"><button onclick="importData()">导入备份</button></div><p class="warn">数据保存在此浏览器本地。清除网站数据或更换设备可能丢失，请定期导出备份。</p></details></section>`}
function addCustomer(){let v=$('newCustomer').value.trim();if(!v||S.customers.includes(v))return alert('客户名为空或已存在');S.customers.push(v);save();render()};function deleteCustomer(encoded){let c=decodeURIComponent(encoded);if(!confirm(`删除客户「${c}」及其全部历史订单？不可撤销。`))return;S.customers=S.customers.filter(x=>x!==c);S.orders=S.orders.filter(o=>o.customer!==c);selectedCustomer=S.customers[0]||'🐟';save();render()};function savePeriods(){for(const m of ['澳门','香港'])S.periods[m]=$('period_'+m).value.trim();save();render();alert('期号已保存')};function saveRates(){for(const k of Object.keys(S.odds)){let v=$('odd_'+k).value;S.odds[k]=v===''?null:+v;if(k in S.rebates)S.rebates[k]=+$('reb_'+k).value}save();render();alert('赔率返点已保存')};function saveMappings(){let z={},w={},c={};for(const k of Z)z[k]=$('z_'+k).value;for(const k of Object.keys(S.w))w[k]=$('w_'+k).value;for(const k of Object.keys(S.c))c[k]=$('c_'+k).value;let zAll=Z.flatMap(k=>nums(z[k])),cAll=Object.keys(c).flatMap(k=>nums(c[k]));if(zAll.length!==49||new Set(zAll).size!==49||cAll.length!==49||new Set(cAll).size!==49)return alert('生肖与波色必须各覆盖01-49，且不能重复');S.z=z;S.w=w;S.c=c;S.yearZ=$('yearZ').value;save();render();alert('号码映射已保存')};function saveReplaceRules(){S.replacements=$('replaceRules').value.split('\n').filter(x=>x.includes('=')).map(x=>[x.slice(0,x.indexOf('=')),x.slice(x.indexOf('=')+1)]);save();alert('词库已保存')};function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='49统计_V4.0_备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};function importData(){let f=$('importFile').files[0];if(!f)return alert('请选择JSON文件');if(!confirm('导入会覆盖当前本地数据，确认继续？'))return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!Array.isArray(x.orders)||!Array.isArray(x.customers)||!x.periods)throw Error('备份结构不正确');S={...defaults(),...x};save();render();alert('导入成功')}catch(e){alert('导入失败：'+e.message)}};reader.readAsText(f)};
// Ensure replacement dictionary applies before parsing while preserving original draft.
const originalParseInput=parseInput;parseInput=function(text,customer){let t=text;for(const [a,b] of S.replacements||[])if(a)t=t.split(a).join(b);return originalParseInput(t,customer)};
render();</script></body></html>
