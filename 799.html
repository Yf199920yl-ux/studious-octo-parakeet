function parseModuleNumbers(chunk,market,customer,spec){const fail=error=>[{error,raw:chunk.raw,market,customer}],c=spec.config,obj=c.object||'number',hit=findType(chunk.raw),body=chunk.raw.slice(hit?.length||chunk.type.length).trim(),am=body.match(new RegExp('(各号|各数|各组|各肖|各|总额|/)?\\s*('+amountPattern+')\\s*(?:元|块|钱)?\\s*$'));if(!am)return fail('缺少有效金额');const amount=amountValue(am[2]),content=body.slice(0,am.index).replace(/^[\s:：]+/,'').trim();if(!(amount>0)||!Number.isFinite(amount)||Math.abs(amount*100-Math.round(amount*100))>1e-7)return fail('金额必须大于0，最多保留两位小数');let tokens=obj==='zodiac'?(content.match(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]/g)||[]):obj==='tail'?(content.match(/\d/g)||[]):(content.match(/\d+/g)||[]),rest=obj==='zodiac'?content.replace(/[鼠牛虎兔龙蛇马羊猴鸡狗猪\s.,，、。:：;；/\-]/g,''):obj==='tail'?content.replace(/[\d尾号数\s.,，、。:：;；/\-]/g,''):content.replace(/[\d\s.,，、。:：;；/\-]/g,'');if(!tokens.length||rest||obj==='number'&&tokens.some(t=>t.length>2||+t<1||+t>49)||new Set(tokens.map(t=>obj==='zodiac'?t:+t)).size!==tokens.length)return fail('请填写有效的'+({number:'01—49号码',zodiac:'生肖',tail:'0—9尾数'}[obj])+'，同组不能重复');if(tokens.length<c.size)return fail('此玩法每组需要'+c.size+'个'+({number:'号码',zodiac:'生肖',tail:'尾数'}[obj]));if(C(tokens.length,c.size)>5000)return fail('组合超过5000组，请拆分录入');const groups=combinations(obj==='number'?tokens.map(fmt):tokens,c.size),cents=Math.round(amount*100),unit=Math.floor(cents/groups.length),stakes=/^各/.test(am[1]||'')?groups.map(()=>amount):groups.map((_,i)=>(unit+(i===groups.length-1?cents-unit*groups.length:0))/100);return [{...makeOrder(chunk.type,chunk.raw,groups,stakes,market,customer),ruleType:spec.rule,customRule:true}]}

function getOdds(o,g,draw){const numbers=draw||S.draws.find(d=>d.market===o.market&&d.period===o.period)?.numbers,config=moduleConfig(o);if(config)return moduleRate(config,g,numbers,o);if(o.moduleSnapshot&&playRuleType(o)==='三中二')return numbers&&threeTwoHits(g,numbers)===3?o.moduleSnapshot.fullRate:o.moduleSnapshot.rate;if(o.moduleSnapshot)return o.moduleSnapshot.groupRates?.[o.groups?.findIndex(x=>x.join('|')===g.join('|'))]??o.moduleSnapshot.rate;return S.odds[playRuleType(o)]??null}

/* ═══════════ 03 · 录单、复式与本地识别 ═══════════ */
function expandGroupedZodiacBets(input){
 const src=String(input).replace(/\r/g,'');
 const prefix='(?:复式)?(?:[一二两三四五12345](?:肖中|连肖|肖)|[二两三四五2345]连尾)';
 const boundary=new RegExp(prefix,'g');
 const hits=[...src.matchAll(boundary)];
 if(!hits.length)return src;
 const amount='(?:\\d+(?:\\.\\d+)?|[零一二两三四五六七八九十]+)';
 const amountRx=new RegExp('(各(?:组|号|数)?\\s*|/\\s*)?('+amount+')\\s*(?:元|块|钱)?\\s*$');
 let out=src.slice(0,hits[0].index);
 for(let j=0;j<hits.length;j++){
  const h=hits[j],start=h.index+h[0].length,end=j+1<hits.length?hits[j+1].index:src.length;
  const body=src.slice(start,end),prefixText=h[0];
  const m=prefixText.match(/[一二两三四五12345]/);
  const k=m?({'一':1,'1':1,'二':2,'两':2,'2':2,'三':3,'3':3,'四':4,'4':4,'五':5,'5':5})[m[0]]:0;
  const tail=prefixText.includes('尾');
  const am=body.match(amountRx);
  if(!am||!k||prefixText.startsWith('复式')){out+=prefixText+body;continue}
  const stake=body.slice(am.index).trim(), raw=body.slice(0,am.index).trim();
  let groups=[];
  if(tail){
   const candidates=raw.split(/[\s，,、。;；／/]+/).filter(Boolean);
   if(candidates.length>1&&candidates.every(x=>new RegExp('^\\d(?:[.\\-]\\d){'+(k-1)+'}$').test(x)||new RegExp('^\\d{'+k+'}$').test(x)))groups=candidates;
   else {const digits=raw.match(/\d/g)||[];if(digits.length>k&&digits.length%k===0)for(let i=0;i<digits.length;i+=k)groups.push(digits.slice(i,i+k).join('.'))}
  }else{
   const candidates=raw.split(/[\s，,、。.;；／/\-]+/).filter(Boolean);
   if(candidates.length>1&&candidates.every(x=>[...x].length===k&&[...x].every(c=>Z.includes(c))))groups=candidates;
   else {const chars=[...raw].filter(c=>Z.includes(c));if(chars.length>k&&chars.length%k===0)for(let i=0;i<chars.length;i+=k)groups.push(chars.slice(i,i+k).join(''))}
  }
  out+=groups.length>1?groups.map(g=>prefixText+g+stake).join(' '):prefixText+body;
 }
 return out;
}

function applyLibraryOnce(text,rules,names=[]){
 const map=new Map(rules.filter(r=>r[0]).map(([a,b])=>[String(a),String(b??'')]));
 const protectedWords=new Set([...names,...map.values()].filter(Boolean));
 const keys=[...new Set([...map.keys(),...protectedWords])].sort((a,b)=>b.length-a.length);
 const source=String(text);let out='',i=0;
 while(i<source.length){const k=keys.find(k=>source.startsWith(k,i));if(!k){out+=source[i++];continue}out+=map.has(k)?map.get(k):k;i+=k.length;}
 return out;
}

function parseInput(text,customer){
 let input=applyLibraryOnce(text,(S.replacements||[]).filter(r=>!compoundRule(r[0])),[...Object.keys(S.customPlays||{}),...(S.compoundWords||[]).map(r=>r.alias)]);
 input=input.replace(/香特/g,'香港特').replace(/#订单\d+\s*/g,'').replace(/[Ｔｔ]/g,'T');
 // Prefixes scope all following bets until the next prefix. 港澳 explicitly duplicates an order across both markets.
 const parts=input.split(/(港澳|新澳门|澳门|新澳|香港|港|澳|香)/),result=[];let markets=['澳门'];
 for(const part of parts){if(!part.trim())continue;if(/^(港澳|新澳门|澳门|新澳|香港|港|澳|香)$/.test(part)){markets=part==='港澳'?['香港','澳门']:/^(香港|港|香)$/.test(part)?['香港']:['澳门'];continue}
   for(const market of markets)for(const ch of splitChunks(part.replace(/^[\s:：,，、]+/,'')))result.push(...parseChunk(ch,market,customer));
 }
 return result.length?result:[{error:'请输入投注内容',raw:text}];
}

function parseStandardOrder(chunk,market,customer){
 let hit=chunk.canonical?{length:chunk.type.length,raw:chunk.type}:findType(chunk.raw),type=chunk.type||'特',raw=chunk.raw;
 // Canonicalize the full matched alias (including T and 平特) before extracting money.
 if(hit){raw=type+' '+raw.slice(hit.length);if(type==='平尾'&&/^平\d尾/.test(hit.raw))raw='平尾 '+hit.raw.match(/\d/)[0]+' '+raw.slice(3)}
 if(!hit)raw=type+' '+raw;
 const am=raw.match(new RegExp('(各号|各数|各组|各肖|各|总额|/)?\\s*('+amountPattern+')\\s*(?:元|块|钱)?\\s*$'));
 if(!am)return [{error:'缺少有效金额',raw:chunk.raw,market,customer}];
 let amount=amountValue(am[2]),mode=am[1]||'',content=raw.slice(type.length,am.index).replace(/^[\s:：]+/,'').trim();
 if(!(amount>0)||!Number.isFinite(amount)||Math.abs(amount*100-Math.round(amount*100))>1e-7)return [{error:'金额必须大于0，最多保留两位小数',raw:chunk.raw,market,customer}];
 const isTail=type==='平尾'||type.includes('连尾')||(type==='平特'&&chunk.raw.includes('尾'))||(type==='特'&&(content.includes('尾')||chunk.raw.startsWith('特尾')));
 let tokens=isTail?(content.match(/\d/g)||[]):(content.match(/\d+|[鼠牛虎兔龙蛇马羊猴鸡狗猪]/g)||[]);
 if(content.replace(/[0-9鼠牛虎兔龙蛇马羊猴鸡狗猪\s.,，、。:：;；/\-尾号数()（）]/g,''))return [{error:'内容中有未识别文字，请检查玩法或分隔',raw:chunk.raw,market,customer}];
 const isZ=type.includes('肖中')||(type==='平特'&&!isTail);
 if(!tokens.length||(!isTail&&!isZ&&tokens.some(t=>!Z.includes(t)&&(+t<1||+t>49||t.length>2))))return [{error:'下注号码须在01—49之间',raw:chunk.raw,market,customer}];
 if(isZ&&tokens.some(t=>!Z.includes(t)))return [{error:'生肖玩法请填写生肖',raw:chunk.raw,market,customer}];
 if((isTail||isZ)&&new Set(tokens).size!==tokens.length)return [{error:'同一组生肖或尾数不能重复',raw:chunk.raw,market,customer}];
 const k=['特','平特','一肖中','平尾'].includes(type)?undefined:modulePresetConfig(type)?.size;
 if(k&&!isZ&&!isTail&&(tokens.some(t=>Z.includes(t))||new Set(tokens.map(Number)).size!==tokens.length))return [{error:'组合号码不能重复或混入生肖',raw:chunk.raw,market,customer}];
 const divide=(total,n)=>{const cents=Math.round(total*100),unit=Math.floor(cents/n);return Array.from({length:n},(_,i)=>(unit+(i===n-1?cents-unit*n:0))/100)};
 const make=(t,groups,stakes)=>({...makeOrder(t,chunk.raw,groups,stakes,market,customer)});
 if(type==='平特'){
   const groups=tokens.map(t=>[t]),stakes=mode.startsWith('各')?tokens.map(()=>amount):divide(amount,tokens.length),special=[],ss=[];
   tokens.forEach((t,i)=>{const ns=isTail?Array.from({length:49},(_,n)=>n+1).filter(n=>n%10===+t):zNums(t);special.push(...ns.map(n=>[fmt(n)]));ss.push(...divide(stakes[i],ns.length))});
   return [make(isTail?'平尾':'一肖中',groups,stakes),make('特',special,ss)];
 }
 if(type==='特'){
   let groups=[],stakes=[];
   const expanded=t=>isTail?Array.from({length:49},(_,n)=>n+1).filter(n=>n%10===+t).map(fmt):Z.includes(t)?zNums(t).map(fmt):[fmt(t)];
   if(tokens.some(t=>Z.includes(t))&&['各','各肖'].includes(mode))tokens.forEach(t=>{const ns=expanded(t);groups.push(...ns.map(n=>[n]));stakes.push(...divide(amount,ns.length))});
   else{groups=tokens.flatMap(t=>expanded(t).map(n=>[n]));stakes=/^各/.test(mode)?groups.map(()=>amount):divide(amount,groups.length)}
   return [make('特',groups,stakes)];
 }
 // Validation and amount extraction run once; only combination construction remains.
 const groupedRaw=type+' '+content+' '+(mode==='各肖'?'各':mode==='总额'?'':mode)+am[2];
 const fail=error=>[{error,raw:groupedRaw,market,customer}];
 let groups;
 if(type==='一肖中'||type==='平尾')groups=tokens.map(t=>[t]);
 else if(k){
  if(type.includes('不中')&&tokens.length!==k)return fail(type+'需要'+k+'个号码');
  if(tokens.length<k)return fail(type+'至少需要'+k+'项');
  groups=combinations(tokens,k);
 }else return fail('暂不支持此玩法');
 if(!groups.length)return fail('没有生成有效组合');
 // Preserve the established legacy rounding and put its remainder in the last group.
 const unit=Math.floor(amount/groups.length*100)/100;
 const stakes=mode.startsWith('各')?groups.map(()=>amount):groups.map((_,i)=>i===groups.length-1?+(amount-unit*(groups.length-1)).toFixed(2):unit);
 return [makeOrder(type,groupedRaw,groups,stakes,market,customer)];
}

let transferCopyMode='customer';
function transferText(orders,mode=transferCopyMode){

 for(const o of orders){const parts=allocationParts(o);const key=JSON.stringify([o.market,o.period,mode==='customer'?o.customer:'']);
  for(let i=0;i<o.groups.length;i++){if(parts[i]===null)continue;const cents=Math.round(((+o.stakes[i]||0)-parts[i])*100);if(cents<=0)continue;
   if(!sections.has(key))sections.set(key,{market:o.market,period:o.period,customer:o.customer,plays:new Map(),total:0});const sec=sections.get(key);sec.total+=cents;total+=cents;
   if(!sec.plays.has(o.type))sec.plays.set(o.type,new Map());const groups=sec.plays.get(o.type),g=o.groups[i],gkey=JSON.stringify(g);if(!groups.has(gkey))groups.set(gkey,{g,cents:0});groups.get(gkey).cents+=cents;
  }
 }
 const lines=[];for(const sec of sections.values()){if(lines.length)lines.push('');lines.push((mode==='customer'?'【'+sec.customer+'】 ':'【合并】 ')+sec.market+'/'+sec.period);

}

function numberSelectorPattern(){return '(?:[红蓝绿](?:波)?(?:合单|合双|大单|大双|小单|小双|大|小|单|双)?|合单|合双|大单|大双|小单|小双|大|小|单|双)'}

function parseNumberSelectors(chunk,market,customer){const explicit=chunk.type&&S.customPlays?.[chunk.type],hit=explicit?findType(chunk.raw):null,body=hit?chunk.raw.slice(hit.length):chunk.raw,selectorRx=new RegExp(numberSelectorPattern(),'g');if(!selectorRx.test(body))return null;const fail=error=>[{error,raw:chunk.raw,market,customer}];let play=chunk.type;if(explicit){if(explicit.deleted)return null;if(!selectorSpecialPlay(play))return fail('大小、单双、合单合双及波色简写，请使用已配置的特码号码玩法')}else{const names=manualPlayNames().filter(selectorSpecialPlay);if(names.length!==1)return fail(names.length?'存在多个特码号码玩法，请在简写前填写完整玩法名称':'请先配置一个号码类型、每组1个、开奖范围为特码的玩法');play=names[0]}
 const spec=S.customPlays[play],parts=[],amountRx=new RegExp('(各号|各数|各组|各|总额|/)\\s*('+amountPattern+')\\s*(?:元|块|钱)?','g');let start=0,m;
 while((m=amountRx.exec(body))){parts.push({content:body.slice(start,m.index),mode:m[1],amount:m[2],original:body.slice(start,amountRx.lastIndex).trim()});start=amountRx.lastIndex}
 const tail=body.slice(start).replace(/^[\s,，、。;；:：]+|[\s,，、。;；:：]+$/g,'');if(tail){const terminal=tail.match(new RegExp('\\s*('+amountPattern+')\\s*(?:元|块|钱)?\\s*$'));if(!terminal)return fail('选号简写缺少金额，请按“红单各30”填写');parts.push({content:tail.slice(0,terminal.index),mode:'',amount:terminal[1],original:tail})}
 if(!parts.length)return fail('选号简写缺少金额，请按“红单各30”填写');const orders=[];
 for(const part of parts){let emptySelector='';const expanded=part.content.replace(new RegExp(numberSelectorPattern(),'g'),selector=>{const values=numberSelectorValues(selector);if(!values.length)emptySelector=selector;return ' '+values.join(' ')+' '});if(emptySelector)return fail('当前号码映射中“'+emptySelector+'”没有匹配号码');const raw='特 '+expanded.trim()+' '+part.mode+part.amount;const parsedParts=parseStandardOrder({type:'特',raw,canonical:true},market,customer);for(const o of parsedParts){const original=(explicit?play+' ':'')+part.original;if(o.error)orders.push({...o,raw:original});else orders.push({...o,type:play,raw:original,ruleType:spec.rule,customRule:true})}}

}

function parseChunk(chunk,market,customer){const compound=compoundRule(chunk.type);if(compound){const fail=error=>[{error,raw:chunk.raw,market,customer}];if(compound.targets.some(t=>!S.customPlays[t]||S.customPlays[t].deleted||compoundRule(t)))return fail('复合玩法关联的玩法不存在或已删除');const hit=findType(chunk.raw),body=chunk.raw.slice(hit.length).trim();if(hit.raw.startsWith('复式'))return fail('复合简称暂不支持复式前缀');const orders=compound.targets.flatMap(t=>{const raw=t+' '+body;return auditExpandPlayChunk({type:t,raw}).flatMap(ch=>parseChunk(ch,market,customer))});return orders.some(o=>o.error)?fail('复合玩法识别失败：'+orders.filter(o=>o.error).map(o=>o.error).join('；')):orders;}const selectorOrders=parseNumberSelectors(chunk,market,customer);if(selectorOrders)return selectorOrders;const spec=S.customPlays?.[chunk.type],rule=spec?.rule||chunk.type;if(!spec)return [{error:'请先在设置中新增并配置玩法，并在录单时填写玩法名称',raw:chunk.raw,market,customer}];if(spec?.deleted)return [{error:'此玩法已删除，请先在设置中恢复',raw:chunk.raw,market,customer}];if(rule==='号码命中规则'){const c=spec.config;if((c.object||'number')==='number'&&c.size===1&&c.scope==='special'&&(c.match||'hits')==='hits'){const hit=findType(chunk.raw),raw='特 '+chunk.raw.slice(hit?.length||chunk.type.length);return parseStandardOrder({type:'特',raw,canonical:true},market,customer).map(o=>o.error?{...o,raw:chunk.raw}:{...o,type:chunk.type,raw:chunk.raw,ruleType:rule,customRule:true})}return parseModuleNumbers(chunk,market,customer,spec);}if(!spec)return [{error:'请先在设置中新增并配置此玩法',raw:chunk.raw,market,customer}];const base=rule==='三中二'?'三中三':rule,hit=findType(chunk.raw),raw=base+' '+chunk.raw.slice(hit?.length||chunk.type.length);return parseStandardOrder({type:base,raw,canonical:true},market,customer).map(o=>o.error?{...o,raw:chunk.raw}:{...o,type:chunk.type,raw:chunk.raw,ruleType:rule,customRule:!!spec})}

function makeOrder(type,raw,groups,stakes,market,customer){return {id:uid(),time:new Date().toLocaleString('zh-CN'),market,period:S.periods[market],customer,type,raw,groups,stakes,stake:+sum(stakes,x=>x).toFixed(2),yearZAtBet:S.yearZ,yearNumbersAtBet:nums(S.z[S.yearZ]||''),status:'待开奖',won:0,payout:0,self:null,transferred:0,received:false}}

function ordersPage(){if(orderFilters.customer&&!S.customers.includes(orderFilters.customer))orderFilters.customer='';const market=filterMarket,period=periodChoices(market).includes(viewPeriod)?viewPeriod:S.periods[market];return `<section class="panel orders-workspace">${scopePicker('order',market,period)}<div class="row"><select id="orderCustomer"><option value="">全部客户</option>${S.customers.map(c=>`<option value="${esc(c)}" ${orderFilters.customer===c?'selected':''}>${esc(c)}</option>`).join('')}</select><input id="orderSearch" value="${esc(orderFilters.query)}" placeholder="投注内容/玩法"><select id="orderStatus"><option value="">全部状态</option>${['待开奖','已兑奖','已撤单'].map(v=>`<option value="${v}" ${orderFilters.status===v?'selected':''}>${v}</option>`).join('')}</select><button onclick="filterOrders()">筛选</button><button class="danger" onclick="clearScopedOrders()">清除所选盘口本期订单</button><button class="danger" onclick="clearOrders(true)">清除所有订单</button><button onclick="undoClearOrders()">撤回上次清除</button></div><div id="orderClearNotice" class="muted" role="status"></div><div id="ordersTable">${orderTable(filteredOrderRows())}</div></section>`}

function clearScopedOrders(){const market=filterMarket,period=periodChoices(market).includes(viewPeriod)?viewPeriod:S.periods[market];if(period!==S.periods[market]){const el=$('orderClearNotice');if(el)el.textContent='历史期订单不能通过当期清除按钮删除';return}clearOrders(false)}

function orderTable(rows){return `<div class="scroll"><table><thead><tr><th>时间</th><th>盘口/期号</th><th>客户</th><th>玩法</th><th>内容</th><th>组数</th><th>下注</th><th>中奖组</th><th>赔付</th><th>状态</th><th>撤单</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.time)}</td><td>${o.market}/${esc(o.period)}</td><td>${page==='订单'?orderCustomerEditor(o):esc(o.customer)}</td><td>${esc(o.type)}</td><td title="${esc(o.raw)}">${esc(o.raw).slice(0,35)}</td><td>${o.groups.length}</td><td>${money(o.stake)}</td><td>${o.won}</td><td>${money(o.payout)}</td><td>${o.status}</td><td><button class="compact ${o.status==='已撤单'?'':'danger'}" onclick="cancelOrder('${o.id}')">${o.status==='已撤单'?'恢复订单':'撤单'}</button></td></tr>`).join('')}</tbody></table></div>`}

function filterOrders(){captureOrderFilters();refreshOrderTable()}

function cancelOrder(id){if(page==='订单')captureOrderFilters();const o=S.orders.find(x=>String(x.id)===String(id));if(!o)return;if(transferOrderLocked(o)){alert('该订单已复制或上家已收，不能直接撤单，请先与上家核对');return} if(o.status==='已撤单'){const draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);if(draw){Object.assign(o,calculate(o,draw.numbers),{status:'已兑奖'});}else{Object.assign(o,{status:'待开奖',won:0,payout:0,unpriced:0});}}else{Object.assign(o,{status:'已撤单',won:0,payout:0,unpriced:0});}eatApplySavedRules(new Set([o.market+'|'+o.period]));save();const message=o.status==='已撤单'?'订单已撤单，可点击「恢复订单」重新启用':'订单已恢复，统计已更新';if(page==='订单'&&$('ordersTable'))refreshOrderTable(message);else{render();const msg=$('orderClearNotice');if(msg)msg.textContent=message}}

function clearOrders(all){ledgerAutoSnapshot();const targetMarket=filterMarket;if(!all&&targetMarket!=='澳门'&&targetMarket!=='香港'){const notice=$('orderClearNotice');if(notice)notice.textContent='请先选择新澳门或香港盘口，再清除当期订单';return;}const targetPeriod=S.periods[targetMarket];const targets=S.orders.filter(o=>all||(o.market===targetMarket&&o.period===targetPeriod));if(targets.some(transferOrderPending)){$('orderClearNotice').textContent='有已复制待确认的转单，请先确认本批已收，或确认未发送后撤回本批';return}if(!targets.length){$('orderClearNotice').textContent='当前范围没有可清除的订单';return}lastClearedOrders=structuredClone(targets);const ids=new Set(targets.map(o=>o.id));S.orders=S.orders.filter(o=>!ids.has(o.id));eatApplySavedRules();save();render();const msg=$('orderClearNotice');if(msg)msg.textContent=`已清除${targets.length}笔${all?'全部':'当前'+(targetMarket==='澳门'?'新澳门':'香港')+'/'+targetPeriod}订单，可点击「撤回上次清除」恢复。`}

function restoreClearedOrders(){if(!lastClearedOrders?.length){$('orderClearNotice').textContent='没有可撤回的清除记录（刷新页面后无法撤回）';return}const ids=new Set(S.orders.map(o=>o.id));const restore=lastClearedOrders.filter(o=>!ids.has(o.id));S.orders.push(...restore);lastClearedOrders=null;eatApplySavedRules();save();render();$('orderClearNotice').textContent=`已恢复${restore.length}笔订单`}

function copySettledCustomer(c){
 let customer=decodeURIComponent(c),os=scopedActive(reportMarket,reportPeriod).filter(o=>o.customer===customer);
 let stake=sum(os,o=>o.stake),pay=sum(os,o=>o.payout),net=+(pay-stake).toFixed(2);
 let lines=[`客户：${customer}`,`总下注：¥${money(stake)}`];
 let winners=[];let winCount=0;
 for(const o of os){
   const draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);
   if(!draw)continue;
   for(let i=0;i<o.groups.length;i++){
     let g=o.groups[i];if(!checkWin(o,g,draw.numbers))continue;
     winCount++;
     let rate=getOdds(o,g),missing=rate===null||rate===undefined||rate==='';
     let paid=missing?'待设置赔率':`¥${money((+o.stakes[i]||0)*(+rate))}`;
     winners.push(`${o.market}/${o.period} ${o.type} ${g.join('·')}｜下注¥${money(o.stakes[i])} × ${missing?'赔率待设置':rate} = ${paid}`);
   }
 }
 lines.push(`中奖组数：${winCount}组`,'中奖玩法明细：',...(winners.length?winners:['无中奖组合']),`中奖赔付：¥${money(pay)}`);
 if(net>0)lines.push(`本期应付客户：¥${money(net)}`);
 else if(net<0)lines.push(`本期应收客户：¥${money(-net)}`);
 else lines.push('本期结算：¥0.00');
 if(os.some(o=>o.unpriced>0))lines.push('注意：存在中奖但未设置赔率的组合，赔付与结算金额待核实。');
 copyText(lines.join('\n'));
}

function customerListHtml(){return S.customers.map(c=>`<div class="row"><span class="tag">${esc(c)}</span><button class="danger compact" onclick="deleteCustomer('${encodeURIComponent(c).replace(/'/g,'%27')}')">删除</button></div>`).join('')}

function reopenCustomerManager(focus=false){const manager=$('customerManager');if(manager)manager.setAttribute('open','');if(focus)$('newCustomer')?.focus({preventScroll:true})}

function addCustomer(){const input=$('newCustomer'),v=input.value.trim();if(!v||S.customers.includes(v))return alert('客户名为空或已存在');const before=S.customers;S.customers=[...before,v];if(!save()){S.customers=before;return}if(!S.customers.includes(selectedCustomer))selectedCustomer=v;const list=$('customerList');if(list)list.innerHTML=customerListHtml();else render();$('newCustomer').value='';reopenCustomerManager(true)}

function eatSpecialOrders(){return active().filter(o=>playRuleType(o)==='特')}

function setOrderAllocation(id,mode){const o=active().find(o=>o.id===id);if(!o)return;if(transferOrderLocked(o)){eatFeedback('该订单已复制或上家已收，分配已锁定');return}updateAllocation(o,o.stakes.map(n=>mode==='self'?n:0));auditMarkManual(o);save();render()}

function deleteCustomer(encoded){ledgerAutoSnapshot();const c=decodeURIComponent(encoded);if(S.orders.some(o=>o.customer===c&&transferOrderPending(o)))return alert('该客户有已复制待确认的转单，请先处理本批');if(!confirm(`删除客户「${c}」及其全部历史订单？不可撤销。`))return;S.customers=S.customers.filter(x=>x!==c);S.orders=S.orders.filter(o=>o.customer!==c);selectedCustomer=S.customers[0]||'';confirmed=[];if(settleCustomer===c)settleCustomer='';eatApplySavedRules();save();render();reopenCustomerManager()}

function copyCustomer(c){const os=scopedActive(reportMarket,reportPeriod).filter(o=>o.customer===decodeURIComponent(c));if(os.some(o=>o.status!=='已兑奖'))return copyText(`客户：${decodeURIComponent(c)}\n总下注：¥${money(sum(os,o=>o.stake))}\n本期尚未完成开奖兑奖，结算待定。`);if(os.some(o=>o.unpriced>0))return copyText(`客户：${decodeURIComponent(c)}\n总下注：¥${money(sum(os,o=>o.stake))}\n中奖玩法赔率未设置完整，结算待核实。`);return copySettledCustomer(c)}

function undoClearOrders(){restoreClearedOrders();auditRecalculate();save();render()}

function transferOrderPending(o){return transferBatchList().some(b=>b.status==='pending'&&b.items.some(i=>i.id===String(o.id)))}

function transferOrderLocked(o){return !!o.received||transferOrderPending(o)}

function transferOrderSignature(o){return JSON.stringify([o.market,o.period,o.customer,o.type,o.raw,o.groups,o.stakes,allocationParts(o),o.status==='已撤单'])}

function captureOrderFilters(){const c=$('orderCustomer'),q=$('orderSearch'),s=$('orderStatus');if(c)orderFilters.customer=c.value;if(q)orderFilters.query=q.value.trim();if(s)orderFilters.status=s.value}

function filteredOrderRows(){const period=periodChoices(filterMarket).includes(viewPeriod)?viewPeriod:S.periods[filterMarket],f=orderFilters;return scopedOrders(filterMarket,period).filter(o=>(!f.customer||o.customer===f.customer)&&(!f.query||o.raw.includes(f.query)||o.type.includes(f.query))&&(!f.status||o.status===f.status))}

function refreshOrderTable(message){const el=$('ordersTable');if(el){const left=el.querySelector('.scroll')?.scrollLeft||0;el.innerHTML=orderTable(filteredOrderRows());const scroll=el.querySelector('.scroll');if(scroll)scroll.scrollLeft=left}if(message!==undefined){const notice=$('orderClearNotice');if(notice)notice.textContent=message}}

function orderCustomerEditor(o){const arg=encodeURIComponent(String(o.id)).replace(/'/g,'%27');return `<select class="order-customer-select" aria-label="修改订单客户" data-order-customer="${esc(o.id)}" onchange="changeOrderCustomer(decodeURIComponent('${arg}'),this.value)">${S.customers.map(c=>`<option value="${esc(c)}" ${c===o.customer?'selected':''}>${esc(c)}</option>`).join('')}</select>`}

function changeOrderCustomer(id,customer){
 if(page==='订单')captureOrderFilters();const o=S.orders.find(o=>String(o.id)===String(id));if(!o||!S.customers.includes(customer)){refreshOrderTable('请从已有客户中选择');return false}if(o.customer===customer)return true;
 const old=o.customer,oldSignature=transferOrderSignature(o),pending=transferBatchList().filter(b=>b.status==='pending').flatMap(b=>b.items).filter(i=>i.id===String(o.id));
 if(pending.some(i=>i.signature!==oldSignature)){refreshOrderTable('本笔订单与待确认批次不一致，请先核对批次');return false}
 const snapshots=transferBatchList().flatMap(b=>b.items).filter(i=>i.id===String(o.id)).map(item=>({item,signature:item.signature,bookkeepingCustomer:item.bookkeepingCustomer}));
 o.customer=customer;for(const x of snapshots){if(pending.includes(x.item))x.item.signature=transferOrderSignature(o);x.item.bookkeepingCustomer=customer}
 if(!save()){o.customer=old;for(const x of snapshots){x.item.signature=x.signature;if(x.bookkeepingCustomer===undefined)delete x.item.bookkeepingCustomer;else x.item.bookkeepingCustomer=x.bookkeepingCustomer}refreshOrderTable('客户修改未保存，原客户已保留');return false}
 if(page==='订单'&&$('ordersTable'))refreshOrderTable('订单客户已修改为「'+customer+'」，金额及分配保持不变');else render();return true;
}

/* ═══════════ 05 · 开奖兑奖与风险 ═══════════ */
function drawPageLayout(){return `<div class="grid">${['澳门','香港'].map(m=>`<section class="panel"><h2>${m==='澳门'?'新澳门':'香港'}</h2>${lastMarketDraw(m)}<div class="row"><label>期号 <input id="p_${m}" value="${esc(S.periods[m])}"></label></div><input class="w100" id="d_${m}"><div class="row"><button class="primary" onclick="settle('${m}')">开奖兑奖并保存</button></div><div id="dmsg_${m}" class="muted"></div></section>`).join('')}</div><section class="panel"><details class="draw-history-fold"><summary>开奖记录</summary><div class="draw-history-list">${drawHistoryCards()}</div></details></section><section class="panel"><h2>客户兑奖详情</h2>${scopePicker('report',reportMarket,reportPeriod)}${settlementOverview()}${settlementTable()}</section>`}

function calculate(o,draw){let won=0,payout=0,unpriced=0;o.groups.forEach((g,i)=>{if(checkWin(o,g,draw)){won++;let rate=getOdds(o,g,draw);if(rate===null||rate===undefined||rate==='')unpriced++;else payout+=(+o.stakes[i]||0)*(+rate)}});return {won,payout:+payout.toFixed(2),unpriced}}

function riskNumberData(){let orders=active().filter(o=>playRuleType(o)==='特'),data=Array.from({length:49},(_,i)=>{let n=i+1,stake=0,loss=0,count=0;for(const o of orders){o.groups.forEach((g,j)=>{if(+g[0]===n){stake+=o.stakes[j];loss+=o.stakes[j]*(+getOdds(o,g)||0);count++}})}return {n,stake,loss,count}}).sort((a,b)=>b.loss-a.loss||a.n-b.n);return data}

function dangerousNumbers(){return riskNumberData().filter(x=>x.loss>0).slice(0,10).map(x=>fmt(x.n))}

function riskPage(){let data=riskNumberData();let top=data[0]?.loss>0?data[0]:null;return `<section class="panel risk-workspace">${currentScopePicker()}${riskArchivedNotice()}<div class="row">${metric('总收注',sum(active(),o=>o.stake))}${metric('总返点',sum(active(),rebate))}${metric('已中奖',sum(active(),o=>o.payout))}${metric('当前正负',sum(active(),o=>o.stake+rebate(o)-o.payout))}</div></section><section class="panel"><h2>49号码风险提示</h2>${pendingRates(active())}<div class="row"><div class="metric">最大赔付号 <b class="red">${top?fmt(top.n):'—'}</b></div><div class="metric">理论最大赔付 <b class="red">¥${money(top?.loss)}</b></div><div class="metric">危险号码 <b class="red">${dangerousNumbers().join('、')||'—'}</b></div></div><div class="scroll"><table><tr><th>排名</th><th>号码/波色</th><th>生肖</th><th>下注金额</th><th>理论赔付</th><th>下注注数</th></tr>${data.map((x,i)=>`<tr><td>${i+1}</td><td>${lottoBall(x.n)}</td><td>${zOf(x.n)}</td><td>${money(x.stake)}</td><td class="${i<10&&x.loss>0?'red':''}">${money(x.loss)}</td><td>${x.count}</td></tr>`).join('')}</table></div></section>`}

function settlementOverview(){const a=scopedActive(reportMarket,reportPeriod).filter(o=>o.status==='已兑奖'&&(!settleCustomer||o.customer===settleCustomer)),balance=sum(a,o=>o.stake-o.payout);return `<div class="row"><label>客户 <select onchange="settleCustomer=this.value;render()"><option value="">全部客户</option>${S.customers.map(c=>`<option ${settleCustomer===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div><div class="row">${auditCountMetric('客户数',new Set(a.map(o=>o.customer)).size)}${metric('总下注',sum(a,o=>o.stake))}${metric('中奖赔付',sum(a,o=>o.payout))}<div class="metric"><small>本期应收 / 应付</small><b class="${balance>=0?'green':'red'}">${a.some(o=>o.unpriced>0)?'结算待核实':(balance>=0?'应收':'应付')+' ¥'+money(Math.abs(balance))}</b></div></div>${pendingRates(a)}`}

function auditRecalculate(){for(const o of S.orders){if(o.status==='已撤单')continue;const draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);if(draw)Object.assign(o,calculate(o,draw.numbers),{status:'已兑奖'});else if(o.status==='已兑奖')Object.assign(o,{status:'待开奖',won:0,payout:0,unpriced:0})}}

function auditSettle(m){const period=$('p_'+m).value.trim(),parts=$('d_'+m).value.match(/\d+/g)||[],ns=parts.map(Number);if(!auditPeriodOK(period))return alert('期号格式应为2026-303');if(ns.length!==7||new Set(ns).size!==7||parts.some(p=>p.length>2)||ns.some(n=>!Number.isInteger(n)||n<1||n>49))return alert('请输入7个不重复的01—49号码');if(S.draws.some(d=>d.market===m&&d.period===period))return alert('本期已保存，请先撤回旧开奖记录');S.draws.push({id:uid(),market:m,period,numbers:ns,time:new Date().toLocaleString('zh-CN'),createdAt:new Date().toISOString(),zSnapshot:structuredClone(S.z),yearZ:S.yearZ});auditRecalculate();if(period.localeCompare(S.periods[m],undefined,{numeric:true})>=0)S.periods[m]=auditNextPeriod(period);reportMarket=m;reportPeriod=period;confirmed=[];drawDrafts[m]='';delete auditDrawPeriods[m];save();render();alert('开奖记录保存成功，相关订单已兑奖')}

function undoDraw(id){const d=S.draws.find(x=>x.id===id);if(!d||!confirm('撤回本期开奖？对应订单恢复待开奖。'))return;S.draws=S.draws.filter(x=>x.id!==id);S.orders.filter(o=>o.market===d.market&&o.period===d.period&&o.status==='已兑奖').forEach(o=>Object.assign(o,{status:'待开奖',won:0,payout:0,unpriced:0}));const newer=S.draws.some(x=>x.market===d.market&&x.period.localeCompare(d.period,undefined,{numeric:true})>0);if(!newer&&S.periods[d.market]===auditNextPeriod(d.period))S.periods[d.market]=d.period;reportMarket=d.market;reportPeriod=d.period;confirmed=[];save();render()}

function drawPage(){let html=drawPageWithLivePreview();for(const m of ['澳门','香港']){const period=auditDrawPeriods[m]||S.periods[m];html=html.replace(new RegExp('id="p_'+m+'"[^>]*value="[^" ]*"'),`id="p_${m}" oninput="auditDrawPeriods['${m}']=this.value;previewDraw('${m}')" value="${esc(period)}"`)}return html}

function withdrawTransferBatch(cat='特码'){const b=transferCategoryBatch(cat);if(!b||transferCopyBusy)return;
 if(!confirm('仅限尚未发给上家的批次。若已经发送，请取消并确认本批已收，避免重复转单。确定本批尚未发送？'))return;
 b.status='cancelled';b.cancelledAt=new Date().toISOString();save();eatNotice='本批已撤回，原订单可重新分配及复制';render();
}

function drawHistoryDate(d){const m=String(d.time||'').match(/(\d{4})[年/.-](\d{1,2})[月/.-](\d{1,2})/);if(m)return `${m[1]}年${+m[2]}月${+m[3]}日`;const date=d.createdAt?new Date(d.createdAt):null;return date&&!Number.isNaN(date.getTime())?`${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`:'日期未记录'}

function drawHistoryNumber(n,d){const z=d.zSnapshot||S.z,w=d.wSnapshot||S.w,c=d.cSnapshot||S.c,zodiac=Object.keys(z).find(k=>nums(z[k]).includes(+n))||'—',element=Object.keys(w).find(k=>nums(w[k]).includes(+n))||'—',wave=Object.keys(c).find(k=>nums(c[k]).includes(+n))||colorOf(n),waveClass={红:'red',蓝:'blue',绿:'green'}[wave]||'blue',elementClass={火:'fire',水:'water',金:'metal',木:'wood',土:'earth'}[element]||'';
 return `<div class="draw-history-number"><span class="draw-lotto-ball wave-${waveClass}"><span class="draw-lotto-core">${fmt(n)}</span></span><div class="draw-number-meta">${esc(zodiac)}/<span class="draw-element-${elementClass}">${esc(element)}</span></div></div>`;
}

// Show each market's most recently saved draw independently from the current issue.
function lastMarketDraw(m){
 const d=S.draws.filter(x=>x.market===m).at(-1);
 if(!d)return `<div class="last-market-draw is-empty"><span class="muted">暂无上期记录</span></div>`;

function eatPending(o){return allocationParts(o).some(x=>x===null)}

function allocationParts(o){if(Array.isArray(o.groupSelf)&&o.groupSelf.length===o.groups.length)return o.groupSelf;return o.groups.map((g,i)=>o.self===null?null:+((+o.stakes[i]||0)*o.self/(o.stake||1)).toFixed(2))}

function allocationSelf(o){return sum(allocationParts(o),x=>x||0)}

function groupSelfValue(o,i){let a=allocationParts(o);return a[i]===null?0:(+a[i]||0)}

function selfProfit(o){if(o.self===null)return 0;let pay=0,draw=S.draws.find(d=>d.market===o.market&&d.period===o.period);if(draw){o.groups.forEach((g,i)=>{if(checkWin(o,g,draw.numbers)){let rate=getOdds(o,g,draw);if(rate!==null&&rate!==undefined&&rate!=='')pay+=groupSelfValue(o,i)*(+rate)}})}else if(!Array.isArray(o.groupSelf)){pay=o.payout*o.self/(o.stake||1)}return o.self-pay}

function eatCategory(o){const c=moduleConfig(o);if(c?.object==='zodiac')return '平肖／连肖';if(c?.object==='tail')return '尾数／连尾';const t=playRuleType(o);return t==='特'?'特码':(/肖中|连肖|平肖|一肖/.test(t)?'平肖／连肖':(/平尾|连尾|特尾/.test(t)?'尾数／连尾':'其他玩法'))}

function updateAllocation(o,values){if(transferOrderLocked(o)){if(JSON.stringify(values)!==JSON.stringify(allocationParts(o))){eatFeedback('该订单已复制或上家已收，分配已锁定');return false}return true}if(!Array.isArray(values)||values.length!==o.groups.length)return false;let cents=values.map(v=>v===null?null:Math.round(Number(v)*100));if(cents.some((v,i)=>v!==null&&(!Number.isFinite(v)||v<0||v>Math.round((+o.stakes[i]||0)*100))))return false;o.groupSelf=cents.map(v=>v===null?null:v/100);if(cents.every(v=>v===null)){o.self=null;o.transferred=0}else{o.self=+(cents.reduce((a,v)=>a+(v||0),0)/100).toFixed(2);o.transferred=+(cents.reduce((a,v,i)=>a+(v===null?0:Math.round((+o.stakes[i]||0)*100)-v),0)/100).toFixed(2)}o.received=false;return true}

function eatUsed(){let used={},total=0;active().filter(o=>playRuleType(o)==='特').forEach(o=>{let parts=allocationParts(o);o.groups.forEach((g,i)=>{let v=parts[i]||0;if(v>0&&g.length===1){let n=fmt(g[0]);used[n]=(used[n]||0)+v;total+=v}})});return {used,total}}

function eatNumberStakes(){
 const totals=Object.create(null);
 scopedActive(S.selectedMarket,eatViewingPeriod()).filter(o=>playRuleType(o)==='特').forEach(o=>{
  (o.groups||[]).forEach((g,i)=>{
   if(!Array.isArray(g)||g.length!==1)return;
   const n=Number(g[0]);if(!Number.isInteger(n)||n<1||n>49)return;
   const key=fmt(n),amount=Number((o.stakes||[])[i]);
   if(Number.isFinite(amount)&&amount>0)totals[key]=(totals[key]||0)+amount;
  });
 });
 return totals;
}

function eatPageLayout(){let a=active(),selfTotal=sum(a,allocationSelf),trans=sum(a,o=>sum(allocationParts(o).map((x,i)=>x===null?0:Math.max(0,(+o.stakes[i]||0)-x)),x=>x));const cats=['特码','平肖／连肖','尾数／连尾','其他玩法'];return `<section class="panel eat-clean-panel eat-workspace">${currentScopePicker()}${eatArchivedReceipt()}<div class="row"><label>复制模式 <select onchange="transferCopyMode=this.value"><option value="customer" ${transferCopyMode==='customer'?'selected':''}>按客户复制</option><option value="merged" ${transferCopyMode==='merged'?'selected':''}>合并复制</option></select></label></div><div class="row"><label>自留比例 <input id="eatRatio" type="number" min="0" max="100" value="0" class="num"> %</label><button onclick="allocateRatio()">按比例分配</button></div>${eatPicker()}<div class="row">${metric('总收注',sum(a,o=>o.stake))}${metric('自留金额',selfTotal)}${metric('转出金额',trans)}</div><div class="row eat-main-actions"><button onclick="allocateAll('self')">全部自留</button><button onclick="allocateAll('transfer')">全部转出</button><button onclick="copyAllTransfers()">复制全部转单（核对）</button></div><p id="eatNotice" class="muted" role="status">${esc(eatNotice)}</p>${cats.map(cat=>{let os=a.filter(o=>eatCategory(o)===cat),pending=os.filter(o=>eatPending(o)).length;return `<details class="eat-category" data-eat-key="cat:${cat}"><summary>${cat} · ${os.length}单 · ¥${money(sum(os,o=>o.stake))}${pending?' · 待分配'+pending+'单':''}</summary><div class="row" style="padding:10px 12px;gap:8px"><button class="primary compact" onclick="copyTransfers('${cat}')" ${transferCopyBusy?'disabled':''}>复制待转单</button><button class="compact" onclick="confirmReceived('${cat}')" ${transferCategoryBatch(cat)?'':'disabled'}>确认本批已收</button><button class="compact" onclick="allocateCategory('${cat}','self')" ${os.some(o=>!transferOrderLocked(o))?'':'disabled'}>全部自留</button><button class="compact" onclick="allocateCategory('${cat}','transfer')" ${os.some(o=>!transferOrderLocked(o))?'':'disabled'}>全部转出</button><button class="compact" onclick="transferPendingCategory('${cat}')" ${pending?'':'disabled'}>待分配转出</button><button class="compact" onclick="undoCategoryTransfer('${cat}')">一键回撤</button></div>${transferBatchPanel(cat)}${os.length?Object.entries(groupBySafe([...os].sort((x,y)=>(x.self!==null)-(y.self!==null)),o=>o.customer)).map(([customer,orders])=>`<details class="eat-customer" data-eat-key="customer:${cat}:${esc(customer)}"><summary>${esc(customer)} · ${orders.length}单 · ¥${money(sum(orders,o=>o.stake))}</summary>${orders.map(o=>{let parts=allocationParts(o),locked=transferOrderLocked(o);return `<details class="eat-order" data-eat-key="order:${o.id}"><summary>${esc(o.market)}/${esc(o.period)} · ${esc(o.type)} · ${esc(o.raw).slice(0,55)} · 下注¥${money(o.stake)} · 自留¥${money(o.self)} ${eatPending(o)?'（部分待分配）':''}</summary><div class="row"><button class="compact" ${locked?'disabled':''} onclick="setOrderAllocation('${o.id}','self')">本单全自留</button><button class="compact" ${locked?'disabled':''} onclick="setOrderAllocation('${o.id}','transfer')">本单全转出</button><button class="compact" ${locked?'disabled':''} onclick="setAllocation('${o.id}')">保存分配</button><button class="compact" ${locked?'disabled':''} onclick="resetAllocation('${o.id}')">撤回调整</button><span class="muted">上家：${o.received?'已收（已锁定）':transferOrderLocked(o)?'本批待确认（已锁定）':'未确认'}</span></div><div class="scroll"><table><thead><tr><th>组号</th><th>号码／组合</th><th>下注</th><th>自留（可填）</th><th>转出（自动）</th></tr></thead><tbody>${o.groups.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.join(' · '))}</td><td>¥${money(o.stakes[i])}</td><td><input class="num" type="number" min="0" max="${o.stakes[i]}" step="0.01" ${locked?'disabled':''} id="gs_${o.id}_${i}" value="${parts[i]===null?'':parts[i]}" placeholder="待分配" oninput="previewGroupTransfer('${o.id}',${i})"></td><td><input class="num" type="number" min="0" max="${o.stakes[i]}" step="0.01" ${locked?'disabled':''} id="tx_${o.id}_${i}" value="${parts[i]===null?'':money((+o.stakes[i]||0)-parts[i])}" placeholder="待分配" oninput="previewGroupSelf('${o.id}',${i})"></td></tr>`).join('')}</tbody></table></div></details>`}).join('')}</details>`).join(''):'<p class="muted">暂无该类订单</p>'}</details>`}).join('')}</section>`}

function transferPendingAll(){
 const orders=active().filter(o=>!transferOrderLocked(o)&&eatPending(o));
 if(!orders.length){alert('当前盘口和期号没有待分配订单');return}
 const total=sum(orders,o=>o.stake);
 
 orders.forEach(transferUnallocated);

}

function eatFeedback(message){eatNotice=message;const el=$('eatNotice');if(el)el.textContent=message}

function transferPendingCategory(cat){
 const orders=active().filter(o=>eatCategory(o)===cat && !transferOrderLocked(o) && eatPending(o));
 if(!orders.length){eatFeedback('【'+cat+'】暂无待分配订单');return}
 const snapshot=orders.map(eatAllocationSnapshot);
 const first=orders[0];
 S.eatUndoHistory.push({id:uid(),cat,market:first.market,period:first.period,items:snapshot,time:new Date().toISOString()});
 orders.forEach(o=>{transferUnallocated(o);o.eatManual=true});snapshot.forEach(x=>{x.afterSignature=transferOrderSignature(orders.find(o=>o.id===x.id))});
 save();eatNotice='【'+cat+'】已转出'+orders.length+'单，¥'+money(sum(orders,o=>o.stake))+'；可点击本分类一键回撤';render();
}

function eatAllocationSnapshot(o){return {id:o.id,groupSelf:Array.isArray(o.groupSelf)?[...o.groupSelf]:null,self:o.self,transferred:o.transferred||0,received:!!o.received,hasEatManual:Object.prototype.hasOwnProperty.call(o,'eatManual'),eatManual:!!o.eatManual}}

function undoCategoryTransfer(cat){
 const scope=eatScopeKey(),index=S.eatUndoHistory.findLastIndex(h=>h.cat===cat&&h.market+'|'+h.period===scope);
 if(index<0){eatFeedback('【'+cat+'】没有可回撤的批量分配记录');return}
 const h=S.eatUndoHistory[index],items=h.items.map(x=>({snapshot:x,order:S.orders.find(o=>o.id===x.id)}));
 if(items.some(x=>!x.order||transferOrderLocked(x.order))){eatFeedback('回撤未执行：部分订单已复制、上家已收或已不存在');return}
 if(items.some(({snapshot:x,order:o})=>x.afterSignature?transferOrderSignature(o)!==x.afterSignature:allocationParts(o).some((v,i)=>v!==(x.groupSelf&&x.groupSelf[i]!==null?x.groupSelf[i]:0)))){
  eatFeedback('回撤未执行：这批订单已有后续分配修改，请先核对，避免覆盖新调整');return
 }
 for(const {snapshot:x,order:o} of items){o.groupSelf=x.groupSelf===null?null:[...x.groupSelf];o.self=x.self;o.transferred=x.transferred;o.received=x.received;if('hasEatManual' in x){if(x.hasEatManual)o.eatManual=x.eatManual;else delete o.eatManual}}
 S.eatUndoHistory.splice(index,1);save();eatNotice='【'+cat+'】已回撤'+items.length+'单，恢复批量操作前的分配';render();
}

function confirmReceived(cat='特码'){return confirmTransferBatch(cat)}

function transferLine(o){
 let parts=allocationParts(o),rows=[];
 o.groups.forEach((g,i)=>{let amount=parts[i]===null?0:Math.round(((+o.stakes[i]||0)-parts[i])*100)/100;if(amount>0)rows.push({g,amount})});
 if(!rows.length)return [];
 // 同额的号码保持原单的“特：号码各金额”格式；不同金额拆行，不合并不同客户。
 let buckets=new Map();
 rows.forEach(x=>{let key=x.amount.toFixed(2);if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(x.g)});
 return [...buckets].map(([amount,groups])=>{
  let body=groups.map(g=>g.join('-')).join(' ');
  let prefix=o.type==='特'?'特：':o.type+'：';
  return prefix+body+'各'+(+amount)+'元'
 });
}

function eatReadLimits(){const key=eatScopeKey(),base=eatLimitDrafts[key]||eatCap();const read=(id,fallback)=>{const el=$(id);if(!el)return fallback;const raw=el.value.trim();return raw===''?null:Number(raw)};return {perNumber:read('eatPerNumber',base.perNumber),period:read('eatPeriodCap',base.period)}}

function eatValidLimits(c){return !!c&&[c.perNumber,c.period].every(n=>n===null||(Number.isFinite(n)&&n>=0))}

function eatPlanSelection(selected,cap,market=S.selectedMarket,period=eatViewingPeriod(market),preserveManual=true){
 const used=Object.create(null),orders=[],matches=[];let total=0;
 if(preserveManual)for(const o of scopedActive(market,period).filter(o=>playRuleType(o)==='特'&&(o.eatManual||transferOrderLocked(o)))){o.groups.forEach((g,i)=>{if(g.length===1){const n=fmt(g[0]),c=Math.round((allocationParts(o)[i]||0)*100);used[n]=(used[n]||0)+c;total+=c}})}
 for(const o of scopedActive(market,period).filter(o=>playRuleType(o)==='特')){
  if(preserveManual&&(o.eatManual||transferOrderLocked(o))){
   const values=allocationParts(o).slice();orders.push({order:o,values});
   o.groups.forEach((g,i)=>{if(g.length!==1)return;const n=fmt(g[0]),self=values[i],stake=+o.stakes[i]||0;if(selected.has(n)||(self||0)>0)matches.push({order:o,index:i,n,stake,self:self||0,transfer:self===null?null:Math.round((stake-self)*100)/100,manual:true,pending:self===null})});continue
  }
  const values=o.groups.map(()=>0);
  o.groups.forEach((g,i)=>{
   if(g.length!==1)return;const n=fmt(g[0]),stake=Math.max(0,Math.round((+o.stakes[i]||0)*100));
   if(!selected.has(n))return;
   const room=cap.perNumber===null?Infinity:Math.max(0,Math.round(cap.perNumber*100)-(used[n]||0));
   const left=cap.period===null?Infinity:Math.max(0,Math.round(cap.period*100)-total);
   const self=Math.min(stake,room,left);values[i]=self/100;used[n]=(used[n]||0)+self;total+=self;
   matches.push({order:o,index:i,n,stake:stake/100,self:self/100,transfer:(stake-self)/100});
  });
  orders.push({order:o,values});
 }
 return {orders,matches,total:total/100,used};
}

function eatCommitPlan(plan){let changed=0;for(const {order:o,values} of plan.orders){if(allocationParts(o).some((v,i)=>v!==values[i])){updateAllocation(o,values);changed++}}return changed}

function eatPicker(){
 const key=eatScopeKey(),cap=eatLimitDrafts[key]||eatCap(),stakes=eatNumberStakes(),rule=S.eatNumberRules[key],valid=eatValidLimits(cap),plan=eatPlanSelection(eatSelected,valid?cap:{perNumber:0,period:0}),dangerous=new Set(dangerousNumbers());
 return `<details class="eat-category" data-eat-key="picker"><summary>选号自留 · 已选${eatSelected.size}号${rule?' · 自动分单已开启':''}</summary><div class="row"><span>${S.selectedMarket==='澳门'?'新澳门':'香港'} / ${esc(eatViewingPeriod())}</span><label>每号自留上限 <input id="eatPerNumber" class="num" type="number" min="0" step=".01" value="${cap.perNumber??''}" placeholder="不限" oninput="eatLimitsChanged()"></label><label>本期自留上限 <input id="eatPeriodCap" class="num" type="number" min="0" step=".01" value="${cap.period??''}" placeholder="不限" oninput="eatLimitsChanged()"></label><button onclick="eatSaveCaps()">保存限额</button></div><div class="row">${Z.map(z=>`<button class="compact ${zNums(z).length&&zNums(z).every(n=>eatSelected.has(fmt(n)))?'eat-z-picked':''}" onclick="eatSelectZ('${z}')">${z}</button>`).join('')}</div><div class="eat-number-grid">${Array.from({length:49},(_,i)=>{const n=fmt(i+1),danger=dangerous.has(n),picked=eatSelected.has(n);return `<button class="compact ${picked?'eat-picked':''} ${danger?'eat-risk-number':''}" aria-label="${n}号 ${esc(zOf(n))}${danger?' 危险号码':''}${picked?' 已选':''}" aria-pressed="${picked}" onclick="eatSelectedToggle('${n}')"><span class="eat-number-label">${lottoBall(n)}<span class="eat-zodiac">${esc(zOf(n))}</span></span>${picked?'<span class="eat-pick-check">✓</span>':''}<small class="${danger?'eat-risk-stake':''}">下注 ¥${money(stakes[n]||0)}</small></button>`}).join('')}</div><div id="eatLinkedPreview">${eatLinkedPreview(plan)}</div><div class="row"><button class="primary" onclick="eatAutoSelect()">确认自留并自动分单</button><button onclick="eatClearSelected()">重选</button>${rule?'<button onclick="eatStopRule()">停止后续自动分单</button>':''}</div><p class="muted">${rule?'自留号：'+rule.numbers.join('、'):''}</p></details>`;
}

function eatLimitsChanged(){eatCaptureLimits();const cap=eatReadLimits(),el=$('eatLinkedPreview');if(el)el.innerHTML=eatValidLimits(cap)?eatLinkedPreview(eatPlanSelection(eatSelected,cap)):'<p class="warn">限额金额无效</p>'}

function eatStopRule(){delete S.eatNumberRules[eatScopeKey()];save();eatNotice='已停止后续自动分单，现有分配金额保留';render()}

function eatPageWithSelection(){if(eatUiScope!==eatScopeKey()){eatUiScope=eatScopeKey();eatSelected=new Set(S.eatNumberRules[eatUiScope]?.numbers||[])}let html=eatPageLayout();html=html.replace('默认待分配；选中号码可按限额自留，剩余金额手动确认转出。金额为当前盘口当期数据。','选中你要吃的号码，确认后自动从每位客户的特码订单中分出自留，剩余特码自动转出。');return html}

function setAllocation(id){const o=active().find(o=>o.id===id);if(!o)return;if(transferOrderLocked(o)){eatFeedback('该订单已复制或上家已收，分配已锁定');return}const values=o.groups.map((_,i)=>{const raw=$(`gs_${id}_${i}`).value.trim();return raw===''?null:Number(raw)});if(!updateAllocation(o,values))return alert('自留金额必须介于0和该组下注金额之间');auditMarkManual(o);save();render()}

function ownershipBasis(){return S.waterBasis==='transfer'?'transfer':'all'}

function ownershipBasisLabel(){return ownershipBasis()==='transfer'?'仅转出金额':'全部收注'}

function ownershipCents(n){return Math.max(0,Math.round((+n||0)*100))}

function ownershipParts(o,i){const stake=ownershipCents(o.stakes[i]);const v=allocationParts(o)[i];if(v===null||v===undefined)return {stake,self:0,transfer:0,pending:stake};const self=Math.min(stake,ownershipCents(v));return {stake,self,transfer:stake-self,pending:0}}

function ownershipData(m,p,customer=''){
 const orders=scopedActive(m,p).filter(o=>!customer||o.customer===customer),draw=S.draws.find(d=>d.market===m&&d.period===p),rows={self:[],transfer:[]};let pendingC=0;
 const totals={self:{stakeC:0,payC:0,won:0,unpriced:0},transfer:{stakeC:0,payC:0,won:0,unpriced:0}};
 for(const o of orders){let cumulative=0,paid=0;const fullMap=o.groups.map((g,i)=>{const rate=getOdds(o,g);if(!draw||!checkWin(o,g,draw.numbers)||rate===null||rate===undefined||rate===''||!Number.isFinite(+rate)||+rate<0)return 0;cumulative+=(+o.stakes[i]||0)*(+rate);const next=Math.round(cumulative*100),part=next-paid;paid=next;return part});o.groups.forEach((g,i)=>{
  const parts=ownershipParts(o,i);pendingC+=parts.pending;const win=!!draw&&checkWin(o,g,draw.numbers),rate=getOdds(o,g),priced=rate!==null&&rate!==undefined&&rate!==''&&Number.isFinite(+rate)&&+rate>=0;
  const fullPay=fullMap[i],selfPay=!win||!priced||!parts.self?0:parts.self===parts.stake?fullPay:Math.min(fullPay,Math.round(parts.self*(+rate)));
  for(const side of ['self','transfer']){const stakeC=parts[side];if(!stakeC)continue;const missing=win&&!priced,payC=side==='self'?selfPay:(parts.pending?0:fullPay-selfPay),t=totals[side];t.stakeC+=stakeC;t.payC+=payC;if(win)t.won++;if(missing)t.unpriced++;
   rows[side].push({order:o,index:i,group:g,stakeC,originalC:parts.stake,win,rate:priced?+rate:null,payC:!draw||missing?null:payC,status:!draw?'待开奖':missing?'赔率待设置':win?'中奖':'未中'});
  }
 });}
 const water=+sum(orders,ownershipOrderRebate).toFixed(2);
 for(const side of ['self','transfer']){const t=totals[side];t.stake=t.stakeC/100;t.payout=!draw||t.unpriced?null:t.payC/100;t.profit=!draw||t.unpriced?null:(t.stakeC-t.payC)/100}
 const ownKnown=!!draw&&!pendingC&&!totals.self.unpriced,ownNet=ownKnown?+(totals.self.profit+water).toFixed(2):null;
 return {market:m,period:p,orders,draw,rows,totals,pending:pendingC/100,water,ownNet,basis:ownershipBasis(),stage:!draw?'待开奖':pendingC?'待分配':totals.self.unpriced?'自留赔率待设置':'已结算'};
}

function ownershipMetric(label,value,status='待结算',signed=false,showPendingZero=false){const pending=value===null;const display=pending&&showPendingZero?'¥0.00':pending?esc(status):(signed&&value>0?'+':'')+'¥'+money(value);return `<div class="metric"${pending&&showPendingZero?' title="尚未结算，暂显示¥0.00"':''}><small>${esc(label)}</small><b class="${pending?'muted':signed?(value>0?'red':value<0?'green':'muted'):''}">${display}</b></div>`}

function ownershipGlobalMetric(a){const ready=a.every(o=>o.status==='已兑奖')&&!!S.draws.find(d=>d.market===reportMarket&&d.period===reportPeriod),missing=a.some(o=>o.unpriced>0);return ownershipMetric('全盘正负',!ready||missing?null:sum(a,o=>o.stake-o.payout),missing?'赔率待设置':'',true,!missing)}

function ownershipPanel(m,p,customer=''){const d=ownershipData(m,p,customer);return `<section class="panel ownership-panel"><h2>本期正负</h2><p class="muted">${esc(m==='澳门'?'新澳门':m)} / ${esc(p)}${customer?' · '+esc(customer):''}</p><div class="row">${ownershipMetric('自留收注',d.totals.self.stake)}${ownershipMetric('自留赔付',d.totals.self.payout,d.draw?'赔率待设置':'',false,!d.draw)}${ownershipMetric('自留正负',d.totals.self.profit,d.draw?'赔率待设置':'',true,!d.draw)}${ownershipMetric('返点',d.water)}${ownershipMetric('本期正负',d.ownNet,d.draw?d.stage:'',true,!d.draw)}</div>${d.pending?`<p class="warn">待分配：¥${money(d.pending)}</p>`:''}</section>`}

function ownershipDefaultPeriod(m){const ds=S.draws.filter(d=>d.market===m).map(d=>d.period).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));return ds[0]||S.periods[m]}

function ownershipScope(){if(!ownershipDetailScope.market||ownershipDetailScope.source!==S.selectedMarket){ownershipDetailScope={market:S.selectedMarket,period:ownershipDefaultPeriod(S.selectedMarket),source:S.selectedMarket};ownershipCustomer='';ownershipDetailManual=false}if(!ownershipDetailManual)ownershipDetailScope.period=ownershipDefaultPeriod(ownershipDetailScope.market);const ps=periodChoices(ownershipDetailScope.market);if(!ps.includes(ownershipDetailScope.period))ownershipDetailScope.period=ownershipDefaultPeriod(ownershipDetailScope.market);return ownershipDetailScope}

function ownershipSetScope(m,p){const old=ownershipScope();ownershipDetailManual=true;ownershipDetailScope={market:m||old.market,period:p||ownershipDefaultPeriod(m||old.market),source:S.selectedMarket};ownershipCustomer='';render()}

function ownershipScopePicker(){const s=ownershipScope(),customers=[...new Set(scopedActive(s.market,s.period).map(o=>o.customer))];if(ownershipCustomer&&!customers.includes(ownershipCustomer))ownershipCustomer='';return `<div class="row"><label>明细盘口 <select onchange="ownershipSetScope(this.value,null)">${['澳门','香港'].map(m=>`<option value="${m}" ${s.market===m?'selected':''}>${m==='澳门'?'新澳门':'香港'}</option>`).join('')}</select></label><label>明细期号 <select onchange="ownershipSetScope(null,this.value)">${periodChoices(s.market).map(p=>`<option value="${esc(p)}" ${p===s.period?'selected':''}>${esc(p)}</option>`).join('')}</select></label><label>明细客户 <select onchange="ownershipCustomer=this.value;render()"><option value="">全部客户</option>${customers.map(c=>`<option value="${esc(c)}" ${c===ownershipCustomer?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>显示 <select onchange="ownershipView=this.value;render()"><option value="win" ${ownershipView==='win'?'selected':''}>仅中奖明细</option><option value="all" ${ownershipView==='all'?'selected':''}>全部投注明细</option></select></label></div>`}

function ownershipSideRows(d,side){return d.rows[side].filter(r=>!d.draw||ownershipView!=='win'||r.win)}

function ownershipSideTable(d,side){const rs=ownershipSideRows(d,side),groups=Object.entries(groupBySafe(rs,r=>r.order.customer));return groups.map(([c,rows])=>`<details open class="ownership-customer"><summary>${esc(c)} · ${rows.length}组</summary><div class="scroll"><table><thead><tr><th>客户原单 / 时间</th><th>玩法</th><th>号码 / 组合</th><th>原组下注</th><th>${side==='self'?'自留':'转出'}下注</th><th>状态</th><th>赔率</th><th>${side==='self'?'我承担赔付':'上家承担赔付'}</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="wrap-cell">${esc(r.order.raw)}<br><small>${esc(r.order.time||'')}</small></td><td>${esc(r.order.type)}</td><td>${playRuleType(r.order)==='特'?r.group.map(ball).join(''):esc(r.group.join(' · '))}</td><td>¥${money(r.originalC/100)}</td><td>¥${money(r.stakeC/100)}</td><td class="${r.win?'green':'muted'}">${r.status}</td><td>${r.rate===null?'待设置':'1:'+r.rate}</td><td>${r.payC===null?(d.draw?'待计算':'待开奖'):'¥'+money(r.payC/100)}</td></tr>`).join('')}</tbody></table></div></details>`).join('')||`<p class="muted">${d.draw&&ownershipView==='win'?'该范围没有中奖记录':'该范围暂无'+(side==='self'?'自留':'转出')+'记录'}</p>`}

function ownershipSideSection(d,side){const t=d.totals[side],label=side==='self'?'自留正负':'转出正负';return `<section class="panel ownership-side"><h3>${label}</h3><div class="row">${ownershipMetric(side==='self'?'自留收注':'转出收注',t.stake)}${auditCountMetric('中奖组数',t.won)}${ownershipMetric(side==='self'?'自留中奖赔付':'上家中奖赔付',t.payout,d.draw?'赔率待设置':'待开奖')}${ownershipMetric(side==='self'?'自留正负':'上家正负',t.profit,d.draw?'赔率待设置':'待开奖',true)}</div><div class="row"><button onclick="ownershipCopy('${side}')">复制${side==='self'?'自留':'转出'}当前明细</button></div>${side==='transfer'?'':''}${ownershipSideTable(d,side)}</section>`}

function ownershipDetails(){const picker=ownershipScopePicker(),s=ownershipScope(),d=ownershipData(s.market,s.period,ownershipCustomer);return `<section class="panel ownership-details"><h2>自留 / 转出兑奖明细</h2>${picker}${d.pending?`<p class="warn">待分配：¥${money(d.pending)}</p>`:''}${ownershipSideSection(d,'self')}${ownershipSideSection(d,'transfer')}${ownershipPanel(s.market,s.period,ownershipCustomer)}</section>`}

function ownershipCopy(side){const s=ownershipScope(),d=ownershipData(s.market,s.period,ownershipCustomer),t=d.totals[side],label=side==='self'?'自留':'转出',rows=ownershipSideRows(d,side),lines=[`${s.market}/${s.period} ${label}${d.draw?'兑奖':'投注'}明细`,ownershipView==='win'&&d.draw?'仅中奖组':'全部投注组'];for(const r of rows)lines.push(`客户：${r.order.customer}｜${r.order.type} ${r.group.join('·')}｜${label}¥${money(r.stakeC/100)} × ${r.rate===null?'赔率待设置':r.rate} = ${r.payC===null?(d.draw?'待计算':'待开奖'):'¥'+money(r.payC/100)}｜${r.status}`);if(!rows.length)lines.push('当前范围暂无记录');lines.push(`${label}总下注：¥${money(t.stake)}`,`${label}总赔付：${t.payout===null?'待结算':'¥'+money(t.payout)}`,`${label}正负（不含返点）：${t.profit===null?'待结算':'¥'+money(t.profit)}`);if(d.pending)lines.push(`未分配下注：¥${money(d.pending)}，上述为已分配部分`);copyText(lines.join('\n'))}

function eatPage(){return eatPageWithSelection()+ownershipDetails()}

function ownershipSetBasis(v){if(!['all','transfer'].includes(v))return;S.waterBasis=v;save();render()}

function transferBatchList(){return Array.isArray(S.transferBatches)?S.transferBatches:[]}

function transferPendingBatch(m=S.selectedMarket,p=eatViewingPeriod(m),cat='特码'){return transferBatchList().find(b=>b.market===m&&b.period===p&&(b.category||'特码')===cat&&b.status==='pending')}

function transferCategoryBatch(cat='特码'){return transferPendingBatch(S.selectedMarket,eatViewingPeriod(),cat)}

function transferCandidates(cat='特码'){return active().filter(o=>eatCategory(o)===cat).filter(o=>!o.received&&!transferOrderPending(o)&&!eatPending(o)&&transferLine(o).length)}

function transferUnknownLegacy(cat='特码'){return active().filter(o=>eatCategory(o)===cat).filter(o=>o.transferLegacy&&!o.received&&transferLine(o).length)}

function transferBatchSnapshot(orders,cat='特码'){const m=S.selectedMarket,p=eatViewingPeriod(m),seq=transferBatchList().filter(b=>b.market===m&&b.period===p&&(b.category||'特码')===cat).reduce((n,b)=>Math.max(n,+b.seq||0),0)+1;
 return {id:uid(),market:m,period:p,category:cat,seq,status:'pending',createdAt:new Date().toISOString(),text:transferText(orders),amount:+sum(orders,o=>o.transferred).toFixed(2),items:orders.map(o=>({id:String(o.id),signature:transferOrderSignature(o),parts:allocationParts(o).slice(),customer:o.customer,amount:+o.transferred||0}))};
}

function transferBatchValid(b){return b.items.length>0&&b.items.every(i=>{const o=S.orders.find(o=>String(o.id)===i.id);return o&&!o.received&&o.status!=='已撤单'&&transferOrderSignature(o)===i.signature})}

async function transferClipboard(text){try{await navigator.clipboard.writeText(text);return true}catch{const v=prompt('自动复制失败，请手动复制以下内容；复制完成后点确定，未复制请取消',text);return v!==null}}

async function copyPendingTransfers(cat='特码'){
 if(!['特码','平肖／连肖','尾数／连尾','其他玩法'].includes(cat))return false;
 if(transferCopyBusy)return false;
 const existing=transferCategoryBatch(cat);
 if(existing){eatFeedback('第'+existing.seq+'批已复制待确认；请先确认上家已收，尚未发送可撤回本批。新订单会留到下一批');return false}
 if(transferUnknownLegacy(cat).length){eatFeedback('请先在「旧版转单核对」中标记旧单是否已发送，避免重复');return false}
 const orders=transferCandidates(cat);if(!orders.length){eatFeedback('【'+cat+'】暂无待转订单；已收订单不会重复复制，部分待分配订单需先保存完整分配');return false}
 const b=transferBatchSnapshot(orders,cat);b.amount=+sum(b.items,i=>i.amount).toFixed(2);
 // Save a lock before awaiting the clipboard so new UI actions cannot mutate this batch.
 S.transferBatches=[...transferBatchList(),b];transferCopyBusy=true;if(!save()){S.transferBatches=S.transferBatches.filter(x=>x.id!==b.id);transferCopyBusy=false;eatFeedback('本批保存失败，未复制，请先导出备份并检查浏览器存储');return false}render();
 let ok=false;try{ok=await transferClipboard(b.text)}finally{transferCopyBusy=false;if(!ok){b.status='cancelled';b.cancelledAt=new Date().toISOString()}save();eatNotice=ok?'【'+cat+'】第'+b.seq+'批已复制：'+b.items.length+'单，¥'+money(b.amount)+'。发给上家后点击「确认本批已收」':'本批未复制，订单仍可重新复制';render()}
 return ok;
}

function confirmTransferBatch(cat='特码'){const b=transferCategoryBatch(cat);if(!b){eatFeedback('没有已复制待确认的批次，请先复制待转单');return false}
 if(transferCopyBusy){eatFeedback('正在复制，请稍后确认');return false}
 if(!transferBatchValid(b)){eatFeedback('本批订单与复制时不一致，未确认任何订单，请核对本批记录');return false}
 const before=b.items.map(i=>{const o=S.orders.find(o=>String(o.id)===i.id);return {o,received:o.received,receivedBatchId:o.receivedBatchId,transferLegacy:o.transferLegacy}});
 for(const i of b.items){const o=S.orders.find(o=>String(o.id)===i.id);o.received=true;o.receivedBatchId=b.id;delete o.transferLegacy}
 b.status='confirmed';b.confirmedAt=new Date().toISOString();if(!save()){for(const x of before){x.o.received=x.received;x.o.receivedBatchId=x.receivedBatchId;x.o.transferLegacy=x.transferLegacy}b.status='pending';delete b.confirmedAt;eatNotice='确认未保存，请检查存储后重新确认本批，勿重复发送';render();return false}eatNotice='【'+cat+'】第'+b.seq+'批已确认上家收到：'+b.items.length+'单，¥'+money(b.amount)+'；后续新订单仍待转出';render();return true;
}

function resolveLegacyTransfer(id,sent){const o=active().find(o=>String(o.id)===id);if(!o||!o.transferLegacy||transferOrderLocked(o))return;
 if(sent&&eatPending(o)){eatFeedback('旧单仍有待分配金额，请先核对完整分配');return}
 delete o.transferLegacy;if(sent){o.received=true;o.receivedBatchId='legacy'}save();eatNotice=sent?'旧单已标记上家收到，不会再次复制':'旧单已标记尚未发送，会进入待转单';render();
}

async function recopyPendingBatch(cat='特码'){const b=transferCategoryBatch(cat);if(!b||transferCopyBusy)return;transferCopyBusy=true;try{if(await transferClipboard(b.text))eatFeedback('已重复制第'+b.seq+'批原文，不是新增订单；已发送请勿重复发送')}finally{transferCopyBusy=false}}

async function copyAllTransfers(){const orders=active().filter(o=>!eatPending(o)&&transferLine(o).length);if(!orders.length){eatFeedback('暂无完整分配的转单');return}await transferClipboard('【全部转单核对，非新增转单，请勿重复下注】\n'+transferText(orders));eatFeedback('已复制全部核对明细；发送新增订单请使用「复制待转单」')}

function transferBatchPanel(cat='特码'){const b=transferCategoryBatch(cat),unknown=transferUnknownLegacy(cat),history=transferBatchList().filter(b=>b.market===S.selectedMarket&&b.period===eatViewingPeriod()&&(b.category||'特码')===cat),arg=id=>encodeURIComponent(String(id)).replace(/'/g,'%27');
 return `${unknown.length?`<details class="transfer-legacy"><summary>旧版转单核对 · ${unknown.length}单</summary><p class="muted">旧版无法判断这些订单是否已发给上家，请核对后标记。</p>${unknown.map(o=>`<div class="row"><span>${esc(o.customer)} · ${esc(o.raw)} · 转出¥${money(o.transferred)}</span><button onclick="resolveLegacyTransfer(decodeURIComponent('${arg(o.id)}'),true)">已发上家</button><button onclick="resolveLegacyTransfer(decodeURIComponent('${arg(o.id)}'),false)">尚未发送</button></div>`).join('')}</details>`:''}${b?`<section class="panel transfer-batch"><b>第${b.seq}批 · 已复制待确认</b><p>${b.items.length}单 · ¥${money(b.amount)} · 本批只包含复制时的订单</p><div class="row"><button onclick="recopyPendingBatch('${cat}')">重复制本批</button><button onclick="withdrawTransferBatch('${cat}')">撤回本批（未发送）</button></div></section>`:''}${history.length?`<details class="transfer-history"><summary>转单批次记录 · ${history.length}批</summary>${history.slice().reverse().map(x=>`<details><summary>第${x.seq}批 · ${x.items.length}单 · ¥${money(x.amount)} · ${x.status==='confirmed'?'上家已收':x.status==='cancelled'?'已撤回':'待确认'}</summary><small>${esc(x.createdAt)}</small>${x.items.some(i=>i.bookkeepingCustomer&&i.bookkeepingCustomer!==i.customer)?`<p class="muted">客户归属已调整：${x.items.filter(i=>i.bookkeepingCustomer&&i.bookkeepingCustomer!==i.customer).map(i=>esc(i.customer)+' → '+esc(i.bookkeepingCustomer)).join('；')}。下方保留原转单内容。</p>`:''}<pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.text)}</pre></details>`).join('')}</details>`:''}`;
}

function ledgerMakeItem(o){const lines=o.groups.map((g,i)=>{const p=ownershipParts(o,i);return [g.slice(),p.stake,p.pending?null:p.self,getOdds(o,g)??null]});return {id:String(o.id),void:o.status==='已撤单',stake:+o.stake||0,rebateRaw:ownershipOrderRebate(o),basis:ownershipBasis(),lines,...(moduleConfig(o)?{numberConfig:structuredClone(moduleConfig(o))}:{}),...(playRuleType(o)==='三中二'?{tierRates:{two:o.moduleSnapshot?o.moduleSnapshot.rate:S.odds[o.type]??null,three:o.moduleSnapshot?o.moduleSnapshot.fullRate:S.odds[o.type+'全中']??null}}:{}),play:o.type,ruleType:playRuleType(o),market:o.market,period:o.period,rate:playRuleType(o)==='特'?(S.odds.特??null):0}}

function ledgerItemProfit(item,draw){if(!draw)return null;const lines=item.lines||[];if(lines.some(l=>l[2]===null))return null;let fullRunning=0,fullPaid=0,selfStake=0,selfPaid=0;for(const line of lines){const [n,stake,self]=line,rate=item.numberConfig?moduleRate(item.numberConfig,n,draw.numbers,{market:item.market,period:item.period},draw):item.ruleType==='三中二'&&item.tierRates?item.tierRates[threeTwoHits(n,draw.numbers)===3?'three':'two']:item.play?line[3]:item.rate;selfStake+=self;const win=item.numberConfig?moduleWins(n,draw.numbers,item.numberConfig,{market:item.market,period:item.period},draw):item.play?checkWin({type:item.play,ruleType:item.ruleType,...(item.numberConfig?{moduleSnapshot:{rule:'号码命中规则',config:item.numberConfig}}:{}),market:item.market,period:item.period},n,draw.numbers):+n===draw.numbers[6];if(!win)continue;if(rate===null||rate===undefined||!Number.isFinite(+rate)){if(self>0)return null;continue}fullRunning+=stake*(+rate);const next=Math.round(fullRunning),fullPay=next-fullPaid;fullPaid=next;selfPaid+=!self?0:self===stake?fullPay:Math.min(fullPay,Math.round(self*(+rate)))}return (selfStake-selfPaid)/100}

function ledgerRebuildReceipt(rec){if(!rec.items)return;const draw=S.draws.find(d=>d.market===rec.market&&d.period===rec.period),items=Object.values(rec.items).filter(x=>!x.void),profits=items.map(x=>ledgerItemProfit(x,draw));rec.stake=+sum(items,x=>x.stake).toFixed(2);rec.rebate=+sum(items,x=>x.rebateRaw).toFixed(2);rec.pending=+sum(items,x=>sum((x.lines||[]).filter(l=>l[2]===null),l=>l[1])/100).toFixed(2);rec.self=!draw||profits.some(p=>p===null)?null:+sum(profits,x=>x).toFixed(2);rec.status=!draw?'待开奖':rec.pending?'待分配':rec.self===null?'赔率待设置':'已结算';rec.orderCount=items.length;const bases=[...new Set(items.map(x=>x.basis||'all'))];rec.rebateBasis=bases.length===1?bases[0]:bases.length?'mixed':ownershipBasis();rec.autoSaved=true}

function ledgerAutoSnapshot(){if(ledgerAutoBusy)return false;ledgerAutoBusy=true;try{
 S.ledger=Array.isArray(S.ledger)?S.ledger:[];S.ledgerTrash=S.ledgerTrash&&typeof S.ledgerTrash==='object'&&!Array.isArray(S.ledgerTrash)?S.ledgerTrash:{};
 const before=JSON.stringify(S.ledger),scopes=groupBySafe(S.orders,o=>ledgerKey(o.market,o.period));
 for(const [key,orders] of Object.entries(scopes)){
  if(S.ledgerTrash[key])continue;let rec=S.ledger.find(r=>ledgerKey(r.market,r.period)===key);const m=orders[0].market,p=orders[0].period,draw=S.draws.find(d=>d.market===m&&d.period===p);
  if(!rec){rec={market:m,period:p,date:ledgerReceiptDate(draw),items:Object.create(null)};S.ledger.push(rec)}
  const incoming=Object.fromEntries(orders.map(o=>[String(o.id),ledgerMakeItem(o)]));
  if(!rec.items){
   // Attach legacy saved totals only when the complete live period still matches.
   const candidate={market:m,period:p,items:incoming};ledgerRebuildReceipt(candidate);
   const same=Math.abs((+rec.stake||0)-candidate.stake)<0.005&&Math.abs((+rec.rebate||0)-candidate.rebate)<0.005&&rec.self!==null&&candidate.self!==null&&Math.abs((+rec.self||0)-candidate.self)<0.005;
   if(!same)continue;rec.items=Object.create(null);
  }
  Object.assign(rec.items,incoming);
 }
 for(const rec of S.ledger)ledgerRebuildReceipt(rec);

 }finally{ledgerAutoBusy=false}}

function manualPlayNames(){return Object.keys(S.customPlays||{}).filter(n=>!S.customPlays[n].deleted)}

function groupBySafe(items,keyFn){const result=Object.create(null);for(const item of items){const key=String(keyFn(item));(result[key]||(result[key]=[])).push(item)}return result}

function allocateCategory(cat,mode){
 if(!['特码','平肖／连肖','尾数／连尾','其他玩法'].includes(cat)||!['self','transfer'].includes(mode))return;
 const all=active().filter(o=>eatCategory(o)===cat),orders=all.filter(o=>!transferOrderLocked(o)),skipped=all.length-orders.length;
 if(!orders.length){eatFeedback('【'+cat+'】'+(all.length?'订单均已锁定，未修改':'暂无订单'));return}
 const items=orders.map(eatAllocationSnapshot),first=orders[0];
 for(const o of orders){updateAllocation(o,o.stakes.map(n=>mode==='self'?n:0));o.eatManual=true}
 items.forEach(x=>{x.afterSignature=transferOrderSignature(orders.find(o=>o.id===x.id))});
 S.eatUndoHistory.push({id:uid(),cat,market:first.market,period:first.period,items,time:new Date().toISOString(),mode});
 save();eatNotice='【'+cat+'】'+orders.length+'单已全部'+(mode==='self'?'自留':'转出')+(skipped?'；跳过'+skipped+'笔已锁定订单':'')+'，可一键回撤';render();
}

function addCombinationTableRow(){const used=new Set([...document.querySelectorAll('#combinationTableBody [data-combo-quantity]')].map(el=>Number(el.value))),after=Math.max(0,...used)+1,n=after<=49?after:Array.from({length:49},(_,i)=>i+1).find(n=>!used.has(n));if(!n){$('combinationTableMessage').textContent='最多可填写49行';return}const body=$('combinationTableBody');body.insertAdjacentHTML('beforeend',combinationTableRow({quantity:n,counts:[null,null,null,null]}));body.lastElementChild.querySelector('input')?.focus();$('combinationTableMessage').textContent='已新增一行，请填写后保存'}

function expandMultilineNumberGroups(input){
 const lines=String(input).replace(/\r/g,'').split('\n'),out=[];
 const end=new RegExp('各(?:组)?\\s*('+amountPattern+')\\s*(?:元|块|钱)?\\s*$');
 for(let i=0;i<lines.length;i++){
  const first=lines[i].trim(),hit=findType(first);
  const spec=S.customPlays?.[hit?.type],rule=spec?.rule||hit?.type,expected=rule==='号码命中规则'?(spec.config.object&&spec.config.object!=='number'?0:spec.config.size):rule==='二中二'?2:['三中三','三中二'].includes(rule)?3:0;
  if(!hit||!expected||hit.raw.startsWith('复式')){out.push(lines[i]);continue}
  const rows=[];let j=i,amount=null,valid=true;
  for(;j<lines.length;j++){
   let row=(j===i?first.slice(hit.length):lines[j]).trim().replace(/^[:：]\s*/,'');
   if(!row)continue;
   const am=row.match(end);if(am){amount=am[1];row=row.slice(0,am.index).trim()}
   if(!/^[\d\s.,，、。;；\-]+$/.test(row)){valid=false;break}
   const nums=row.match(/\d+/g)||[],k=expected;
   if(nums.length!==k){valid=false;break}
   rows.push(row);if(am)break;
  }
  if(valid&&amount!==null&&rows.length>1){out.push(...rows.map(r=>hit.type+' '+r+' 各组'+amount));i=j}
  else out.push(lines[i]);
 }
 return out.join('\n');
}

function splitChunks(input){
 let text=expandMultilineNumberGroups(String(input)).replace(/#订单\d+\s*/g,'').replace(/各(?:号|数)\s*[,，、]?\s*各/g,'各号');
 text=text.replace(/平\s*([0-9][0-9\s.,，、\-]*)\s*尾/g,(_,ds)=>'平尾 '+(ds.match(/\d/g)||[]).join(' ')+' ');
 text=text.replace(/([鼠牛虎兔龙蛇马羊猴鸡狗猪]+)特(?=各|\d|\s|\/)/g,'特$1 ');
 text=text.replace(/(^|[\s;；])([0-9]{1,2})\s*特(?=各|\d|\s|\/)/g,'$1特$2 ');
 // Split at every play anchor before expanding repeated grouped bets.
 const amountEnd=new RegExp('((?:各(?:号|数|组|肖)?|/|总额)\\s*'+amountPattern+'(?![\\d.])\\s*(?:元|块|钱)?)[ \\t,，、。;；\\n]+(?=(?:[鼠牛虎兔龙蛇马羊猴鸡狗猪]|\\d{1,2}(?:[,，.、\\s-]|\\/|各)))','g');
 if(S.customPlays.特&&!S.customPlays.特.deleted&&S.customPlays.特.config?.size===1&&S.customPlays.特.config.scope==='special')text=text.replace(amountEnd,'$1 特 ');
 text=normalize(text).replace(/[;；\n]+/g,' ');
 const chunks=[];let cur='',type='';
 for(let i=0;i<text.length;){let hit=findType(text.slice(i));if(hit&&hit.raw==='尾'&&/\d\s*$/.test(cur)){cur+=text[i++];continue}
 if(hit){if(cur.trim())chunks.push({type,raw:cur.trim()});type=hit.type;cur=hit.raw;i+=hit.length}else cur+=text[i++];}
 if(cur.trim())chunks.push({type,raw:cur.trim()});return chunks.flatMap(auditExpandPlayChunk);
}

/* Separate explicitly written betting groups for user-configured modules.
 * Repeat selections across DIFFERENT groups are valid; validation inside each
 * group remains strict. Do not reinterpret explicitly 复式 wagers. */
function splitConfiguredBets(chunk){
 const spec=S.customPlays?.[chunk.type];
 if(!spec||spec.deleted||spec.rule!=='号码命中规则')return null;
 const c=spec.config||{},size=c.size,object=c.object||'number';
 if(!Number.isInteger(size)||size<1||!['zodiac','tail','number'].includes(object))return null;
 // Single-number special orders already preserve individual stakes inside one order.
 if(size===1&&object==='number'&&c.scope==='special'&&(c.match||'hits')==='hits')return null;
 const h=findType(chunk.raw);
 if(!h||h.raw.startsWith('复式'))return null;
 const body=chunk.raw.slice(h.length).trim();
 const am=body.match(new RegExp('(各(?:组|肖|号|数)?|总额|/)?\\s*('+amountPattern+')\\s*(?:元|块|钱)?\\s*$'));
 if(!am)return null;
 const prefix=am[1]||'',amount=am[2],raw=body.slice(0,am.index).trim();
 // There must be recognizable group separators and each candidate group must
 // contain precisely the configured number of unique values.
 let candidates=raw.split(/[\s,，、;；/]+/).filter(Boolean);
 const decode=word=>object==='zodiac'?[...word].filter(x=>Z.includes(x)):
   object==='tail'?(word.match(/\d/g)||[]):(word.match(/\d{1,2}/g)||[]);
 const candidateOK=word=>{
  const values=decode(word);
  if(values.length!==size||new Set(values.map(v=>object==='number'?+v:v)).size!==size)return false;
  if(object==='zodiac')return [...word].every(x=>Z.includes(x));
  if(object==='tail')return /^[0-9.\-]+$/.test(word)&&values.every(v=>+v<=9);
  return /^[0-9.\-]+$/.test(word)&&values.every(v=>+v>=1&&+v<=49);
 };
 if(candidates.length<2||!candidates.every(candidateOK))return null;
 // 「各」 applies the amount to EACH group; otherwise allocate the stated
 // TOTAL across explicit groups in cents, with rounding remainder on last.
 if(prefix.startsWith('各'))return candidates.map(word=>({type:chunk.type,raw:h.raw+' '+word+' '+prefix+amount}));
 const v=amountValue(amount);if(!(v>0)||!Number.isFinite(v)||Math.abs(v*100-Math.round(v*100))>1e-7)return null;
 const total=Math.round(v*100),each=Math.floor(total/candidates.length);
 return candidates.map((word,i)=>({type:chunk.type,raw:h.raw+' '+word+' 总额'+((each+(i===candidates.length-1?total-each*candidates.length:0))/100).toFixed(2)}));
}

function auditExpandPlayChunk(chunk){
 const configured=splitConfiguredBets(chunk);
 if(configured)return configured;
 if(S.customPlays[chunk.type]?.rule==='号码命中规则')return [chunk];
 if(!['一肖中','二肖中','三肖中','四肖中','五肖中','二连尾','三连尾','四连尾','五连尾'].includes(chunk.type))return [chunk];
 const expanded=expandGroupedZodiacBets(chunk.raw);
 if(expanded===chunk.raw)return [chunk];
 const out=[];let type=chunk.type,raw='';
 for(let i=0;i<expanded.length;){const hit=findType(expanded.slice(i));if(hit){if(raw.trim())out.push({type,raw:raw.trim()});type=hit.type;raw=hit.raw;i+=hit.length}else raw+=expanded[i++]}
 if(raw.trim())out.push({type,raw:raw.trim()});return out;
}

function auditPeriodOK(v){return /^\d{4}-\d{1,4}$/.test(String(v||''))}

function auditSignature(os){return JSON.stringify(os.map(o=>[o.market,o.period,o.customer,o.type,o.raw,o.groups,o.stakes]))}

function auditNextPeriod(p){const m=String(p).match(/^(.*?)(\d+)$/);return m?m[1]+String(+m[2]+1).padStart(m[2].length,'0'):p}

function auditReadMapping(prefix,keys){const map={};for(const k of keys){const raw=$(`${prefix}_${k}`).value.trim(),tokens=raw.split(/[\s,，、]+/).filter(Boolean);if(!tokens.length||tokens.some(t=>!/^\d{1,2}$/.test(t)||+t<1||+t>49))throw Error(k+'中存在无效号码');map[k]=tokens.map(fmt).join(' ')}const all=Object.values(map).flatMap(nums);if(all.length!==49||new Set(all).size!==49)throw Error('每套映射必须完整覆盖01—49且不能重复');return map}

function auditMarkManual(o){o.eatManual=true;eatApplySavedRules(new Set([o.market+'|'+o.period]))}

function auditBulkManual(mode,ratio){const orders=active().filter(o=>!transferOrderLocked(o));for(const o of orders){updateAllocation(o,o.stakes.map(n=>mode==='self'?n:mode==='ratio'?Math.round(n*ratio)/100:0));o.eatManual=true}delete S.eatNumberRules[eatScopeKey()];save();eatNotice='已手动分配，自动分单已暂停';render()}

function allocateAll(mode){auditBulkManual(mode)}

function allocateRatio(){const raw=$('eatRatio').value.trim(),v=Number(raw);if(raw===''||!Number.isFinite(v)||v<0||v>100)return alert('比例应在0到100之间');auditBulkManual('ratio',v)}

function auditCountMetric(label,n){return `<div class="metric"><small>${esc(label)}</small><b>${n}</b></div>`}

function wordLibraryMessage(message){const el=$('wordLibraryMessage');if(el)el.textContent=message}

function refreshWordLibrary(message){const body=$('wordLibraryBody'),title=$('wordLibraryTitle');if(body)body.innerHTML=replacementLibraryContent(message);if(title)title.textContent='公共词库'}

function persistLibraryWords(next,message){const before=S.replacements;S.replacements=next;if(!save()){S.replacements=before;wordLibraryMessage('保存失败，原词库已保留，请重试');return false}confirmed=[];auditConfirmedSignature='';refreshWordLibrary(message);return true}

function editLibraryWord(index){const r=S.replacements[index];if(!r)return;$('wordIndex').value=String(index);$('wordFrom').value=r[0];$('wordTo').value=r[1];wordLibraryMessage('正在编辑第'+(index+1)+'条，修改后点击保存词条');$('wordFrom').focus?.()}

function deleteLibraryWord(index){const r=S.replacements[index];if(!r)return false;const previousDelete=lastWordDeletion;lastWordDeletion={index,entry:[...r]};if(!persistLibraryWords(S.replacements.filter((_,i)=>i!==index),'词条已删除，不再自动替换；可撤回本次删除')){lastWordDeletion=previousDelete;return false}return true}

function undoDeleteLibraryWord(){const deleted=lastWordDeletion;if(!deleted)return false;if(S.replacements.some(r=>r[0]===deleted.entry[0])){wordLibraryMessage('已有相同查找内容，请先核对，未覆盖现有词条');return false}const next=S.replacements.map(r=>[...r]);next.splice(Math.min(deleted.index,next.length),0,[...deleted.entry]);lastWordDeletion=null;if(!persistLibraryWords(next,'已恢复删除的词条')){lastWordDeletion=deleted;return false}return true}

/* Non-mutating local integrity check; no external network or service calls. */
function runSystemDiagnostics(){
 const findings=[],check=(name,ok,detail='')=>findings.push({name,ok:!!ok,detail});
 try {
   check('双盘口期号', ['澳门','香港'].every(m=>/^\d{4}-\d{1,4}$/.test(S.periods[m])), '两盘口均须设置有效期号');
   check('客户名单', Array.isArray(S.customers)&&new Set(S.customers).size===S.customers.length, '客户名称不应重复');
   check('玩法模块', Object.entries(S.customPlays||{}).every(([name,spec])=>spec.deleted||moduleConfigValid(spec.config)), '请检查未删除玩法的配置');
   check('订单记录', Array.isArray(S.orders)&&S.orders.every(o=>Number.isFinite(o.stake)&&o.stake>=0&&Array.isArray(o.groups)&&Array.isArray(o.stakes)), '订单金额和组数应有效');
   check('订单金额对账', S.orders.every(o=>Math.abs((o.stake||0)-sum(o.stakes||[],x=>x))<0.011),'订单总额应等于每组下注的合计');
   check('自留与转出', S.orders.every(o=>{const parts=allocationParts(o);if(parts.length!==o.groups.length)return false;if(!parts.every((v,i)=>v===null||(Number.isFinite(v)&&v>=0&&v<=(+o.stakes[i]||0)+0.01)))return false;const self=sum(parts,v=>v||0);return o.self===null||o.self===undefined||Number.isFinite(o.self)&&Math.abs(o.self-self)<0.011&&self<=o.stake+0.01}), '各组自留金额不得超过下注，且自留合计须与每组相符');
   check('波色号码', ['红','蓝','绿'].every(c=>nums(S.c[c]).every(n=>n>=1&&n<=49)),'波色号码须处于01—49');
   check('走势图与记账', Array.isArray(S.draws)&&Array.isArray(S.ledger), '开奖记录与记账本应为有效列表');
   check('备份序列化', JSON.stringify(S).length>0,'确保本地数据可导出');
 } catch(e){check('自检运行',false,e.message)}
 const target=$('systemDiagnosticsResult');if(!target)return findings;
 const bad=findings.filter(x=>!x.ok);
 target.innerHTML='<p class="'+(bad.length?'red':'green')+'"><b>'+findings.filter(x=>x.ok).length+'/'+findings.length+' 项通过</b></p>'+
 findings.map(x=>'<div class="diagnostic-item"><span class="'+(x.ok?'green':'red')+'">'+(x.ok?'✓':'!')+'</span><span><b>'+esc(x.name)+'</b>'+(x.ok?'':'<small>'+esc(x.detail)+'</small>')+'</span></div>').join('');
 return findings;
}

render();
