<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><title>条件点击统计器</title><style>
:root{color-scheme:light dark;--bg:#f7f9fc;--card:#fff;--text:#17243d;--muted:#738199;--line:#e6ebf3;--blue:#0874df;--soft:#e8f4ff;--shadow:0 8px 32px #183b7010}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:900px;margin:auto;padding:20px 16px 55px}.title{font-size:23px;font-weight:750;margin:8px 0 4px}.sub{font-size:13px;color:var(--muted);margin-bottom:22px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.metric{background:var(--card);border:1px solid var(--line);border-radius:17px;text-align:center;padding:17px 6px;box-shadow:var(--shadow)}.metric small{color:var(--muted);display:block;font-size:12px}.metric strong{display:block;font-size:27px;margin-top:5px}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--blue);border-radius:15px;padding:5px;margin-bottom:17px}.tab{border:0;background:transparent;color:white;border-radius:11px;padding:13px 2px;font-size:14px;font-weight:600}.tab.active{background:white;color:var(--blue)}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:17px;box-shadow:var(--shadow)}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.heading h2{font-size:19px;margin:0}.hint{font-size:12px;color:var(--muted);text-align:right}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.tile{position:relative;min-height:82px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;cursor:pointer}.tile b{font-size:19px}.tile small{font-size:12px;color:var(--muted)}.tile.selected{background:var(--soft);border-color:#83bdf9;color:var(--blue)}.tick{position:absolute;right:7px;top:6px;color:var(--blue);font-size:13px}.pending{min-height:55px;display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--soft);color:var(--blue);border:0;border-radius:10px;padding:10px 12px;font-size:14px}.empty{color:var(--muted);font-size:13px;line-height:1.7}.btn{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:14px 8px;font-size:14px;font-weight:600;cursor:pointer}.btn:disabled{opacity:.45}.primary{width:100%;background:var(--blue);color:#fff;border:0;padding:17px;font-size:17px;margin-bottom:12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.danger{color:#e34c53}.section-title{font-size:17px;font-weight:700;margin:0 0 12px}.rank{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.rank:last-child{border:0}.rankname{width:55px;font-size:14px}.bar{height:9px;flex:1;background:var(--line);border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:20px}.ranknum{min-width:38px;text-align:right;font-size:13px}.foot{font-size:12px;color:var(--muted);text-align:center;margin:18px 0}.notice{font-size:12px;color:#bb5428;margin:8px 0}.copybox{width:100%;min-height:110px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}.mutebtn{border:0;background:none;color:var(--muted);font-size:13px;padding:7px;cursor:pointer}@media(max-width:430px){.app{padding:15px 12px 40px}.panel{padding:14px}.tiles{gap:8px}.tile{min-height:74px}.tab{font-size:12px}.actions .btn{font-size:12px}}@media(prefers-color-scheme:dark){:root{--bg:#0f1522;--card:#1a2333;--text:#eef4ff;--muted:#9aa9c0;--line:#334157;--blue:#368ef5;--soft:#1a3c61;--shadow:none}.tab.active{background:#eef4ff;color:#135eaa}}
</style></head><body><main class="app"><div class="title">条件点击统计器</div><div class="sub">选择一个或多个条件，确认后才会计入统计次数</div><section class="metrics"><div class="metric"><small>录入次数</small><strong id="batches">0</strong></div><div class="metric"><small>累计项次数</small><strong id="total">0</strong></div><div class="metric"><small>本次已选</small><strong id="pendingCount">0</strong></div></section><nav class="tabs" id="tabs"></nav><section class="panel"><div class="heading"><h2 id="categoryTitle">12生肖</h2><span class="hint">点击选择 · 再次点击取消</span></div><div class="tiles" id="tiles"></div></section><section class="panel"><div class="heading"><h2>本次待录入（<span id="pendingTitle">0</span>项）</h2><button class="mutebtn" id="clearSelection">清空选择</button></div><div class="pending" id="pending"></div></section><button class="btn primary" id="confirm">✓ 确认录入</button><div class="actions"><button class="btn" id="undo">↶ 撤回上次</button><button class="btn" id="copy">▢ 复制统计</button><button class="btn danger" id="reset">全部清零</button></div><section class="panel" style="margin-top:20px"><h2 class="section-title">统计排行榜</h2><div id="ranking"></div></section><div id="notice" class="notice" role="status" aria-live="polite"></div><div id="copyFallback" hidden class="panel"><div class="heading"><h2>手动复制统计结果</h2><button class="mutebtn" id="closeCopy">关闭</button></div><textarea id="copyText" class="copybox" readonly></textarea><p class="empty">长按上方文字，选择「全选」后复制。</p></div><p class="foot">数据仅保存在本设备浏览器中 · 建议定期复制备份</p></main><script>
(()=>{'use strict';const groups=[{id:'z',name:'12生肖',items:'鼠 牛 虎 兔 龙 蛇 马 羊 猴 鸡 狗 猪'.split(' ')},{id:'w',name:'五行',items:'金 木 水 火 土'.split(' ')},{id:'t',name:'尾数',items:Array.from({length:10},(_,i)=>i+'尾')},{id:'h',name:'头数',items:Array.from({length:5},(_,i)=>i+'头')},{id:'b',name:'波色',items:['红波','蓝波','绿波']}];const KEY='condition-counter-v1';let history=[],selected=[],tab='z';try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v?.history))history=v.history.filter(x=>Array.isArray(x)&&x.every(y=>typeof y==='string'));}catch(e){}const $=id=>document.getElementById(id);const name=k=>k.split(':').slice(1).join(':');const counts=()=>{const o={};history.forEach(batch=>batch.forEach(k=>o[k]=(o[k]||0)+1));return o};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({history}));$('notice').textContent='';return true}catch(e){$('notice').textContent='⚠ 当前浏览器无法保存数据，请立即复制统计结果备份。';return false}};const make=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};function render(){const c=counts(),g=groups.find(x=>x.id===tab);$('batches').textContent=history.length;$('total').textContent=Object.values(c).reduce((a,b)=>a+b,0);$('pendingCount').textContent=selected.length;$('pendingTitle').textContent=selected.length;$('categoryTitle').textContent=g.name;$('tabs').replaceChildren(...groups.map(x=>{const b=make('button','tab'+(tab===x.id?' active':''),x.name);b.onclick=()=>{disarm();tab=x.id;render()};return b}));$('tiles').replaceChildren(...g.items.map(item=>{const k=g.id+':'+item,b=make('button','tile'+(selected.includes(k)?' selected':''));b.type='button';if(selected.includes(k))b.append(make('span','tick','✓'));b.append(make('b','',item),make('small','',(c[k]||0)+'次'));b.onclick=()=>{disarm();selected=selected.includes(k)?selected.filter(x=>x!==k):[...selected,k];render()};return b}));const p=$('pending');p.replaceChildren();if(!selected.length)p.append(make('span','empty','请选择一个或多个条件，点击确认后才计入次数'));else selected.forEach(k=>{const b=make('button','chip',name(k)+' ×');b.onclick=()=>{disarm();selected=selected.filter(x=>x!==k);render()};p.append(b)});$('confirm').disabled=!selected.length;$('confirm').textContent='✓ 确认录入'+(selected.length?'（'+selected.length+'项各 +1）':'');$('undo').disabled=!history.length;const rank=Object.entries(c).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);const r=$('ranking');r.replaceChildren();if(!rank.length)r.append(make('div','empty','暂无统计数据'));else rank.forEach(([k,n],i)=>{const row=make('div','rank'),idx=make('span','',String(i+1)+'.'),nm=make('span','rankname',name(k)),bar=make('div','bar'),fill=make('div','fill'),num=make('span','ranknum',n+'次');fill.style.width=(100*n/rank[0][1])+'%';bar.append(fill);row.append(idx,nm,bar,num);r.append(row)})} $('clearSelection').onclick=()=>{disarm();selected=[];render()};$('confirm').onclick=()=>{disarm();if(!selected.length)return;const batch=[...selected];selected=[];history.push(batch);save();render()};$('undo').onclick=()=>{disarm();if(!history.length)return;history.pop();save();render()};let resetArmed=false;const resetButton=$('reset');function disarm(){resetArmed=false;resetButton.textContent='全部清零';resetButton.removeAttribute('aria-label')}resetButton.onclick=()=>{if(!resetArmed){resetArmed=true;resetButton.textContent='再次点击确认清零';resetButton.setAttribute('aria-label','再次点击确认清零全部统计记录');return;}history=[];selected=[];disarm();save();render()};$('closeCopy').onclick=()=>{$('copyFallback').hidden=true};$('copy').onclick=async()=>{disarm();const c=counts(),txt='条件点击统计\n录入批次：'+history.length+'\n累计项次：'+Object.values(c).reduce((a,b)=>a+b,0)+'\n\n'+groups.map(g=>g.name+'\n'+g.items.map(x=>x+'：'+(c[g.id+':'+x]||0)+'次').join('  ')).join('\n\n');let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);ok=true}}catch(e){}if(!ok){const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){}t.remove()}if(ok){$('copyFallback').hidden=true;$('notice').textContent='统计结果已复制'}else{$('copyText').value=txt;$('copyFallback').hidden=false;$('copyFallback').scrollIntoView({behavior:'smooth',block:'center'});$('notice').textContent='自动复制不可用，请长按文字手动复制'}};render()})();
</script></body></html>
