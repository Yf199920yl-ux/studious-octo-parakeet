:root{--bg:#f3f5f2;--card:#fff;--text:#203b34;--muted:#82918a;--line:#e6ebe6;--accent:#235b47;--soft:#edf3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:32px 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:30px;margin:5px 0}small,.muted{color:var(--muted)}button{font:inherit;cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:12px}button:hover{border-color:var(--accent)}button:focus-visible{outline:3px solid #a9c8b6;outline-offset:3px}.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:18px}h2{font-size:18px;margin:0 0 20px}.rowhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.rowhead h2{margin:0}.rounds{display:flex;gap:10px;flex-wrap:wrap}.round{padding:0;width:49px;height:49px;border-radius:50%;font-size:18px;background:var(--soft);border:1px solid transparent}.round[aria-pressed=true]{background:var(--accent);color:white;box-shadow:0 3px 8px #235b4725}.group{padding:22px 0;border-bottom:1px solid var(--line)}.group:first-child{padding-top:0}.group:last-child{border:0;padding-bottom:0}.index{font-size:12px;letter-spacing:2px;color:var(--muted);margin-right:9px}.plain{border:0;padding:3px;background:none;color:var(--muted);font-size:13px}.hint{font-size:12px;color:var(--muted);line-height:1.8;margin:14px 0 0}.result{min-height:155px}.result.main{background:var(--accent);color:#fff;border-color:var(--accent)}.result.main .muted,.result.main .hint{color:#c5d6cd}.count{font-size:13px;color:var(--muted)}.balls{display:flex;gap:9px;flex-wrap:wrap}.ball{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17 ng:4px 9px;margin-left:5px;background:var(--soft);border-radius:12px;vertical-align:1px}.result.main h2 .muted{background:#007aff12}.ball,.result.main .ball{width:43px;height:43px;border:0;background:var(--soft);font-size:17px;box-shadow:inset 0 0 0 1px #00000003;font-variant-numeric:tabular-nums}.ball.red{color:#ff3b30;background:#ff3b300d}.ball.blue{color:#007aff;background:#007aff0d}.ball.green{color:#22a75a;background:#34c7590e}.empty{font-size:14px;padding:12px 0}details summary{list-style:none;font-size:16px;display:flex;align-items:center;gap:7px}details summary::-webkit-details-marker{display:none}details summary:after{content:'›';margin-left:auto;color:#aeaeb2;font-size:26px;font-weight:400}details[open] summary:after{transform:rotate(90deg)}details summary small{font-size:12px;font-weight:400}select,input{border-radius:9px;border:0;padding:9px}td,th{border-color:var(--line)}#save{background:#007aff;color:white}#restore{color:#ff3b30;background:var(--soft)}.toast{background:#323235e8;backdrop-filter:blur(20px);border-radius:18px;box-shadow:0 8px 30px #0002}footer{line-height:1.8;font-size:11px}
@media(max-width:800px){main{padding:8px 16px 25px}header{padding:14px 0 20px;margin-bottom:8px}h1{font-size:32px}.card{padding:21px 20px;border-radius:20px;margin-bottom:18px}.round{width:45px;height:45px}.rounds{gap:10px}.layout{gap:0}.group{padding:20px 0}header button{padding:10px 14px;font-size:13px}}

@media(prefers-reduced-motion:reduce){button{transition:none}}

.numbers-card{padding:0 24px}.numbers-card .result,.numbers-card .result.main{background:none;border:0;border-radius:0;box-shadow:none;margin:0;padding:23px 0;min-height:124px}.numbers-card .result+.result{border-top:1px solid var(--line)}.numbers-card .result:last-child{padding-bottom:25px}.numbers-card .rowhead{margin-bottom:16px}.numbers-card .empty{padding:5px 0}.numbers-card .balls{min-height:35px}header{padding-top:12px}h1{margin:0}header button{margin-top:2px}details summary small{display:none}@media(max-width:800px){.numbers-card{padding:0 20px}.numbers-card .result,.numbers-card .result.main{padding:21px 0;min-height:112px}}

</style><main><header><div><h1>选号助手</h1></div><button id="reset">清空选择</button></header><div class="layout"><section><div class="card" id="filters"></div><div class="card"><div class="rowhead"><h2>生肖分组</h2></div><div class="rounds" id="groups"></div><p id="groupHint" hidden></p></div></section><section><div class="card numbers-card" id="results"></div><div class="card"><details id="settings"><summary>映射设置 <small>生肖 · 五行 · 波色</small></summary><label>映射名称 <input id="mapName" maxlength="24" style="width:160px"></label><div class="scroll"><table><thead><tr><th>号码</th><th>生肖</th><th>五行</th><th>波色</th></tr></thead><tbody id="mapping"></tbody></table></div><div class="tools" style="margin-top:16px"><button id="save">保存映射</button><button id="restore">恢复默认映射</button></div></details></div></section></div></main><div class="toast" id="toast" role="status"></div>
<script>
const animals=[...'鼠牛虎兔龙蛇马羊猴鸡狗猪'], elements=[...'金木水火土'];
const animalNums=['07 19 31 43','06 18 30 42','05 17 29 41','04 16 28 40','03 15 27 39','02 14 26 38','01 13 25 37 49','12 24 36 48','11 23 35 47','10 22 34 46','09 21 33 45','08 20 32 44'];
const elemNums=['04 05 12 13 26 27 34 35 42 43','08 09 16 17 24 25 38 39 46 47','01 14 15 22 23 30 31 44 45','02 03 10 11 18 19 32 33 40 41 48 49','06 07 20 21 28 29 36 37'];
const colors=['红','蓝','绿'],colorNums=['01 07 13 19 23 29 35 45 02 08 12 18 24 30 34 40 46','03 09 15 25 31 37 41 47 04 10 14 20 26 36 42 48','05 11 17 21 27 33 39 43 49 06 16 22 28 32 38 44'];
const groups={家:'牛马羊鸡狗猪',野:'鼠虎兔龙蛇猴',天:'龙兔牛马猴猪',地:'鼠虎蛇羊鸡狗'};
const defaults=Array.from({length:49},(_,i)=>{const n=String(i+1).padStart(2,'0');return {n:i+1,a:animals[animalNums.findIndex(s=>s.split(' ').includes(n))],e:elements[elemNums.findIndex(s=>s.split(' ').includes(n))],c:colors[colorNums.findIndex(s=>s.split(' ').includes(n))]}});
let state={a:[],e:[],t:[],h:[],c:[],g:'',name:'2026 · 马年',map:structuredClone(defaults)};
try{let saved=JSON.parse(localStorage.getItem('pick-assistant-v1'));if(saved&&saved.map?.length===49)state={...state,...saved}}catch(e){}
const defs=[['a','生肖',animals],['e','五行',elements],['t','尾数',Array.from({length:10},(_,i)=>String(i))],['h','头数',Array.from({length:5},(_,i)=>String(i))],['c','波色',colors]];
const $=s=>document.querySelector(s);let result={};
function persist(){try{localStorage.setItem('pick-assistant-v1',JSON.stringify(state))}catch(e){toast('浏览器未能保存，请导出备份')}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}
function matches(m,key,value){return !state[key].length||state[key].includes(String(value))}
function calculate(){if(!state.g&&!['a','e','t','h','c'].some(key=>state[key].length))return {main:[],sub:[],defense:[]};const base=state.map.filter(m=>(!state.a.length||state.a.includes(m.a))&&matches(m,'e',m.e)&&matches(m,'t',m.n%10));const full=base.filter(m=>matches(m,'h',Math.floor(m.n/10))&&matches(m,'c',m.c));const main=state.g?full.filter(m=>groups[state.g].includes(m.a)):[];const sub=full.filter(m=>!main.includes(m));const defense=base.filter(m=>!full.includes(m));return {main,sub,defense}}
function render(){
$('#filters').innerHTML=defs.map(([k,title,vals],i)=>`<div class="group"><div class="rowhead"><h2>${title}</h2><button class="plain" data-clear="${k}">清除</button></div><div class="rounds">${vals.map(v=>`<button class="round" data-key="${k}" data-val="${v}" aria-label="${title}${v}" aria-pressed="${state[k].includes(v)}">${v}</button>`).join('')}</div></div>`).join('');
$('#groups').innerHTML=Object.keys(groups).map(g=>`<button class="round" data-group="${g}" aria-pressed="${state.g===g}">${g}</button>`).join('');$('#groupHint').textContent=state.g?`${state.g}肖：${[...groups[state.g]].join(' · ')}`:'选择家、野、天、地，为主号增加一层筛选。';
result=calculate();const labels={main:['主号','生肖 ∩ 五行 ∩ 尾数 ∩ 头数 ∩ 波色 ∩ 分组'],sub:['副号','满足全部分类条件，排除主号'],defense:['防号','满足生肖、五行、尾数，排除主号与副号']};
$('#results').innerHTML=Object.entries(labels).map(([k,[label,desc]])=>`<div class="result ${k}"><div class="rowhead"><h2>${label} <span class="${k==='main'?'muted':'count'}">${result[k].length} 个</span></h2>${k==='main'?'<button class="plain" data-copy="all">复制全部</button>':''}</div><div class="balls">${result[k].length?result[k].map(m=>`<span class="ball ${['red','blue','green'][colors.indexOf(m.c)]}" title="${m.a} · ${m.e} · ${m.c}波">${String(m.n).padStart(2,'0')}</span>`).join(''):`<div class="empty">${!state.g&&!['a','e','t','h','c'].some(key=>state[key].length)?'请选择条件':k==='main'&&!state.g?'请选择分组':'暂无号码'}</div>`}</div></div>`).join('');persist()}
function editor(){ $('#mapName').value=state.name;$('#mapping').innerHTML=state.map.map(m=>`<tr><td>${String(m.n).padStart(2,'0')}</td>${[['a',animals],['e',elements],['c',colors]].map(([k,vals])=>`<td><select aria-label="${m.n}号${{a:'生肖',e:'五行',c:'波色'}[k]}" data-num="${m.n}" data-field="${k}">${vals.map(v=>`<option ${v===m[k]?'selected':''}>${v}</option>`).join('')}</select></td>`).join('')}</tr>`).join('') }
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.key){const {key,val}=b.dataset;state[key]=state[key].includes(val)?state[key].filter(x=>x!==val):[...state[key],val];render()}if(b.dataset.clear){state[b.dataset.clear]=[];render()}if(b.dataset.group){state.g=state.g===b.dataset.group?'':b.dataset.group;render()}if(b.dataset.copy){if(!Object.values(result).some(rows=>rows.length))return toast('暂无号码可复制');const s='特：'+['main','sub','defense'].filter(key=>result[key].length).map(key=>result[key].map(m=>String(m.n).padStart(2,'0')).join(' ')+'各').join('\n');try{await navigator.clipboard.writeText(s);toast('已复制号码')}catch(e){const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('已复制号码')}}});
$('#reset').onclick=()=>{for(const [k] of defs)state[k]=[];state.g='';render()};$('#save').onclick=()=>{document.querySelectorAll('#mapping select').forEach(s=>state.map[Number(s.dataset.num)-1][s.dataset.field]=s.value);state.name=$('#mapName').value.trim()||'自定义映射';render();toast('映射已保存，全局生效')};$('#restore').onclick=()=>{state.map=structuredClone(defaults);state.name='2026 · 马年';editor();render();toast('已恢复默认映射')};render();editor();
</script></html>
